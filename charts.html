<style>
:root{--bg:#0a0418;--card:#150b38;--soft:rgba(255,255,255,.07);--muted:#b9aee0;--accent:#a98bff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;font-weight:400}
body{margin:0;min-height:100vh;color:#fff;font:400 1.05rem/1.5 "Jua","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 15% 8%,rgba(110,60,220,.35),transparent 40%),radial-gradient(circle at 85% 92%,rgba(120,50,230,.3),transparent 45%),radial-gradient(circle,rgba(255,255,255,.18) 1px,transparent 1.6px) 0 0/46px 46px,var(--bg);background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 56px}
a{color:inherit}
.nav{display:flex;gap:18px;font-size:.95rem;margin-bottom:14px}
.nav a{color:var(--muted);text-decoration:none}
.nav a:hover,.nav a:focus-visible{color:#fff}
h1{font-size:2.8rem;margin:0;line-height:1.1}
.lead{color:var(--muted);margin:6px 0 0}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.tab{font:inherit;font-size:1.1rem;color:#fff;cursor:pointer;background:var(--soft);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 20px}
.tab small{color:var(--muted);font-size:.85rem;margin-left:6px}
.tab.on{background:#fff;color:#12082e;border-color:#fff}
.tab.on small{color:#5b4d8c}
.tab:focus-visible,.kit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-top:22px}
.head h2{font-size:1.7rem;margin:0;line-height:1.2}
.head p{margin:2px 0 0;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.95rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #0a0418;flex:none}
.easy{--c:#5fe3a1}.moderate{--c:#ffd166}.hard{--c:#ff6b81}.extreme{--c:#a98bff}
.chart{margin-top:14px;border:4px solid #fff;background:rgba(8,3,26,.92)}
.row{display:flex;border-top:4px solid #fff}
.row:first-child{border-top:0}
.lab{width:120px;flex:none;border-right:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 6px;font-size:2.8rem;line-height:1}
.lab small{font-size:.85rem;color:var(--muted);margin-top:8px}
.kits{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:12px}
.kit{position:relative;display:block;width:72px;height:72px;border:3px solid #fff;border-radius:12px;background:#0d0626;text-decoration:none;transition:transform .12s,border-color .12s}
.kit img{width:100%;height:100%;object-fit:contain;display:block;border-radius:9px}
.kit .dot{position:absolute;top:-5px;right:-5px}
.kit:hover,.kit:focus-visible{transform:translateY(-3px);border-color:var(--accent)}
.empty{color:var(--muted);font-size:.95rem;align-self:center}
#tip{position:fixed;z-index:20;pointer-events:none;background:#fff;color:#12082e;border-radius:10px;padding:5px 12px;font-size:1rem;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.45);opacity:0;transition:opacity .1s}
#tip.show{opacity:1}
.foot{margin-top:18px;color:var(--muted);font-size:.9rem}
@media(max-width:640px){
  h1{font-size:2.2rem}
  .lab{width:62px;font-size:1.7rem;padding:8px 4px}
  .lab small{font-size:.75rem}
  .kits{gap:8px;padding:10px}
  .kit{width:54px;height:54px;border-width:2px;border-radius:10px}
  .kit img{border-radius:8px}
}
</style>
</head>

  <p class="foot">The dot on each kit shows its difficulty.</p>

var $ = function(id){return document.getElementById(id);};
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
var cur = 0;
function pick(){
  var h = location.hash.replace("#","");
  for(var i=0;i<LISTS.length;i++) if(LISTS[i].id===h) return i;
  return 0;
}
function render(){
  var L = LISTS[cur];
  $("tabs").innerHTML = LISTS.map(function(l,i){
    return '<button class="tab'+(i===cur?' on':'')+'" role="tab" aria-selected="'+(i===cur)+'" data-i="'+i+'">'+esc(l.name)+(l.sub?'<small>'+esc(l.sub)+'</small>':'')+'</button>';
  }).join("");
  $("ttl").textContent = L.subt || (L.name + " tier list");
  $("note").textContent = L.note || "";
  $("chart").innerHTML = L.rows.map(function(r){
    var ks = r.kits.map(function(n){
      var k = KITS[n]; if(!k) return "";
      return '<a class="kit" href="kit-machine.html#'+k.s+'" data-name="'+esc(n)+'" aria-label="'+esc(n)+'">'+
        '<img src="'+esc(k.i)+'" alt="" loading="lazy">'+(k.d?'<i class="dot '+k.d+'"></i>':'')+'</a>';
    }).join("");
    return '<div class="row"><div class="lab">'+esc(r.label)+'<small>'+r.kits.length+' kit'+(r.kits.length===1?'':'s')+'</small></div>'+
      '<div class="kits">'+(ks || '<span class="empty">No kits</span>')+'</div></div>';
  }).join("");
}
document.addEventListener("click",function(e){
  var t = e.target.closest(".tab"); if(!t) return;
  cur = +t.dataset.i; history.replaceState(null,"","#"+LISTS[cur].id); hideTip(); render();
});
window.addEventListener("hashchange",function(){ cur = pick(); render(); });
var tip = $("tip"), tipFor = null;
function showTip(el){
  tipFor = el; tip.textContent = el.dataset.name; tip.classList.add("show");
  var r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  var x = Math.max(8, Math.min(r.left + r.width/2 - w/2, innerWidth - w - 8));
  var y = r.top - h - 10; if(y < 8) y = r.bottom + 10;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}
function hideTip(){ tipFor = null; tip.classList.remove("show"); }
document.addEventListener("mouseover",function(e){ var k = e.target.closest(".kit"); if(k){ if(k!==tipFor) showTip(k); } else if(tipFor) hideTip(); });
document.addEventListener("focusin",function(e){ var k = e.target.closest(".kit"); if(k) showTip(k); });
document.addEventListener("focusout",hideTip);
window.addEventListener("scroll",hideTip,{passive:true});
cur = pick(); render();
