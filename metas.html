:root{--bg:#0a0418;--muted:#b9aee0;--accent:#a98bff;color-scheme:dark}

rid": "images/kits/sigrid.webp", "Silas": "images/kits/silas.webp", "Skoll": "images/kits/skoll.webp", "Smoke": "images/kits/smoke.webp", "Sophia": "images/kits/sophia.webp", "Spirit Catcher": "images/kits/spirit-catcher.webp", "Star Collector Stella": "images/kits/star-collector-stella.webp", "Styx": "images/kits/styx.webp", "Taliyah": "images/kits/taliyah.webp", "Terra": "images/kits/terra.webp", "Trapper": "images/kits/trapper.webp", "Trinity": "images/kits/trinity.webp", "Triton": "images/kits/triton.webp", "Trixie": "images/kits/trixie.webp", "Uma": "images/kits/uma.webp", "Umbra": "images/kits/umbra.webp", "Umeko": "images/kits/umeko.webp", "Vanessa": "images/kits/vanessa.webp", "Void Knight": "images/kits/void-knight.webp", "Void Regent": "images/kits/void-regent.webp", "Vulcan": "images/kits/vulcan.webp", "Warden": "images/kits/warden.webp", "Warrior": "images/kits/warrior.webp", "Whim": "images/kits/whim.webp", "Whisper": "images/kits/whisper.webp", "Wren": "images/kits/wren.webp", "Xu'rot": "images/kits/xu-rot.webp", "Yamini": "images/kits/yamini.webp", "Yeti": "images/kits/yeti.webp", "Yuzi": "images/kits/yuzi.webp", "Zarrah": "images/kits/zarrah.webp", "Zenith": "images/kits/zenith.webp", "Zeno": "images/kits/zeno.webp", "Zephyr": "images/kits/zephyr.webp", "Zola": "images/kits/zola.webp"};
var MODES=["All","Duos","Squads","Duels","Ranked Squads","Ranked 5v5","16v16"], cur="All";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function img(n){return KITS[n]||"";}
function card(m,i){
  var n=m.kits.length;
  return '<section class="meta" id="'+slug(m.title)+'"><div class="mtop"><img class="logo" src="images/logo.png" alt=""><span class="brand"><b>Bedwars User Guide</b><small>Metas</small></span><span class="mode">'+esc(m.mode)+'</span></div>'+
   '<h2>'+esc(m.title)+'</h2><div class="row" style="--n:'+n+'">'+m.kits.map(function(k){
     var hk=match(k.kit), ha=k.alt&&k.alt!=='Core'&&match(k.alt);
     return '<a class="box'+(hk?' hit':'')+'" href="kit-machine.html#'+slug(k.kit)+'" title="'+esc(k.kit)+(k.alt==='Core'?' (Core)':k.alt?' (or '+esc(k.alt)+')':'')+'"><img class="trim" src="'+esc(img(k.kit))+'" alt="'+esc(k.kit)+'">'+
       (k.alt==='Core'?'<span class="alt core" title="Core: no kit can replace this one">CORE</span>':k.alt?'<span class="alt'+(ha?' hit':'')+'" data-k="'+slug(k.alt)+'" title="Replacement: '+esc(k.alt)+'"><img class="trim" src="'+esc(img(k.alt))+'" alt="'+esc(k.alt)+'"></span>':'<span class="alt empty"></span>')+'<span class="kn">'+esc(k.kit)+(k.alt==='Core'?' (Core)':k.alt?' / '+esc(k.alt):'')+'</span></a>';
   }).join('')+'</div><div class="text">'+m.text.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</div>'+
   '<div class="tools"><button type="button" data-dl="'+i+'">Download image</button></div></section>';
}
function render(){
  document.getElementById("modes").innerHTML=MODES.map(function(m){return '<button type="button" class="'+(m===cur?'on':'')+'" data-m="'+m+'">'+m+'</button>';}).join('');
  var L=METAS.map(function(m,i){return [m,i];}).filter(function(x){return (cur==="All"||x[0].mode===cur)&&(!Q||x[0].kits.some(function(k){return match(k.kit)||(k.alt&&k.alt!=='Core'&&match(k.alt));}));});
  document.getElementById("list").innerHTML=L.length?L.map(function(x){return card(x[0],x[1]);}).join(''):'<p class="empty-note">'+(!METAS.length?'Metas are coming soon.':Q?'No metas with "'+esc(Q)+'"'+(cur==="All"?'':' in '+cur)+' yet.':'No metas for '+cur+' yet.')+'</p>';
  centerAll();
}
var Q="";
function norm(t){return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");}
function match(n){return !!Q&&norm(n).indexOf(norm(Q))>=0;}
document.getElementById("kitlist").innerHTML=Object.keys(KITS).map(function(n){return '<option value="'+esc(n)+'">';}).join('');
document.getElementById("q").oninput=function(){Q=this.value.trim(); if(!norm(Q))Q=""; render();};
/* center each kit picture on its visible part (the image files have uneven empty space) */
var BOX={};
function bounds(im){ if(BOX[im.src]) return BOX[im.src]; var w=im.naturalWidth,h=im.naturalHeight,r={x:0,y:0,w:w,h:h};
  try{ var c=document.createElement("canvas"); c.width=w; c.height=h; var x=c.getContext("2d"); x.drawImage(im,0,0); var d=x.getImageData(0,0,w,h).data, a=w,b=h,e=-1,f=-1;
    for(var y=0;y<h;y++)for(var X=0;X<w;X++) if(d[(y*w+X)*4+3]>12){ if(X<a)a=X; if(X>e)e=X; if(y<b)b=y; if(y>f)f=y; }
    if(e>=0) r={x:a,y:b,w:e-a+1,h:f-b+1}; }catch(err){}
  return BOX[im.src]=r; }
var CROP={};
function centerImg(el){ if(el.dataset.done) return; var go=function(){ var src=el.src; if(!CROP[src]){ var r=bounds(el); if(!r.w) return;
      var S=Math.ceil(Math.max(r.w,r.h)*1.04), c=document.createElement("canvas"); c.width=c.height=S;
      c.getContext("2d").drawImage(el,r.x,r.y,r.w,r.h,(S-r.w)/2,(S-r.h)/2,r.w,r.h);
      try{ CROP[src]=c.toDataURL("image/png"); }catch(err){ return; } }
    el.dataset.done=1; el.src=CROP[src]; };
  if(el.complete&&el.naturalWidth) go(); else el.addEventListener("load",go,{once:true}); }
function centerAll(){ [].forEach.call(document.querySelectorAll("img.trim"),centerImg); }
document.getElementById("modes").onclick=function(e){var b=e.target.closest("button"); if(!b) return; cur=b.dataset.m; render();};
function loadImg(s){return new Promise(function(r){ if(!s){r(null);return;} var i=new Image(); i.onload=function(){r(i);}; i.onerror=function(){r(null);}; i.src=s; });}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,t,maxW){var w=t.split(" "),L=[],s="";w.forEach(function(x){var tt=s?s+" "+x:x; if(c.measureText(tt).width>maxW&&s){L.push(s);s=x;}else s=tt;}); if(s)L.push(s); return L;}
function tab(c,x,y,s,tr,bl){c.beginPath();c.moveTo(x,y);c.lineTo(x+s-tr,y);c.arcTo(x+s,y,x+s,y+tr,tr);c.lineTo(x+s,y+s);c.lineTo(x+bl,y+s);c.arcTo(x,y+s,x,y+s-bl,bl);c.closePath();}
function fit(c,im,x,y,size){ var r=bounds(im), k=size/Math.max(r.w,r.h), w=r.w*k, h=r.h*k; c.drawImage(im,r.x,r.y,r.w,r.h,x+(size-w)/2,y+(size-h)/2,w,h); }
function draw(m){
  var F='"Jua","Trebuchet MS",sans-serif', W=1600, n=m.kits.length;
  var srcs=["images/tierlist-bg.jpg","images/logo.png"]; m.kits.forEach(function(k){srcs.push(img(k.kit)); srcs.push(k.alt&&k.alt!=='Core'?img(k.alt):"");});
  return Promise.all([document.fonts?document.fonts.load('40px "Jua"').catch(function(){}):null].concat(srcs.map(loadImg))).then(function(r){
    var bg=r[1],logo=r[2],ki=r.slice(3);
    var cv=document.createElement("canvas"), c=cv.getContext("2d"); c.font='38px '+F;
    var lines=[]; m.text.forEach(function(t){lines=lines.concat(wrap(c,t,W-220));});
    var gap=30, bw=Math.min(280,(W-160-gap*(n-1))/n), top=250, H=top+bw+70+lines.length*50+60;
    cv.width=W; cv.height=H; c=cv.getContext("2d");
    if(bg){ var s=Math.max(W/bg.width,H/bg.height); c.drawImage(bg,(W-bg.width*s)/2,(H-bg.height*s)/2,bg.width*s,bg.height*s);} else {c.fillStyle="#0a0418";c.fillRect(0,0,W,H);}
    c.fillStyle="rgba(10,4,24,.4)"; c.fillRect(0,0,W,H);
    if(logo){ c.save(); c.shadowColor="rgba(169,139,255,.6)"; c.shadowBlur=20; c.drawImage(logo,40,30,100,100); c.restore(); }
    c.fillStyle="#fff"; c.textBaseline="middle"; c.font='34px '+F; c.fillText("Bedwars User Guide",155,68); c.fillStyle="#b9aee0"; c.font='24px '+F; c.fillText("Metas · "+m.mode,155,104);
    c.fillStyle="#fff"; c.textAlign="center"; c.font='64px '+F; c.shadowColor="rgba(0,0,0,.5)"; c.shadowBlur=12; c.fillText(m.title,W/2,180); c.shadowBlur=0;
    var x0=(W-(bw*n+gap*(n-1)))/2;
    m.kits.forEach(function(k,i){ var x=x0+i*(bw+gap), y=top, a=ki[i*2], b=ki[i*2+1];
      var LINE="rgba(196,178,255,.35)"; rr(c,x,y,bw,bw,30); var gr=c.createLinearGradient(0,y,0,y+bw); gr.addColorStop(0,"rgba(44,26,98,.62)"); gr.addColorStop(1,"rgba(18,9,50,.72)"); c.fillStyle=gr; c.fill(); c.lineWidth=2; c.strokeStyle=LINE; c.stroke();
      if(a){ var p=bw*.14; c.save(); c.shadowColor="rgba(0,0,0,.5)"; c.shadowBlur=14; fit(c,a,x+p,y+p,bw-2*p); c.restore(); }
      var s=bw*.3, ax=x+bw-s, ay=y; c.fillStyle="rgba(14,6,40,.75)"; tab(c,ax,ay,s,30,20); c.fill(); c.lineWidth=2; c.strokeStyle=LINE;
      var core=k.alt==='Core'; if(!b&&!core){ c.setLineDash([10,8]); c.globalAlpha=.5; } tab(c,ax,ay,s,30,20); c.stroke(); c.setLineDash([]); c.globalAlpha=1;
      if(b){ c.save(); tab(c,ax,ay,s,30,20); c.clip(); fit(c,b,ax+s*.1,ay+s*.1,s*.8); c.restore(); } if(core){ c.save(); c.fillStyle="#ffd166"; c.textAlign="center"; c.font=Math.round(s*.26)+'px '+F; c.fillText("CORE",ax+s/2,ay+s/2+2); c.restore(); }
    });
    c.font='38px '+F; c.fillStyle="#fff"; c.shadowColor="rgba(0,0,0,.6)"; c.shadowBlur=8;
    lines.forEach(function(L,i){ c.fillText(L,W/2,top+bw+80+i*50); });
    return cv;
  });
}
document.getElementById("list").onclick=function(e){ var al=e.target.closest(".alt[data-k]"); if(al){ e.preventDefault(); location.href="kit-machine.html#"+al.dataset.k; return; } var b=e.target.closest("[data-dl]"); if(!b) return; var m=METAS[+b.dataset.dl]; b.disabled=true; b.textContent="Making image...";
  draw(m).then(function(cv){ cv.toBlob(function(bl){ var a=document.createElement("a"); a.href=URL.createObjectURL(bl); a.download=slug(m.title)+"-meta.png"; document.body.appendChild(a); a.click(); a.remove(); b.disabled=false; b.textContent="Download image"; },"image/png"); }); };
render();
