<head>

<title>Metas · Bedwars User Guide</title>
<meta name="description" content="Team metas for every BedWars mode: which kits to run together, each kit's role, and replacements.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0a0418;--muted:#b9aee0;--accent:#a98bff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font:400 1.05rem/1.5 "Jua","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 15% 30%,rgba(110,60,220,.3),transparent 40%),radial-gradient(circle at 85% 92%,rgba(120,50,230,.28),transparent 45%),radial-gradient(circle,rgba(255,255,255,.4) 1px,transparent 1.6px) 0 0/87px 87px,radial-gradient(circle,rgba(180,156,255,.32) 2px,transparent 2.8px) 37px 51px/131px 131px,var(--bg);background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom,0)}

main{max-width:1180px;margin:0 auto;padding:28px 18px 60px}
h1{font-weight:400;font-size:2rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.modes button{font:inherit;color:#fff;background:transparent;border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 16px;cursor:pointer}
.modes button.on{background:#fff;color:#150b38;border-color:#fff}
.meta{position:relative;border-radius:22px;overflow:hidden;margin:0 0 26px;border:2px solid rgba(255,255,255,.85);background:linear-gradient(rgba(10,4,24,.35),rgba(10,4,24,.55)),url(images/tierlist-bg.jpg) center/cover;padding:22px 26px 26px}
.mtop{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mtop img.logo{width:58px;height:58px;filter:drop-shadow(0 0 10px rgba(169,139,255,.55))}
.mtop .brand b{display:block;font-weight:400;font-size:1.05rem}.mtop .brand small{color:var(--muted)}
.mtop .mode{margin-left:auto;border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:3px 14px;font-size:.95rem}
.meta h2{font-weight:400;font-size:2.3rem;text-align:center;margin:0 0 16px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.row{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:clamp(8px,2vw,26px);margin:0 auto 18px;max-width:1080px}
.box{position:relative;aspect-ratio:1;border:4px solid #fff;border-radius:22px;display:block}
.box>img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.alt{position:absolute;top:-4px;right:-4px;width:34%;aspect-ratio:1;border:4px solid #fff;border-radius:16px;background:rgba(21,11,56,.85);display:grid;place-items:center;overflow:hidden}
.alt img{width:92%;height:92%;object-fit:contain}
.alt.empty{border-style:dashed;opacity:.45}
.box .kn{position:absolute;left:0;right:0;bottom:-1.6em;text-align:center;font-size:.92rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.text{margin:30px auto 0;max-width:980px;text-align:center;font-size:clamp(1rem,1.6vw,1.45rem);line-height:1.45;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.text p{margin:0 0 6px}
.tools{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.tools button{font:inherit;color:#fff;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 14px;cursor:pointer}
.tools button:hover{border-color:#fff}
.empty-note{color:var(--muted);text-align:center;padding:40px 0}
@media(max-width:640px){.row{grid-template-columns:repeat(3,1fr)}.meta h2{font-size:1.7rem}}
</style>
<link rel="icon" href="images/favicon.png">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header class="site-head"><a class="brand" href="index.html"><img src="images/logo.png" alt="" width="96" height="96"><span><b>Bedwars User Guide</b><small>Kits, tiers, damage and more</small></span></a></header>
<nav class="site-nav" aria-label="Pages"><div class="in"><a href="index.html">Home</a><a href="kit-machine.html">Kit Machine</a><a href="charts.html">Tier Lists</a><a href="calculator.html">Damage Calculator</a><a href="randomizer.html">Kit Randomizer</a><a href="guides.html">Guides</a><a href="metas.html" aria-current="page">Metas</a><a href="updates.html">Update Log</a></div></nav>

<main>
<h1>Metas</h1>
<p class="sub">Team setups for each mode. Each card shows the kits, what each one does, and a replacement for each spot (top right).</p>
<div class="modes" id="modes"></div>
<div id="list"></div>
</main>
<script>
var METAS=[], KITS={"Abaddon": "images/kits/abaddon.webp", "Adetunde": "images/kits/adetunde.webp", "Aery": "images/kits/aery.webp", "Agni": "images/kits/agni.webp", "Alchemist": "images/kits/alchemist.webp", "Arachne": "images/kits/arachne.webp", "Archer": "images/kits/archer.webp", "Ares": "images/kits/ares.webp", "Axolotl Amy": "images/kits/axolotl-amy.webp", "Baker": "images/kits/baker.webp", "Barbarian": "images/kits/barbarian.webp", "Beekeeper Beatrix": "images/kits/beekeeper-beatrix.webp", "Bekzat": "images/kits/bekzat.webp", "Bounty Hunter": "images/kits/bounty-hunter.webp", "Builder": "images/kits/builder.webp", "Caitlyn": "images/kits/caitlyn.webp", "Cobalt": "images/kits/cobalt.webp", "Cogsworth": "images/kits/cogsworth.webp", "Conqueror": "images/kits/conqueror.webp", "Crocowolf": "images/kits/crocowolf.webp", "Crypt": "images/kits/crypt.webp", "Cyber": "images/kits/cyber.webp", "Death Adder": "images/kits/death-adder.webp", "Dino Tamer Dom": "images/kits/dino-tamer-dom.webp", "Drill": "images/kits/drill.webp", "Eldertree": "images/kits/eldertree.webp", "Eldric": "images/kits/eldric.webp", "Elektra": "images/kits/elektra.webp", "Ember": "images/kits/ember.webp", "Evelynn": "images/kits/evelynn.webp", "Farmer Cletus": "images/kits/farmer-cletus.webp", "Fisherman": "images/kits/fisherman.webp", "Flora": "images/kits/flora.webp", "Fortuna": "images/kits/fortuna.webp", "Freiya": "images/kits/freiya.webp", "Frosty": "images/kits/frosty.webp", "Gingerbread Man": "images/kits/gingerbread-man.webp", "Gompy": "images/kits/gompy.webp", "Gregory": "images/kits/gregory.webp", "Grim Reaper": "images/kits/grim-reaper.webp", "Grove": "images/kits/grove.webp", "Hannah": "images/kits/hannah.webp", "Hephaestus": "images/kits/hephaestus.webp", "Ignis": "images/kits/ignis.webp", "Infernal Shielder": "images/kits/infernal-shielder.webp", "Isabel": "images/kits/isabel.webp", "Jack": "images/kits/jack.webp", "Jade": "images/kits/jade.webp", "Kaida": "images/kits/kaida.webp", "Kaliyah": "images/kits/kaliyah.webp", "Krystal": "images/kits/krystal.webp", "Lani": "images/kits/lani.webp", "Lassy": "images/kits/lassy.webp", "Lian": "images/kits/lian.webp", "Lucía": "images/kits/lucia.webp", "Lumen": "images/kits/lumen.webp", "Lyla": "images/kits/lyla.webp", "Marcel": "images/kits/marcel.webp", "Marina": "images/kits/marina.webp", "Marrow": "images/kits/marrow.webp", "Martin": "images/kits/martin.webp", "Melody": "images/kits/melody.webp", "Merchant Marco": "images/kits/merchant-marco.webp", "Metal Detector": "images/kits/metal-detector.webp", "Milo": "images/kits/milo.webp", "Miner": "images/kits/miner.webp", "Nahla": "images/kits/nahla.webp", "Nazar": "images/kits/nazar.webp", "Noelle": "images/kits/noelle.webp", "Nyoka": "images/kits/nyoka.webp", "Nyx": "images/kits/nyx.webp", "Pirate Davey": "images/kits/pirate-davey.webp", "Pyro": "images/kits/pyro.webp", "Ragnar": "images/kits/ragnar.webp", "Ramil": "images/kits/ramil.webp", "Raven": "images/kits/raven.webp", "Santa": "images/kits/santa.webp", "Sheep Herder": "images/kits/sheep-herder.webp", "Sheila": "images/kits/sheila.webp", "Sigrid": "images/kits/sigrid.webp", "Silas": "images/kits/silas.webp", "Skoll": "images/kits/skoll.webp", "Smoke": "images/kits/smoke.webp", "Sophia": "images/kits/sophia.webp", "Spirit Catcher": "images/kits/spirit-catcher.webp", "Star Collector Stella": "images/kits/star-collector-stella.webp", "Styx": "images/kits/styx.webp", "Taliyah": "images/kits/taliyah.webp", "Terra": "images/kits/terra.webp", "Trapper": "images/kits/trapper.webp", "Trinity": "images/kits/trinity.webp", "Triton": "images/kits/triton.webp", "Trixie": "images/kits/trixie.webp", "Uma": "images/kits/uma.webp", "Umbra": "images/kits/umbra.webp", "Umeko": "images/kits/umeko.webp", "Vanessa": "images/kits/vanessa.webp", "Void Knight": "images/kits/void-knight.webp", "Void Regent": "images/kits/void-regent.webp", "Vulcan": "images/kits/vulcan.webp", "Warden": "images/kits/warden.webp", "Warrior": "images/kits/warrior.webp", "Whim": "images/kits/whim.webp", "Whisper": "images/kits/whisper.webp", "Wren": "images/kits/wren.webp", "Xu'rot": "images/kits/xu-rot.webp", "Yamini": "images/kits/yamini.webp", "Yeti": "images/kits/yeti.webp", "Yuzi": "images/kits/yuzi.webp", "Zarrah": "images/kits/zarrah.webp", "Zenith": "images/kits/zenith.webp", "Zeno": "images/kits/zeno.webp", "Zephyr": "images/kits/zephyr.webp", "Zola": "images/kits/zola.webp"};
var MODES=["All","Duos","Squads","Duels","Ranked","16v16"], cur="All";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function img(n){return KITS[n]||"";}
function card(m,i){
  var n=m.kits.length;
  return '<section class="meta" id="'+slug(m.title)+'"><div class="mtop"><img class="logo" src="images/logo.png" alt=""><span class="brand"><b>Bedwars User Guide</b><small>Metas</small></span><span class="mode">'+esc(m.mode)+'</span></div>'+
   '<h2>'+esc(m.title)+'</h2><div class="row" style="--n:'+n+'">'+m.kits.map(function(k){
     return '<a class="box" href="kit-machine.html#'+slug(k.kit)+'" title="'+esc(k.kit)+(k.alt?' (or '+esc(k.alt)+')':'')+'"><img src="'+esc(img(k.kit))+'" alt="'+esc(k.kit)+'">'+
       (k.alt?'<span class="alt"><img src="'+esc(img(k.alt))+'" alt="'+esc(k.alt)+'" title="Replacement: '+esc(k.alt)+'"></span>':'<span class="alt empty"></span>')+'<span class="kn">'+esc(k.kit)+(k.alt?' / '+esc(k.alt):'')+'</span></a>';
   }).join('')+'</div><div class="text">'+m.text.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</div>'+
   '<div class="tools"><button type="button" data-dl="'+i+'">Download image</button></div></section>';
}
function render(){
  document.getElementById("modes").innerHTML=MODES.map(function(m){return '<button type="button" class="'+(m===cur?'on':'')+'" data-m="'+m+'">'+m+'</button>';}).join('');
  var L=METAS.map(function(m,i){return [m,i];}).filter(function(x){return cur==="All"||x[0].mode===cur;});
  document.getElementById("list").innerHTML=L.length?L.map(function(x){return card(x[0],x[1]);}).join(''):'<p class="empty-note">'+(METAS.length?'No metas for '+cur+' yet.':'Metas are coming soon.')+'</p>';
}
document.getElementById("modes").onclick=function(e){var b=e.target.closest("button"); if(!b) return; cur=b.dataset.m; render();};
function loadImg(s){return new Promise(function(r){ if(!s){r(null);return;} var i=new Image(); i.onload=function(){r(i);}; i.onerror=function(){r(null);}; i.src=s; });}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,t,maxW){var w=t.split(" "),L=[],s="";w.forEach(function(x){var tt=s?s+" "+x:x; if(c.measureText(tt).width>maxW&&s){L.push(s);s=x;}else s=tt;}); if(s)L.push(s); return L;}
function draw(m){
  var F='"Jua","Trebuchet MS",sans-serif', W=1600, n=m.kits.length;
  var srcs=["images/tierlist-bg.jpg","images/logo.png"]; m.kits.forEach(function(k){srcs.push(img(k.kit)); srcs.push(k.alt?img(k.alt):"");});
  return Promise.all([document.fonts?document.fonts.load('40px "Jua"').catch(function(){}):null].concat(srcs.map(loadImg))).then(function(r){
    var bg=r[1],logo=r[2],ki=r.slice(3);
    var cv=document.createElement("canvas"), c=cv.getContext("2d"); c.font='38px '+F;
    var lines=[]; m.text.forEach(function(t){lines=lines.concat(wrap(c,t,W-220));});
    var gap=30, bw=Math.min(280,(W-160-gap*(n-1))/n), top=250, H=top+bw+70+lines.length*50+60;
    cv.width=W; cv.height=H; c=cv.getContext("2d");
    if(bg){ var s=Math.max(W/bg.width,H/bg.height); c.drawImage(bg,(W-bg.width*s)/2,(H-bg.height*s)/2,bg.width*s,bg.height*s);} else {c.fillStyle="#0a0418";c.fillRect(0,0,W,H);}
    c.fillStyle="rgba(10,4,24,.4)"; c.fillRect(0,0,W,H);
    if(logo){ c.save(); c.shadowColor="rgba(169,139,255,.6)"; c.shadowBlur=20; c.drawImage(logo,40,30,100,100); c.restore(); }
    c.fillStyle="#fff"; c.textBaseline="middle"; c.font='34px '+F; c.fillText("Bedwars User Guide",155,68); c.fillStyle="#b9aee0"; c.font='24px '+F; c.fillText("Metas · "+m.mode,155,104);
    c.fillStyle="#fff"; c.textAlign="center"; c.font='64px '+F; c.shadowColor="rgba(0,0,0,.5)"; c.shadowBlur=12; c.fillText(m.title,W/2,180); c.shadowBlur=0;
    var x0=(W-(bw*n+gap*(n-1)))/2;
    m.kits.forEach(function(k,i){ var x=x0+i*(bw+gap), y=top, a=ki[i*2], b=ki[i*2+1];
      c.lineWidth=7; c.strokeStyle="#fff"; rr(c,x,y,bw,bw,30); c.stroke();
      if(a){ var p=bw*.08; c.save(); c.shadowColor="rgba(0,0,0,.5)"; c.shadowBlur=14; c.drawImage(a,x+p,y+p,bw-2*p,bw-2*p); c.restore(); }
      var s=bw*.34, ax=x+bw-s+6, ay=y-6; c.fillStyle="rgba(21,11,56,.92)"; rr(c,ax,ay,s,s,20); c.fill(); c.lineWidth=6; c.strokeStyle="#fff";
      if(!b){ c.setLineDash([10,8]); c.globalAlpha=.5; } rr(c,ax,ay,s,s,20); c.stroke(); c.setLineDash([]); c.globalAlpha=1;
      if(b){ c.save(); rr(c,ax,ay,s,s,20); c.clip(); c.drawImage(b,ax+4,ay+4,s-8,s-8); c.restore(); }
    });
    c.font='38px '+F; c.fillStyle="#fff"; c.shadowColor="rgba(0,0,0,.6)"; c.shadowBlur=8;
    lines.forEach(function(L,i){ c.fillText(L,W/2,top+bw+80+i*50); });
    return cv;
  });
}
document.getElementById("list").onclick=function(e){ var b=e.target.closest("[data-dl]"); if(!b) return; var m=METAS[+b.dataset.dl]; b.disabled=true; b.textContent="Making image...";
  draw(m).then(function(cv){ cv.toBlob(function(bl){ var a=document.createElement("a"); a.href=URL.createObjectURL(bl); a.download=slug(m.title)+"-meta.png"; document.body.appendChild(a); a.click(); a.remove(); b.disabled=false; b.textContent="Download image"; },"image/png"); }); };
render();
</script>
