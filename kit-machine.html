{"name": "Farmer Cletus", "img": "images/kits/farmer-cletus.webp", "cls": "Economy", "tiers": {"casual": "S", "ranked": "F"}, "diff": "moderate", "hp": "100", "desc": "Invest your resources into crops that yield more diamonds and emeralds.", "adv": "Farmer Cletus buys seeds and plants them to grow resources. Seeds have no holding limit. Each crop first has to grow, and after that it has a harvest timer. Harvesting resets the harvest timer, so a grown crop keeps producing forever.\nCarrots give 1 diamond. Melons usually give 1 emerald, with a small chance of 2 or 3. Pumpkins give a Pumpkin Bomb: usually a normal one, sometimes a Big or Huge one. You can hold up to 8 Pumpkin Bombs in total, and you can't give them to teammates.\nPumpkin Bombs explode 4 times in a 4×4 area with some burn damage, and the damage drops off the farther you are from the center. They have no armor penetration.\nCrops are weak to axes: a wood axe takes 2 hits, and stone, iron and diamond axes take 1. TNT and fireballs also destroy them, and fireballs set them on fire, which spreads to other crops. Covering crops with ceramic or obsidian stops TNT, and only obsidian stops fireball burning. You can still harvest a crop through 1 layer of blocks. Breaking your own crop with an axe or pickaxe refunds what you paid for it, grown or not. Teammates can't break your crops.", "items": [{"name": "Carrot Seeds", "img": "images/items/carrot-seeds.png", "note": "Cost: 60 iron", "desc": "Grows in 40 seconds, then gives 1 diamond every 45 seconds."}, {"name": "Melon Seeds", "img": "images/items/melon-seeds.png", "note": "Cost: 2 emeralds", "desc": "Grows in 50 seconds, then gives emeralds every 50 seconds: usually 1, sometimes 2 or 3."}, {"name": "Pumpkin Seeds", "img": "images/items/pumpkin-seeds.png", "note": "Cost: 60 iron", "desc": "Grows in 15 seconds, then gives a Pumpkin Bomb every 15 seconds: usually normal, sometimes Big or Huge. Hold up to 8."}], "abilities": [], "history": [{"type": "nerf", "date": "Mar 13, 2026", "title": "", "changes": ["Can only carry up to 8 Pumpkin bombs", "Pumpkin Bomb is now a non-sharable item"]}, {"type": "bal", "date": "Feb 27, 2026", "title": "", "changes": ["Pumpkin Seed cost 100 iron → 60", "Melon Seeds now cost +1 emerald for every 5 purchased within the last minute (prices decrease back down after the minute)"]}, {"type": "nerf", "date": "Feb 27, 2026", "title": "", "changes": ["Fire now spreads to crop blocks"]}, {"type": "buff", "date": "Sep 19, 2025", "title": "", "changes": ["Pumpkin Seeds 200 iron → 100 iron", "Melon Seeds Growth Time 150s → 140s"]}, {"type": "buff", "date": "Feb 14, 2025", "title": "", "changes": ["Decreased the crop growth time for carrots: 2 minutes, 30 seconds → 2 minutes", "Decreased the cost of melon seeds: 3 emeralds → 2 emeralds", "Decreased the chance that melons yield 2 emeralds when harvested: 30% → 10%"]}, {"type": "buff", "date": "Nov 22, 2024", "title": "", "changes": ["Teammates cannot destroy your crops"]}, {"type": "buff", "date": "Sep 13, 2024", "title": "", "changes": ["Increased chance of receiving 2 emeralds from 1 melon 20% → 30%"]}, {"type": "buff", "date": "Aug 30, 2024", "title": "", "changes": ["Decreased Carrot growth time 2.75 min → 2.5 min", "Decreased Melon growth time 3 min → 2.5 min"]}, {"type": "buff", "date": "May 17, 2024", "title": "", "changes": ["Decreased Carrot growth time 3.25 min → 2.75 min", "Decreased Carrot Seeds price 70 iron → 60 iron", "Decreased Melon growth time 3.25 min → 3 min"]}, {"type": "nerf", "date": "Apr 5, 2024", "title": "Season X", "changes": ["Carrot seed cost: 60 iron → 70 iron", "Carrot growth time: 2m 45s → 3m 15s", "Melon growth time: 2m 45s → 3m 15s"]}, {"type": "buff", "date": "Mar 1, 2024", "title": "", "changes": ["Refund 30% of the cost of seeds on plant destruction"]}, {"type": "nerf", "date": "Nov 24, 2023", "title": "", "changes": ["Carrot Price: 40 → 60", "Carrots now take longer to grow", "Melons now take longer to grow", "Pumpkins no longer infinitely yield"]}, {"type": "buff", "date": "Oct 27, 2023", "title": "", "changes": ["Pumpkin seeds now infinitely yield Jack o’Booms", "Reduced pumpkin seed cost 300 iron → 200 iron"]}, {"type": "bal", "date": "Oct 6, 2023", "title": "", "changes": ["Decreased cost of Pumpkin Seeds from 1 Emerald → 300 Iron", "Increased cost of Melon Seeds from 2 Emeralds → 3 Emeralds"]}, {"type": "nerf", "date": "Jun 30, 2023", "title": "", "changes": ["Carrot Harvest Time: 135 → 145", "Melon Harvest Time: 135 → 140"]}, {"type": "nerf", "date": "May 12, 2023", "title": "", "changes": ["Melon harvest time: 120 → 135"]}, {"type": "nerf", "date": "Apr 14, 2023", "title": "", "changes": ["Melon harvest time: 90 → 120"]}, {"type": "buff", "date": "Apr 7, 2023", "title": "", "changes": ["Melon seeds cost reduced: 3 → 2 emeralds", "Carrot seeds cost reduced: 60 → 40 iron"]}, {"type": "buff", "date": "Sep 2, 2022", "title": "", "changes": ["Melons now grow 15% faster"]}, {"type": "buff", "date": "Jul 8, 2022", "title": "", "changes": ["Melons grow faster: 2:00 → 1:45"]}, {"type": "buff", "date": "May 27, 2022", "title": "", "changes": ["Carrot seeds price: 110 iron → 70 iron"]}, {"type": "buff", "date": "Apr 22, 2022", "title": "", "changes": ["Slightly increased harvest crop prompt range"]}, {"type": "bal", "date": "Jun 17, 2021", "title": "", "changes": ["You can no longer break your teammates' crops"]}], "obtain": {"src": "Kit Shop", "buy": 10000, "rent": 1500}, "passives": [{"name": "Endless Harvest", "when": "Grown crops", "desc": "Once grown, crops never need to grow again. Harvesting just resets the harvest timer."}, {"name": "Refund", "when": "Breaking your own crop", "desc": "Breaking it with an axe or pickaxe gives back what you paid for it, grown or not."}, {"name": "Protected From Teammates", "when": "Always", "desc": "Teammates can't break your crops."}, {"name": "Reach Through Blocks", "when": "Harvesting", "desc": "You can harvest a crop covered by 1 layer of blocks."}], "tables": [{"title": "Crops", "head": ["Crop", "Cost", "Grow time", "Harvest every", "Gives"], "rows": [["img:images/items/carrot-seeds.png|Carrot", "60 iron", "40s", "45s", "1 diamond"], ["img:images/items/melon-seeds.png|Melon", "2 emeralds", "50s", "50s", "1 emerald (89%), 2 (10%), 3 (1%)"], ["img:images/items/pumpkin-seeds.png|Pumpkin", "60 iron", "15s", "15s", "Pumpkin Bomb (89%), Big (10%), Huge (1%)"]]}, {"title": "Pumpkin Bomb damage", "head": ["Bomb", "First hit", "Total (no armor)"], "rows": [["Pumpkin Bomb", "17.5", "63.69"], ["Big Pumpkin Bomb", "26.5", "72.15"], ["Huge Pumpkin Bomb", "34.75", "81.38"]], "note": "Explodes 4 times in a 4×4 area, with burn damage included in the total. Damage drops off away from the center. No armor penetration (a normal bomb did 28.09 to iron armor)."}, {"title": "Breaking crops", "head": ["Tool", "Hits"], "rows": [["Wood axe", "2"], ["Stone, iron or diamond axe", "1"], ["TNT", "Destroys it unless covered by ceramic or obsidian"], ["Fireball", "Destroys some and sets them on fire unless covered by obsidian"]]}], "strategy": [{"title": "Carrots early", "text": "Buy carrots early game and ask teammates for iron. Stop at around 10-15."}, {"title": "Upgrade generators", "text": "Get diamonds early for the tier 1 generator so you get iron faster."}, {"title": "Melons at tier 3", "text": "Once you have tier 3, start buying melons and cover them in ceramic. At around 5-8 melons, replace the ceramic with obsidian."}, {"title": "Plant in rows", "text": "Plant in rows so every side is covered: obsidian, crop (with obsidian above), obsidian, crop (with obsidian above), obsidian."}, {"title": "Static for pumpkins", "text": "Static is the best enchant to pair with Pumpkin Bombs."}], "counter": [{"title": "Fireballs, axes and TNT", "text": "All three destroy crops fast. Fireballs also spread fire through the farm."}, {"title": "Jack", "text": "Jack completely wipes out crops by throwing a match on his oil."}], "skins": [{"name": "Spirit Skin", "img": "images/skins/farmer-cletus-spirit.webp"}, {"name": "Loveseeker Skin", "img": "images/skins/farmer-cletus-loveseeker.webp"}], "bal": "sup", "balWhy": "Crops are super easy to break. Even covered, some kits can still burn them, you need obsidian to fully stop fireballs, and protecting them costs a ton of resources."},
{"name": "Fisherman", "img": "images/kits/fisherman.webp", "cls": "Economy", "tiers": {"casual": "S", "ranked": "S"}, "diff": "easy", "hp": "100", "desc": "Why fight when you can fish? Catch resources and Fish Coins, upgrade your rod, and use bait to reel in rarer rewards.", "adv": "Fisherman fishes for resources and items. Cast your line into the void (about 1 second), then wait about 8 seconds for a bite. An icon shows what you hooked: Iron, Diamond, Emerald, Special (it looks red while you reel it in), Shark or Gold Fish.\nReeling it in is a mini game with a 30 second limit: hold to raise the bar and let go to drop it, and keep the fish inside the bar for 4 seconds total. Letting it slip out only loses part of your progress.\nMost catches also give Fish Coins. Spend 15 on the second rod and 35 on the top rod; each rod upgrade gives bigger catches. Each Fisherman sees their own ponds. From the start of the match, a pond appears at a random spot near each diamond generator. The second rod adds an emerald pond at one emerald generator, which moves to a different emerald generator after you fish it a few times. Ponds give better loot than your base, and the emerald pond is the best.\nCatches get bigger with your rod and as the match goes on: from 40% at the start up to 140% at 10 minutes.\nThe top rod unlocks bait (10 Fish Coins for 2). Bait improves your loot, and in the emerald pond each baited cast has a 25% chance to hook a Shark. Special fish give items like TNT, Siege TNT, fireballs, blocks, Banana Peels, Charged Gloop, the Frying Pan and the Tornado Launcher; they're more common in the emerald pond or with bait at a diamond pond. Sharks can give big piles of those items too, and they're the only way to get the 4 Shark weapons: Soaked Warfists, Rusty Nocturne, Sunken Paragon and Soggy Deathbloom.", "items": [{"name": "Beginning Fishing Rod", "img": "images/items/fishing-rod.png", "desc": "Your starting rod."}, {"name": "Novice Fishing Rod", "img": "images/items/fishing-rod.png", "desc": "Costs 15 Fish Coins. Bigger catches, and unlocks your emerald pond."}, {"name": "Master Fishing Rod", "img": "images/items/fishing-rod.png", "desc": "Costs 35 Fish Coins. Even bigger catches, and unlocks bait."}, {"name": "Fish Coin", "img": "images/items/fish-coin.png", "desc": "Caught alongside most fish. Spend them on fishing rod upgrades."}, {"name": "Obsidian", "img": "images/items/obsidian.png", "desc": "From red fish. 8 hits with a diamond pickaxe, 12 iron, 19 stone, 31 wood. Takes 20 TNT. Siege TNT can't one shot it."}, {"name": "Coral Blocks", "img": "images/items/coral-block.png", "desc": "From red fish. 11 hits with a diamond pickaxe, 17 iron, 27 stone, 42 wood. Takes 14 TNT, but Siege TNT breaks it instantly."}, {"name": "Blastproof Ceramic", "img": "images/items/blastproof-ceramic.png", "desc": "From red fish. Normal TNT can't break it; Siege TNT can."}, {"name": "TNT", "img": "images/items/tnt.png", "desc": "From red fish. About 60 damage point blank with falloff, 8 block radius. Breaks wool, stone and wood, but not ceramic."}, {"name": "Siege TNT", "img": "images/items/siege-tnt.png", "desc": "From red fish. About 70 damage point blank with falloff, about 10 block radius. Breaks everything, including ceramic, but can't one shot obsidian."}, {"name": "Balloons", "img": "images/items/balloons.png", "desc": "From red fish. Each balloon makes you fall slower and jump higher: 1 is small, 2 is bigger, and 3 (max) lets you fly when you jump or fall into the void. Any damage pops them."}, {"name": "Tornado Launcher (Hair Dryer)", "img": "images/items/hair-dryer.png", "desc": "Deals 15 damage and shoots a tornado that flings enemies 2 blocks into the air in a random direction.", "dmg": 15, "nodps": true}, {"name": "Charge Shield", "img": "images/items/charge-shield.png", "desc": "Charge forward fast (24 blocks in 1.88 seconds, about 1.85x speed) for 2 seconds. You can't jump while charging. Running into someone deals 5 damage and stops the charge. 7 second cooldown.", "cd": 7, "dmg": 5, "nodps": true}, {"name": "Rocket Launcher", "img": "images/items/rocket-launcher.png", "desc": "Fires rockets for 118 damage point blank with falloff. Breaks blocks except ceramic and obsidian. 2 second cooldown. Comes with 10 rockets; more cost 2 emeralds each.", "cd": 2, "dmg": 118, "nodps": true}, {"name": "Rockets", "img": "images/items/rockets.png", "desc": "Ammo for the Rocket Launcher. You get 10 with each launcher, and can buy more for 2 emeralds each once you have one. Can be dropped to teammates."}, {"name": "Knockback Fish", "img": "images/items/knockback-fish.png", "desc": "Deals 1 damage and 6 blocks of knockback. 0.3 second cooldown.", "cd": 0.3, "dmg": 1, "nodps": true}, {"name": "Telepearls", "img": "images/items/telepearls.png", "desc": "Throw it to teleport up to 70 blocks (takes about 1.5 seconds to land). Anyone can buy them for 2 emeralds, but Fisherman can fish up several for free. No holding limit."}, {"name": "Soaked Warfists", "img": "images/items/soaked-warfists.png", "desc": "Shark weapon. Punches for about 47.5 damage on average every 0.21 seconds, 4 block range.", "cd": 0.21, "dmg": 47.5}, {"name": "Rusty Nocturne", "img": "images/items/rusty-nocturne.png", "desc": "Shark weapon. A scythe that hits for 46 every 0.4 seconds, 4 block range. Every third hit pulls the enemy toward you. Hold for 1 second to dash forward for 46 damage and be invulnerable for 0.5 seconds.", "cd": 0.4, "dmg": 46}, {"name": "Sunken Paragon", "img": "images/items/sunken-paragon.png", "desc": "Shark weapon. Hits for about 56 damage on average every 0.75 seconds, 5 block range. Charge it for 0.5 seconds for a 72.9 damage hit, but you can't move for 1 second after.", "cd": 0.75, "dmg": 56}, {"name": "Soggy Deathbloom", "img": "images/items/soggy-deathbloom.png", "desc": "Shark weapon. Hits for about 31 damage on average (it's a bit random) every 0.25 seconds, 3 block range. If an enemy is within 6 blocks, you automatically lunge at them for about 75% damage (5 second cooldown).", "cd": 0.25, "dmg": 31}, {"name": "Charged Gloop", "img": "images/items/charged-gloop.png", "note": "From Special fish or Sharks", "desc": "Like a normal Gloop, but it chases the enemy until it Gloops them."}, {"name": "Banana Peel", "img": "images/items/banana-peel.png", "note": "From Special fish or Sharks", "desc": "Makes anyone who steps on it slip for 1 second."}, {"name": "Frying Pan", "img": "images/items/frying-pan.png", "note": "From Special fish or Sharks", "desc": "Charge for 1 second to fling an enemy up to 5 blocks for 22 damage (no armor penetration). Spamming it does 18; partial charges do 19-21.", "dmg": 22, "nodps": true}, {"name": "Fish Bait", "img": "images/items/fish-bait.png", "note": "Cost: 10 Fish Coins for 2", "desc": "Unlocked with the top rod. Baited casts give better loot, and in the emerald pond they have a 25% chance to hook a Shark."}], "abilities": [], "history": [{"type": "bal", "date": "Sep 25, 2026", "title": "Rework", "changes": ["Fisherman now starts with a novice fishing rod", "Fisherman can purchase higher tier fishing rods using fish coins, which can be obtained by fishing", "Fishing spots will spawn randomly on the map. Fishing in designated ponds yields better rewards.", "Fish bait is unlocked in the shop once upgraded to the highest tier fishing rod. Fish bait is a consumable item that grants a chance to hook a Shark."]}, {"type": "nerf", "date": "Feb 27, 2026", "title": "", "changes": ["Chances of getting jackpot and emerald fish now scale dynamically based on how lucky you are rather than a static value. Overall this will be a decrease in the chance of getting these rare fish"]}, {"type": "nerf", "date": "Jan 30, 2026", "title": "", "changes": ["Slightly reduced Diamond gains", "Slightly reduced early game Emerald gains"]}, {"type": "nerf", "date": "Jan 2, 2026", "title": "", "changes": ["Because TNT is now shareable, lowered the drop rate of TNT", "Reduced the amount of early-game TNT dropped"]}, {"type": "buff", "date": "Sep 19, 2025", "title": "", "changes": ["Late game fishing loot table active time: 8m → 7m", "Max reward multiplier match time: 12m → 10m", "Min / max catch time: 6s / 10s → 5s / 9s"]}, {"type": "bal", "date": "Nov 22, 2024", "title": "", "changes": ["Siege TNT and gloops can now be fished"]}, {"type": "buff", "date": "Mar 15, 2024", "title": "", "changes": ["Slightly increased resource gains for loot table"]}, {"type": "buff", "date": "Apr 21, 2023", "title": "", "changes": ["Increased chance of receiving emeralds and diamonds", "Higher likelihood of receiving valuable resources after 8 minutes"]}, {"type": "buff", "date": "Feb 10, 2023", "title": "", "changes": ["Iron fish amount: 1.5x"]}, {"type": "bal", "date": "Jan 27, 2023", "title": "", "changes": ["Time to bite: [4s-8s] → [6s-10s]", "Fish resources scale over 12m: 40% → 140%"]}, {"type": "buff", "date": "Dec 30, 2022", "title": "", "changes": ["Reduced minimum catch time: 5s → 4s"]}, {"type": "nerf", "date": "Oct 28, 2022", "title": "", "changes": ["Obsidian fish: 6 obsidian → 3 obsidian", "Average emeralds in emerald fish: 4.7 → 3.7"]}, {"type": "nerf", "date": "Sep 30, 2022", "title": "", "changes": ["Diamond and emerald fish are slightly rarer"]}, {"type": "buff", "date": "Mar 21, 2022", "title": "", "changes": ["Fish catch speed increased by 50%"]}, {"type": "buff", "date": "Nov 1, 2021", "title": "", "changes": ["You can now catch a new coral block, which is stronger than obsidian"]}], "obtain": {"src": "Season 2 Battle Pass", "tier": "25 (paid)", "badge": "images/bp/s2.webp", "rent": 2000, "buy": 25000}, "passives": [{"name": "Reeling", "when": "After a bite", "desc": "Keep the fish inside the bar for 4 seconds within 30 seconds. Slipping out only loses some progress."}, {"name": "Rod Upgrades", "when": "Spending Fish Coins", "desc": "15 coins for the second rod (unlocks the emerald pond), 35 for the top rod (unlocks bait). Each upgrade gives bigger catches."}, {"name": "Fishing Ponds", "when": "Always", "desc": "Your own ponds appear near the diamond generators at the start of the match. The second rod adds an emerald pond, which moves to another emerald generator after a few catches."}, {"name": "Growing Catches", "when": "As the match goes on", "desc": "Catches grow with your rod and with match time: from 40% at the start to 140% at 10 minutes."}, {"name": "Shark Bait", "when": "Top rod, emerald pond", "desc": "Each baited cast has a 25% chance to hook a Shark."}], "tables": [{"title": "Catch chances by spot", "head": ["Spot", "Iron", "Diamond", "Emerald", "Special", "Gold Fish", "Shark"], "rows": [["Base", "36%", "20%", "12%", "31%", "1%", "-"], ["Diamond pond", "21%", "27%", "23%", "24%", "5%", "-"], ["Emerald pond", "2%", "20%", "27%", "41%", "10%", "25% with bait"]], "note": "Estimated from tests; chances also shift with luck. Emerald pond numbers are with an upgraded rod and no bait."}, {"title": "Loot from 20 minutes of fishing", "head": ["Where", "Iron", "Diamonds", "Emeralds", "Fish Coins", "Gold Fish"], "rows": [["Base only", "703", "48", "25", "80", "0"], ["Diamond pond only", "587", "129", "56", "118", "0"], ["Diamond pond → emerald pond", "895", "95", "176", "79", "3"], ["Side pond → emerald pond", "888", "123", "176", "59", "6"]], "note": "From tests. Moving to the emerald pond after the second rod gave the most loot."}, {"title": "Gold Fish", "head": ["When", "Diamonds", "Emeralds", "Iron"], "rows": [["Early (about 4 min)", "9", "6", "60"], ["Mid (about 7 min)", "20", "14", "137"], ["Late (10+ min)", "21-28", "15-20", "150-200"]], "note": "From tests. Gold Fish can show up anywhere, but they're much more common in ponds."}, {"title": "Shark weapons", "head": ["Weapon", "Damage", "Cooldown", "Range", "DPS"], "rows": [["Soaked Warfists", "about 47.5", "0.21s", "4 blocks", "about 226"], ["Soggy Deathbloom", "about 31", "0.25s", "3 blocks", "about 124"], ["Rusty Nocturne", "46", "0.4s", "4 blocks", "115"], ["Sunken Paragon", "about 56 (72.9 charged)", "0.75s", "5 blocks", "about 75"]], "note": "Average damage from tests (Soaked Warfists and Soggy Deathbloom hits vary a bit)."}, {"title": "Block durability", "head": ["Block", "Wood pick", "Stone pick", "Iron pick", "Diamond pick", "TNT"], "rows": [["Coral", "42", "27", "17", "11", "14 (Siege breaks it instantly)"], ["Obsidian", "31", "19", "12", "8", "20 (Siege can't one shot it)"]]}, {"title": "Explosives", "head": ["", "Damage (point blank)", "Radius", "Breaks"], "rows": [["TNT", "About 60", "8 blocks", "Wool, stone, wood"], ["Siege TNT", "About 70", "About 10 blocks", "Everything except obsidian in one shot"], ["Rocket", "118", "-", "Everything except ceramic and obsidian"]], "note": "All have damage falloff."}], "skins": [{"name": "OG Chroma Skin", "img": "images/skins/fisherman-og-chroma.webp"}, {"name": "Spirit Skin", "img": "images/skins/fisherman-spirit.webp"}], "calc": {"title": "Loot by match time", "label": "Match time", "unitIn": "minutes", "unitOut": "% loot", "a": 10, "p": 1, "base": 40, "prefix": "", "dec": 0, "max": 30, "start": 5, "hideTable": true, "note": "How big your catches are from match time alone (your rod adds more on top). Loot starts at 40% and grows 10% per minute until it caps at 140% at 10 minutes.", "table": {"10": 140, "11": 140, "12": 140, "13": 140, "14": 140, "15": 140, "16": 140, "17": 140, "18": 140, "19": 140, "20": 140, "21": 140, "22": 140, "23": 140, "24": 140, "25": 140, "26": 140, "27": 140, "28": 140, "29": 140, "30": 140}}, "strategy": [{"title": "Diamond pond, then emerald pond", "text": "Fish at the diamond generator ponds, then move to the emerald pond once you get the second rod."}, {"title": "Coins for bait", "text": "Fish Coins can be harder to get at the emerald pond. If you want bait, keep fishing at the diamond pond until you have the top rod."}], "counter": [{"title": "Shoot it", "text": "Hitting a Fisherman with any projectile stops it from fishing, so use arrows or fireballs while it's fishing."}, {"title": "Take the loot", "text": "Pearl onto it and Gloop it, then kill it to take all its loot before it can teleport home."}], "bal": "bal", "balWhy": "Fisherman used to be really poor and just relied on lucky Gold Fish. Now you have to work for your loot by risking the emerald pond or diamond ponds. You can still fish at base, but you get less loot and worse Gold Fish chances."},
{"name": "Flora", "img": "images/kits/flora.webp", "cls": "Movement", "tiers": {"casual": "A", "ranked": "A"}, "diff": "hard", "hp": "100", "desc": "Use explosive beehives to deal high damage to your enemies or throw them at yourself for a massive launch.", "adv": "Flora spawns with 1 Beehive Grenade, and gets another on spawn the first time it respawns (but not on later respawns). You also get a free one every 45 seconds, 1 for each kill or assist, and you can buy them in the shop for 40 iron each. You can never hold more than 5.\nA Beehive Grenade explodes 0.5 seconds after it lands on a player or the floor, dealing about 29.5 damage with falloff and no real armor penetration (from tests). 1 second after the explosion, 4 bees attack for about 5 damage each, with some armor penetration. If several enemies are hit, the bees spread out between them.\nThrow a Beehive Grenade at your own feet to launch yourself: it only deals 1 damage to you and resets your Glide cooldown. You can go up to 11 blocks high, or up to 25 blocks if you time your jump perfectly.\nGlide lasts 7.5 seconds. You glide down slowly at first, then faster near the end. If you haven't landed when it ends, you take full fall damage from the highest point you reached. Activating Glide at the top of a perfect launch lets you slowly glide about another 25 blocks forward. Getting hit by a projectile while gliding stops your Glide, and Gloop stops you from gliding or launching with your grenades.", "items": [{"name": "Beehive Grenade", "img": "images/items/beehive-grenade.png", "note": "Spawn, every 45s, kills, assists, or 40 iron", "desc": "Explodes 0.5 seconds after landing for about 29.5 damage with falloff. 1 second later, 4 bees attack for about 5 damage each, spreading out between enemies. Thrown at yourself it deals 1 damage, launches you up to 11 blocks (25 with a perfect jump) and resets Glide. Hold up to 5.", "dmg": 29.5, "dmgText": "~29.5 + bees", "nodps": true}], "abilities": [{"name": "Glide", "img": "images/abilities/ability-template.png", "note": "7.5 seconds", "desc": "Glide slowly at first, then faster near the end, for 7.5 seconds. If you haven't landed when it ends, you take full fall damage from the highest point you reached. Getting shot stops your Glide, and Gloop stops you from gliding. Getting hit by your own Beehive Grenade resets the cooldown.", "cd": 30}], "history": [{"type": "nerf", "date": "Dec 12, 2025", "title": "", "changes": ["Max beehive grenades: 6 → 5", "Glide duration: 8.5s → 7.5s"]}, {"type": "buff", "date": "Jul 25, 2025", "title": "", "changes": ["Floating ability cooldown:  60 → 30 sec", "Gives a grenade every 45 seconds"]}, {"type": "buff", "date": "Feb 28, 2025", "title": "", "changes": ["Gain a Bee grenade on spawn, once every 60 seconds."]}, {"type": "buff", "date": "Jan 3, 2025", "title": "", "changes": ["Glide cooldown reduced 180 → 60", "Beehive grenade max stack increased 5 → 6"]}, {"type": "nerf", "date": "Apr 19, 2024", "title": "", "changes": ["Decreased Beehive Grenade explosive power by 15%", "Decreased Beehive Grenades granted on assist 2 → 1"]}, {"type": "buff", "date": "Sep 29, 2023", "title": "", "changes": ["Increased beehive grenades rewarded on kills and assists 1 → 2", "Increased bee armor penetration 25% → 30%"]}, {"type": "nerf", "date": "May 26, 2023", "title": "", "changes": ["Beehive grenade max stack size set to 5", "Beehive grenades can no longer be shared"]}, {"type": "nerf", "date": "May 19, 2023", "title": "", "changes": ["Damage per bee reduced: 4 → 2"]}, {"type": "buff", "date": "Apr 28, 2023", "title": "", "changes": ["Seeking bee armor pen: 20% → 25%"]}, {"type": "buff", "date": "Apr 7, 2023", "title": "", "changes": ["Bee count increased: 3 → 5"]}, {"type": "buff", "date": "Mar 24, 2023", "title": "", "changes": ["Seeking bee damage: 4 → 6", "Seeking bee armor pen: 0% → 20%"]}], "obtain": {"src": "Season 7 Battle Pass", "tier": "20 (paid)", "badge": "images/bp/s7.webp", "rent": 2000}, "passives": [{"name": "Spawn Hive", "when": "Spawning", "desc": "Start the match with 1 Beehive Grenade, and get another on your first respawn only."}, {"name": "Hive Timer", "when": "Every 45 seconds", "desc": "Get a free Beehive Grenade."}, {"name": "Hive Rewards", "when": "Kills and assists", "desc": "Get 1 Beehive Grenade for each kill or assist. You can never hold more than 5."}, {"name": "Glide Reset", "when": "Hit by your own hive", "desc": "Your own Beehive Grenade deals only 1 damage to you and resets Glide."}], "strategy": [{"title": "Rush from spawn", "text": "As soon as you spawn, launch and glide straight to an enemy base and sneak attack them before they're ready. Kill them and break the bed. If you die, rush again: you get another hive on respawn and they'll still be low."}, {"title": "Save your iron", "text": "Try not to spend iron on hives. Get them from kills, assists and the free one every 45 seconds instead."}, {"title": "Play high", "text": "When you're in trouble, build all the way up and make enemies deal with the fall. If they knock you off, just glide down safely."}, {"title": "Dump your hives", "text": "Throw all your hives at one enemy for huge damage, then launch away to escape."}], "counter": [{"title": "Shoot it down", "text": "Hitting a gliding Flora with a projectile stops its Glide."}, {"title": "Fight it on landing", "text": "A Flora gliding into your base has no other abilities left, so once it lands it's basically fighting with no kit."}, {"title": "Gloop it", "text": "Gloop stops Flora from gliding and from launching itself with its grenades."}], "bal": "sop", "balWhy": "Flora has many ways to get Beehive Grenades and deals a lot of damage early game. Its movement is also very strong: it can rush and fly over enemy bases the second it spawns, which is a bit unbalanced."},
{"name": "Fortuna", "img": "images/kits/fortuna.webp", "cls": "Fighter", "tiers": {"casual": "A", "ranked": "A"}, "diff": "moderate", "hp": "100", "desc": "Summon cards to attack players! Deal damage to enhance your cards with different effects.", "adv": "Fortuna throws a fan of cards. With no upgrades it throws 4 cards that deal 4 damage each, with a 12 second cooldown.\nDealing damage fills your card meter, and kills add 60 to it. Each time it fills you pick a new card: you're shown 3 options and can reroll one of them. You start with 1 reroll and get another every 3 kills. You can have up to 5 cards.\nYou can only pick a II card if you already have its I card (for example, Greater Draw II needs Greater Draw I). Most cards are common. Moonlit, Aerodynamic and Sticky Cards are rarer, Volley is very rare (about 1–2%), and Jack of All Trades is the rarest at about 1%. Explosive needs to be your 2nd card or later. Scorched, Decay, Moonlit, Volley and Jack of All Trades only show up from your 3rd card on.\n\"Final card\" effects only happen on the last card of each throw. Some cards are weaker together than they look: for example Oversized with Greater Draw I and II throws 3 cards for 21 damage each (63 total). See the tested damage table below.", "items": [], "abilities": [{"name": "Card Throw", "img": "images/abilities/ability-template.png", "note": "4 cards × 4 damage", "desc": "Throw a fan of cards. Upgrade it with cards you unlock by dealing damage. Needs line of sight.", "cd": 12, "dmg": 16, "dmgText": "4 × 4 (base)", "nodps": true}, {"name": "See Current Upgrades", "img": "images/abilities/ability-template.png", "desc": "Shows the cards you have."}], "history": [{"type": "buff", "date": "Sep 4, 2026", "title": "", "changes": ["Added card rerolls: start with 1 and earn another every 3 eliminations", "Added new cards and upgrades: Moonlit, Electrifying I & II, Sticky Cards, Decay, Poisonous, Volley, Jack of All Trades, and Quick Draw II", "Energy Drain now heals 25% of direct card damage, capped at 4/6/8 HP per volley for Minisized/standard/Oversized", "Critical Strike chance: 40% → 50%", "Critical Strike bonus damage: 15–35% → 25–40%", "Scorched now requires Tier 3 and only activates on the final card", "Explosive rarity: Common → Uncommon. Now requires Tier 2 and no longer benefits from Fortuna crits", "Greater Draw now increases Oversized card count, up to 3 before Volley, and grants twice as many additional cards with Minisized", "Oversized deals 4× damage with one card, or 3× damage per card with Greater Draw, before Volley modifiers", "Sticky Cards grounds enemies for 3 seconds", "Decay is available as an Uncommon card starting at Tier 3", "Casting now requires line of sight"]}, {"type": "nerf", "date": "Mar 27, 2026", "title": "", "changes": ["No longer able to combat while drawing cards"]}, {"type": "buff", "date": "Oct 17, 2025", "title": "", "changes": ["Energy Drain: Increased appearance rate (lower rarity)", "Aerodynamic: Increased appearance rate (lower rarity)", "Scorched: Fire damage 2 → 4", "Critical Strike: Crit chance 31% → 40%"]}, {"type": "bal", "date": "Nov 22, 2024", "title": "", "changes": ["Increased knockback of Aerodynamic Card Upgrade", "Increased knockback of Explosive Card Upgrade", "Decreased explosion size of Explosive Card Upgrade", "Reduced cooldown of card throw 15s → 12s"]}, {"type": "buff", "date": "Dec 22, 2023", "title": "", "changes": ["Increased upgrade progression multiplier on player damage: 25% → 40%", "Increased upgrade progression multiplier on NPC damage: 2% → 3%"]}, {"type": "nerf", "date": "Nov 24, 2023", "title": "", "changes": ["Scorched Card enchant: Fire 3 → Fire 2", "Energy Drain Card enchant: Lifesteal 3 → Lifesteal 2", "Explosive Card damage: -50%", "Sharper Cards II damage: 5 → 4"]}, {"type": "bal", "date": "Nov 17, 2023", "title": "", "changes": ["Decreased base card damage 6 → 4"]}, {"type": "nerf", "date": "Sep 29, 2023", "title": "", "changes": ["Decreased progress speed towards card upgrades"]}, {"type": "nerf", "date": "Sep 15, 2023", "title": "", "changes": ["Reduced power and knockback of explosive cards"]}, {"type": "bal", "date": "Sep 1, 2023", "title": "", "changes": ["Reduced knockback on knockback and explosion upgrades", "Increased base damage per card 5 → 6"]}, {"type": "nerf", "date": "Jul 14, 2023", "title": "", "changes": ["Reduced chance of Card Damage II upgrade", "Reduced chance of Card Count II upgrade"]}, {"type": "nerf", "date": "Jun 28, 2023", "title": "", "changes": ["Nerfed damage from upgrades", "Increased time to unlock new cards"]}], "obtain": {"src": "Season 8 Battle Pass", "tier": "35 (free)", "badge": "images/bp/s8.webp", "rent": 2000}, "passives": [{"name": "Card Meter", "when": "Dealing damage", "desc": "Fill your meter to unlock a new card. Kills add 60. Up to 5 cards."}, {"name": "Pick a Card", "when": "Meter full", "desc": "Choose 1 of 3 cards, and reroll one if you have a reroll."}, {"name": "Rerolls", "when": "Every 3 kills", "desc": "Start with 1 reroll and get another every 3 kills."}], "tables": [{"title": "Damage needed for each card", "head": ["Card", "Damage for this card", "Total damage"], "rows": [["1st", "250", "250"], ["2nd", "250", "500"], ["3rd", "450", "950"], ["4th", "650", "1,600"], ["5th", "750", "2,350"]], "note": "Each kill counts as 60 damage."}, {"title": "Tested damage (no armor)", "head": ["Cards", "Cards thrown", "Damage each", "Total"], "rows": [["No cards", "4", "4", "16"], ["img:images/items/fortuna-sharper-cards-1.png|Sharper Cards I", "4", "6", "24"], ["Sharper Cards I + II", "4", "15", "60"], ["img:images/items/fortuna-oversized.png|Oversized", "1", "20", "20"], ["Oversized + Sharper Cards I", "1", "32", "32"], ["Oversized + Greater Draw I", "2", "27", "54"], ["Oversized + Greater Draw I + II", "3", "21", "63"], ["Oversized + Greater Draw I + II + Jack of All Trades", "3", "~25.9", "77.6"], ["img:images/items/fortuna-minisized.png|Minisized", "9", "2.5", "22.5"], ["Minisized + Sharper Cards I", "9", "4", "36"], ["img:images/items/fortuna-volley.png|Volley", "16", "~3.15", "50.4"]], "note": "From tests. Card combos don't always stack the way the card text says."}, {"title": "Cards", "head": ["Card", "Effect", "Type"], "rows": [["img:images/items/fortuna-oversized.png|Oversized", "Throw 1 card at 4× damage. With Greater Draw, throw up to 3 cards at 3× damage each. Card count and multipliers apply before Volley. Can't be combined with Minisized.", "Size"], ["img:images/items/fortuna-minisized.png|Minisized", "Throw 9 cards at 50% damage each (2.5 each, 22.5 total from tests). Greater Draw adds twice as many cards. Can't be combined with Oversized or Volley.", "Size"], ["img:images/items/fortuna-sharper-cards-1.png|Sharper Cards I", "+2 base damage per card, before size and Volley (+1.5 per card with Minisized).", "Damage"], ["img:images/items/fortuna-sharper-cards-2.png|Sharper Cards II", "+4 more base damage per card, before size and Volley. Needs Sharper Cards I.", "Damage"], ["img:images/items/fortuna-greater-draw-1.png|Greater Draw I", "+1 card per throw (+2 with Minisized).", "Cards"], ["img:images/items/fortuna-greater-draw-2.png|Greater Draw II", "+2 more cards per throw (+4 with Minisized). Oversized caps at 3 cards before Volley. Needs Greater Draw I.", "Cards"], ["img:images/items/fortuna-quick-draw-1.png|Quick Draw I", "Throw cards 1.5× faster, and the cooldown drops to 10 seconds.", "Speed"], ["img:images/items/fortuna-quick-draw-2.png|Quick Draw II", "Throw cards 2× faster, and the cooldown drops to 8 seconds. Replaces Quick Draw I.", "Speed"], ["img:images/items/fortuna-energy-drain.png|Energy Drain", "Heal for 25% of direct card damage, up to 4/6/8 HP per throw with Minisized/standard/Oversized cards.", "Healing"], ["img:images/items/fortuna-critical-strike.png|Critical Strike", "Each card has a 50% chance to deal 25–40% bonus damage.", "Damage"], ["img:images/items/fortuna-poisonous.png|Poisonous", "The final card poisons the enemy for 2 damage per second for 3 seconds (6 total), with about 70% armor penetration. Poison can't kill.", "Final card"], ["img:images/items/fortuna-explosive.png|Explosive", "The final card explodes for 10 damage. Card 2 or later.", "Final card"], ["img:images/items/fortuna-electrifying-1.png|Electrifying I", "The final card chains 8 static damage to up to 3 nearby enemies and gives Zapped 1 (40% less healing and shields for 5 seconds).", "Final card"], ["img:images/items/fortuna-electrifying-2.png|Electrifying II", "The chain does 14.4 damage instead, and gives Zapped 2 (60% less healing and shields for 10 seconds). Needs Electrifying I.", "Final card"], ["img:images/items/fortuna-scorched.png|Scorched", "The final card burns enemies for 5 damage per tick for 3 seconds. Card 3 or later.", "Final card"], ["img:images/items/fortuna-decay.png|Decay", "The final card applies Decay for 10 seconds, lowering the enemy's max health. Card 3 or later.", "Final card"], ["img:images/items/fortuna-moonlit.png|Moonlit", "Cards ramp from 90% to 120% damage and up to 20% armor penetration. Throws with only 1 card get the full bonus. Card 3 or later. Rare.", "Damage"], ["img:images/items/fortuna-aerodynamic.png|Aerodynamic", "Cards deal knockback. Rare.", "Utility"], ["img:images/items/fortuna-sticky-cards.png|Sticky Cards", "The final card grounds the enemy for 3 seconds, so they can't use movement abilities. Rare.", "Final card"], ["img:images/items/fortuna-volley.png|Volley", "Throw 4× as many cards, but each deals 65% less damage (40% more total damage). Electrifying damage isn't changed. Card 3 or later. Very rare (about 1–2%).", "Cards"], ["img:images/items/fortuna-jack-of-all-trades.png|Jack of All Trades", "Get 20% versions of the damage, crit, healing, knockback and explosion cards you don't own. Doesn't stack with cards you have. Its explosions can't break blocks, and Volley blocks its knockback. Card 3 or later. Very rare (about 1%).", "Special"]]}], "strategy": [{"title": "Stable damage", "text": "Always take Oversized with Greater Draw I and II for the most reliable damage."}, {"title": "Last two cards", "text": "Use your last two picks on more damage like Volley, or on Electrifying or Sticky Cards if the lobby has lots of healing or movement kits."}, {"title": "Open fights", "text": "Fortuna has great damage for starting fights. It's a strong 1v1 kit, but weaker in group fights."}], "counter": [{"title": "Focus it early", "text": "You can't stop Fortuna from throwing cards. The only real counter is to target it first so it can't deal the damage it needs to unlock cards."}], "skins": [{"name": "Decayed Skin", "img": "images/skins/fortuna-decayed.webp"}], "bal": "bal", "balWhy": "Fortuna needs to upgrade before it gets good damage and perks. It's very versatile and has great damage for starting fights, and it's a good 1v1 kit but worse in group fights.", "deck": true},
{"name": "Freiya", "img": "images/kits/freiya.webp", "cls": "Fighter", "tiers": {"casual": "B", "ranked": "A"}, "diff": "hard", "hp": "100", "desc": "Dealing damage will apply stacks of Frost. At four stacks, Frost is consumed and applies Frostbite to the target, making them fragile. Emerald Sword is replaced by the Ice Sword, which applies two stacks per hit. Use your Frost Explosion ability to immediately deal damage to nearby targets with stacks of Frost.", "adv": "Every sword hit gives the enemy 1 Frost stack, up to 4. Only swords give stacks, and stacks last 10 seconds. Use Detonate Ice Stacks to blow up the stacks on every enemy within 9 blocks, dealing damage based on how many stacks they have (see the table). Detonation has about 20% armor penetration (from tests) and a 10 second cooldown.\nDetonating also gives the enemy Frostbite: for a short time your hits on them deal 4 extra damage, and that extra damage has high armor penetration. Frostbite lasts 2 seconds from 1 stack, 3 seconds from 2, and 4 seconds from 3 or 4 stacks. For example, a wood sword (20 damage) that normally deals 8.8 to iron armor deals 11.89 to a Frostbitten enemy.\nThe Ice Sword replaces the Diamond Sword and costs 5 emeralds. Freiya can't buy the Emerald Sword. The Ice Sword gives 2 stacks per hit, so you only need 2 hits to reach 4 stacks, and the 4 Frostbite damage is built into every hit: 44 + 4 = 48 damage. With the Ice Sword, detonating is just for the extra burst damage, since you already have Frostbite on every hit. Holding the Ice Sword doesn't change detonation damage.", "items": [{"name": "Ice Sword", "img": "images/items/ice-sword.png", "note": "5 emeralds, replaces Diamond Sword", "desc": "Replaces the Diamond Sword. Each hit gives 2 Frost stacks and deals 44 damage + 4 Frostbite damage (48 total). Detonating doesn't add more on-hit damage while you use it, and holding it doesn't change detonation damage.", "dmg": 48, "cd": 0.3, "dmgText": "44 + 4"}], "abilities": [{"name": "Detonate Ice Stacks", "img": "images/abilities/ability-template.png", "note": "9 block radius", "desc": "Blow up the Frost stacks on every enemy within 9 blocks for 1.9 / 3.61 / 6.68 / 13.03 damage at 1–4 stacks, with about 20% armor penetration. Also applies Frostbite (+4 damage per hit) for 2–4 seconds.", "cd": 10, "dmg": 13.03, "dmgText": "1.9 – 13.03", "nodps": true}], "history": [{"type": "bal", "date": "Jul 3, 2026", "title": "", "changes": ["Ability no longer detonates automatically upon reaching max stacks.", "Ability cooldown reduced: 15 → 10"]}, {"type": "buff", "date": "Sep 5, 2025", "title": "", "changes": ["Frost bite damage (without ice sword): 3 → 4", "Ice sword attack speed: .35 - >.3", "Cooldown to apply stacks on the same player after detonating stacks: 3 → 2.5 seconds", "Stacks can now be applied on non-player entities", "Fixed extra on-hit frost damage being applied even when enemy isn’t frostbitten", "Detonate Ice Stacks Ability", "Detonate Ice Stacks Ability now ignores all armor", "Ice stacks will now auto detonate when a player reaches max stacks (This doesn’t put the ability on cooldown)", "Detonate Ice Stacks Ability now applies Frost Bite Status Effect at any stack count", "Duration of Frost Bite Status Effect depends on the amount of stacks detonated on a player. (3,4,5,6)", "Using an ice sword prolongs the duration by 2 seconds", "Ice Sword", "Ice Sword now applies Frost Bite Status effect on-hit. (Applies for effect for 6 seconds)", "Detonate Ice Stacks will do 30% more damage when Ice Sword is in hand", "Frost Bite Status Effect Rework", "Frost Bite reduces the armor values of a player/monster by 30%"]}, {"type": "buff", "date": "Aug 9, 2024", "title": "", "changes": ["Ice sword swing cooldown reduced from 0.45 → 0.35s"]}, {"type": "nerf", "date": "Mar 15, 2024", "title": "", "changes": ["Increase sword cost (4 emeralds → 6 emeralds)", "Decrease sword attack speed (0.3s → 0.45s)"]}, {"type": "nerf", "date": "Feb 16, 2024", "title": "", "changes": ["Increased cost of Ice Sword 3 emeralds → 5 emeralds", "Decreased Frost Explosion ability armor penetration 80% → 60%", "Decreased Frost Bite damage with any sword 4 → 3", "Decreased Frost Bite damage with Ice Sword 7 → 6"]}, {"type": "nerf", "date": "Feb 2, 2024", "title": "", "changes": ["Frost explosion ability armor penetration reduced 100% → 80%"]}, {"type": "bal", "date": "Jan 19, 2024", "title": "Rework", "changes": ["Now applies a frost stack every attack, up to 4 stacks. Damage from the Ice Sword applies two stacks", "Frostbite is applied to enemies at full stacks, making them fragile and take extra frost damage when hit", "New Frost Explosion ability: clears frost stacks from nearby targets and deals explosive damage to each", "No longer needs to fill the Ice Bar to unlock her ability", "Removed the slow debuff at full stacks"]}, {"type": "buff", "date": "Dec 15, 2023", "title": "", "changes": ["Reduced damage dealt requirement to unlock Frost passive ability 250 → 200"]}, {"type": "buff", "date": "Oct 13, 2023", "title": "", "changes": ["Ice stacks apply faster 0.25s cooldown → 0.2s cooldown", "Increased time before ice stacks expire 10s → 15s"]}, {"type": "buff", "date": "May 19, 2023", "title": "", "changes": ["Enemies are now dealt 5 damage when Freiya’s passive effect is applied with the Ice Sword"]}, {"type": "buff", "date": "Feb 10, 2023", "title": "", "changes": ["Ice sword cost: 4 ems → 3 ems"]}, {"type": "buff", "date": "Dec 9, 2022", "title": "", "changes": ["Ice Sword price: 6 ems → 4 ems"]}, {"type": "buff", "date": "Dec 10, 2021", "title": "", "changes": ["Base slow length: 0.8s → 1.6s", "Amplified slow length: 1s → 2.5s"]}], "obtain": {"src": "Kit Shop", "buy": 10000, "rent": 1500}, "passives": [{"name": "Frost Stacks", "when": "Sword hits", "desc": "Each sword hit gives 1 Frost stack (2 with the Ice Sword), up to 4. Stacks last 10 seconds. Other weapons don't give stacks."}, {"name": "Frostbite", "when": "After detonating", "desc": "Your hits deal 4 extra damage with high armor penetration, for 2 seconds (1 stack), 3 seconds (2 stacks) or 4 seconds (3–4 stacks)."}], "tables": [{"title": "Detonation damage", "head": ["Stacks", "Damage", "Frostbite"], "rows": [["1", "1.9", "2s"], ["2", "3.61", "3s"], ["3", "6.68", "4s"], ["4", "13.03", "4s"]], "note": "From tests, no armor. About 20% armor penetration."}], "strategy": [{"title": "Early game", "text": "Before you have the Ice Sword, detonate as soon as you can for extra early damage. It usually lets you kill an enemy in one less hit."}, {"title": "Once enemies have armor", "text": "Detonate at around 3–4 stacks for the best damage over time."}, {"title": "With the Ice Sword", "text": "Hit everyone until they have 4 stacks, then detonate."}], "counter": [{"title": "Wait out the cooldown", "text": "You can't stop Freiya from detonating, but once it has used the ability, build up and stall until the fight is safer. It has a 10 second cooldown."}], "skins": [{"name": "Tiger Brawler Skin", "img": "images/skins/freiya-tiger-brawler.webp"}, {"name": "Bunny Skin", "img": "images/skins/freiya-bunny.webp"}, {"name": "Victorious Gold Skin", "img": "images/skins/freiya-victorious-gold.webp"}, {"name": "Victorious Platinum Skin", "img": "images/skins/freiya-victorious-platinum.webp"}, {"name": "Victorious Diamond Skin", "img": "images/skins/freiya-victorious-diamond.webp"}, {"name": "Victorious Emerald Skin", "img": "images/skins/freiya-victorious-emerald.webp"}, {"name": "Victorious Nightmare Skin", "img": "images/skins/freiya-victorious-nightmare.webp"}], "bal": "bal", "balWhy": "Freiya deals great damage, and its focus on armor penetration is a nice touch. It takes more skill than before, since stacks used to detonate on their own and now you have to press the ability yourself after stacking everyone."},
{"name": "Frosty", "img": "images/kits/frosty.webp", "cls": "Ranged", "tiers": {"casual": "B", "ranked": "B"}, "diff": "moderate", "hp": "100", "desc": "Passively create Frosted Snowballs for free. Frosted Snowballs are faster and larger.", "adv": "Frosty gets a free Frosted Snowball every 3 seconds, and can hold up to 64. Snowballs deal 3 to 5 damage depending on how long you charge them: 3 if you spam them (one every 0.3 seconds), 4 with a 0.4 second charge, and 5 with a 0.5 second charge. Charging doesn't make them faster, but they fly a bit farther. They have 75% armor penetration.\nEvery hit slows the enemy by about 60% for 1 second (from tests). The slow doesn't stack, but each hit resets it, so you can keep an enemy slowed. Snowballs also work with enchants.", "items": [{"name": "Frosted Snowball", "img": "images/items/frosted-snowball.png", "note": "Free every 3s, up to 64", "desc": "Deals 3 damage when spammed, 4 with a 0.4 second charge, or 5 with a 0.5 second charge, with 75% armor penetration. Charged snowballs fly a bit farther. Slows the enemy by about 60% for 1 second, and each hit resets the slow. Works with enchants.", "dmg": 5, "dmgText": "3 – 5", "cd": 0.5, "dpsText": "10"}], "abilities": [], "history": [{"type": "buff", "date": "Dec 12, 2025", "title": "", "changes": ["Frosty snowball projectile armor penetration multiplier: 10% → 75%"]}, {"type": "buff", "date": "Dec 1, 2023", "title": "", "changes": ["Now receives frosty snowballs", "Decreased rate of receiving frosty snowballs every 1.8s → every 3s", "Frosty snowballs", "Decreased fire rate", "Decreased knockback", "Decreased slow"]}, {"type": "bal", "date": "Mar 18, 2022", "title": "", "changes": ["Removed slowness from snowballs", "Buffed snowball spawn rate"]}], "obtain": {"src": "Season 3 Battle Pass", "tier": "40 (free)", "badge": "images/bp/s3.webp", "rent": 2000}, "passives": [{"name": "Snowball Maker", "when": "Every 3 seconds", "desc": "Get a free Frosted Snowball, up to 64."}, {"name": "Chill", "when": "Snowball hits", "desc": "Slows the enemy by about 60% for 1 second. It doesn't stack, but each hit resets it."}], "tables": [{"title": "Charge damage", "head": ["Charge", "Time per throw", "Damage", "DPS", "Snowballs per 10s"], "rows": [["Spam", "0.3s", "3", "10", "33"], ["Short charge", "0.4s", "4", "10", "25"], ["Full charge", "0.5s", "5", "10", "20"]], "note": "75% armor penetration. Every charge level deals the same damage per second, but charging uses fewer snowballs and flies a bit farther."}], "strategy": [{"title": "Keep them slowed", "text": "The slow lasts 1 second, so time your throws to keep the enemy slowed the whole time and deal full charged damage while saving snowballs."}, {"title": "Charge to save snowballs", "text": "Spamming, short charges and full charges all deal about 10 damage per second, but full charges use the fewest snowballs and fly a bit farther. Only spam when you have plenty of snowballs to burn."}, {"title": "Get Fire", "text": "Snowballs work with enchants. Fire enchant makes them shred even more."}], "counter": [{"title": "Block the snowballs", "text": "Build blocks behind you when running from Frosty, or in front of you when chasing it."}, {"title": "Drain its snowballs", "text": "Make it waste its snowballs. Once it runs out, it can only throw one every 3 seconds."}, {"title": "Use your movement", "text": "Snowballs don't ground or Gloop you, so you can still use movement abilities."}], "bal": "sup", "balWhy": "Frosty is pretty good early game since the slow helps you chase enemies, and the damage is okay early with high armor penetration. But there are much better ways to slow enemies, especially kits with area slows, so it's outclassed by other projectile slowers."},
{"name": "Gingerbread Man", "img": "images/kits/gingerbread-man.webp", "cls": "Support", "tiers": {"casual": "A", "ranked": "A"}, "diff": "hard", "hp": "100", "desc": "Place gumdrops bounce pads for extreme movement. Using a gumdrop bounce pad negates all fall damage and grants a shield.", "adv": "Gingerbread Man can buy Gumdrop Bounce Pads for 40 iron each, with no limit on how many you buy or place. You can break your own gumdrops in one hit with any tool. Teammates can't pick them up. Enemies need 2 hits with shears, or about 5 hits with a pickaxe or axe.\nStepping on a gumdrop launches you 19 blocks into the air and gives you a 30 HP shield for 5 seconds. You can't get the shield again for 15 seconds, counting from when you first got it. Teammates can bounce on your gumdrops and get the shield too, but enemies can't use them. For 7 seconds after bouncing, you take no fall damage.\nIf you keep bouncing on the same gumdrop, each bounce goes 1 block lower. Stay off it for 5 seconds to get the full height back. You can't use gumdrops while Grounded (for example from Gloop).", "items": [{"name": "Gumdrop Bounce Pad", "img": "images/items/gumdrop-bounce-pad.png", "note": "40 iron, no limit", "desc": "Launches you and teammates 19 blocks up, with no fall damage for 7 seconds. Gives a 30 HP shield for 5 seconds (15 second cooldown). Each bounce in a row goes 1 block lower; step off for 5 seconds to reset. You break it in one hit; enemies need 2 hits with shears or about 5 with a pickaxe or axe. Can't be used while Grounded."}], "abilities": [], "history": [{"type": "nerf", "date": "Jul 3, 2026", "title": "", "changes": ["Jump power now decays when jumping continuously."]}, {"type": "bal", "date": "Oct 13, 2023", "title": "", "changes": ["Increased shield 15hp → 30hp", "Shield now expires after 5 seconds"]}, {"type": "nerf", "date": "Jul 14, 2023", "title": "", "changes": ["Allies can’t pickup your placed gumdrops"]}, {"type": "nerf", "date": "Dec 30, 2022", "title": "", "changes": ["Can no longer use Gumdrops while you have the Grounded status effect"]}, {"type": "buff", "date": "Dec 6, 2022", "title": "", "changes": ["Gumdrop shield: 12 → 15"]}, {"type": "buff", "date": "Nov 18, 2022", "title": "", "changes": ["Gumdrop shield increased (10 → 12)", "Enemies no longer get the gumdrop when they break it", "Enemies break gumdrop at 20% speed"]}], "obtain": {"src": "Season 3 Battle Pass", "tier": "20 (free)", "badge": "images/bp/s3.webp", "rent": 2000}, "passives": [{"name": "Gumdrop Shield", "when": "Bouncing on a gumdrop", "desc": "You and teammates get a 30 HP shield for 5 seconds. You can't get it again for 15 seconds, counting from when you first got it."}, {"name": "Bounce Decay", "when": "Bouncing again and again", "desc": "Each bounce in a row is 1 block lower. Stay off the gumdrop for 5 seconds to get the full 19 blocks back."}, {"name": "Safe Landing", "when": "After bouncing", "desc": "No fall damage for 7 seconds."}], "strategy": [{"title": "Learn the Gingerbread technique", "text": "Break the gumdrop the moment you bounce off it, then pick it back up and place it again. This lets you keep running and jumping with the same gumdrop."}, {"title": "Carry spares", "text": "Always have 2–3 gumdrops on you, for your teammates and in case you leave one behind and forget to break it."}], "counter": [{"title": "Buy shears", "text": "When you see a Gingerbread Man, buy shears: they break a gumdrop in 2 hits instead of about 5 with a pickaxe or axe."}, {"title": "Cover, then break", "text": "Cover a gumdrop with blocks and then break it, so the Gingerbread Man can't bounce on it again."}, {"title": "Blow up the base", "text": "If you see lots of gumdrops at a base, hit it with fireballs or rain TNT on it."}, {"title": "Ground it", "text": "Gloop or any other Grounded effect stops Gingerbread Man from using gumdrops, along with almost every other movement item."}], "bal": "bal", "balWhy": "Gingerbread Man is a fun kit with its own counterplay, and it's a decent support kit. It may need a rework to lean more toward support and less toward stalling."},
{"name": "Gompy", "img": "images/kits/gompy.webp", "cls": "Ranged", "tiers": {"casual": "C", "ranked": "C"}, "diff": "moderate", "hp": "100", "desc": "Gompy the Ghost Hunter! Find ghosts around the map, vacuum them and fire them across the map.", "adv": "Ghosts spawn around the map at about the same rate as Death Adder's collectibles, and also when someone dies (not to the void). How many spawn depends on the map. Only Gompys can see ghosts. All Gompys in a match share the same ghosts, but each ghost can only be collected by one of them. Stand within 3 blocks of a ghost for 1 second to collect it. Each ghost fills 30% of your ectoplasm bar, up to 100%. Ghosts despawn after 3 minutes.\nBuy the Vacuum for 50 iron to shoot ghosts. Charging it for up to 2.5 seconds raises the damage, speed and knockback. Damage goes up evenly from 36 to 72 (about 50 at 1 second). Charges up to about 1 second still cost only 10% ectoplasm, and after that the cost climbs to 40% at full charge.\nAn uncharged shot deals 36 damage, knocks back 2 blocks and travels 12 blocks per second.\nA full charge deals 72 damage, knocks back 12 blocks and travels 24 blocks per second.\nYou can't shoot with less than 10% ectoplasm. With less than 40% you can still charge, but only partway. Shots have 50% armor penetration (from tests) and a 1 second cooldown. You move about 40% slower while charging.", "items": [{"name": "Vacuum", "img": "images/items/vacuum.png", "note": "50 iron", "desc": "Shoots a ghost. Charge up to 2.5 seconds: 36 to 72 damage, 2 to 12 blocks of knockback, and 12 to 24 blocks per second. Costs 10% ectoplasm for charges up to about 1 second, rising to 40% at full charge. Needs at least 10%. 50% armor penetration. 1 second cooldown. You move about 40% slower while charging.", "cd": 1, "dmg": 72, "dmgText": "36 – 72", "nodps": true}], "abilities": [], "history": [{"type": "bal", "date": "Oct 30, 2026", "title": "Rework", "changes": ["Collecting ghosts now fills an “ectoplasm” bar", "The vacuum now uses a charged attack, consuming more ectoplasm with longer charges, and dealing more damage and knockback", "No longer use the vacuum to collect ghosts, it’s a proximity prompt (as an adjustment for the vacuum using charged attacks now)", "Ghosts teleport after a while when there are no nearby Gompy players", "Ghosts spawn on non-void kills, unless the maximum number of ghosts has been reached, or there are other nearby ghosts"]}, {"type": "bal", "date": "Jan 30, 2026", "title": "", "changes": ["Collectible spawn rates now scale with map size: larger maps spawn more, smaller maps spawn less"]}, {"type": "nerf", "date": "Dec 12, 2025", "title": "", "changes": ["Vacuum ghost capacity: 4 →2"]}, {"type": "buff", "date": "Oct 31, 2025", "title": "", "changes": ["Vacuum ghost capacity increased: 1 → 4", "Ghost spawns increased"]}, {"type": "buff", "date": "Oct 25, 2024", "title": "", "changes": ["Increased initial ghosts on spawn: 3 ghosts → 4 ghosts", "Increased ghost spawnrate: approx. 1 ghost per 15s → 1 ghost per 12.5s"]}, {"type": "buff", "date": "Oct 13, 2023", "title": "", "changes": ["Reduced vacuum price 60 → 50 iron"]}, {"type": "bal", "date": "Nov 5, 2021", "title": "", "changes": ["Ghost damage: 90 damage → 60 damage with 40% armor penetration"]}], "obtain": {"src": "Season 2 Battle Pass", "tier": "20 (free)", "badge": "images/bp/s2.webp", "rent": 2000, "buy": 25000}, "passives": [{"name": "Ghost Hunting", "when": "Within 3 blocks of a ghost", "desc": "Collect it in 1 second to fill 30% of your ectoplasm bar (max 100%). Ghosts are shared between Gompys, but only one can collect each ghost."}, {"name": "Haunted Kills", "when": "Non-void deaths", "desc": "A ghost spawns where someone died, unless there are already ghosts nearby or the map is full."}], "tables": [{"title": "Charge levels", "head": ["", "Uncharged", "1 second", "Full charge"], "rows": [["Damage", "36", "~50", "72"], ["Ectoplasm", "10%", "10%", "40%"], ["Shots per full bar", "10", "10", "2.5"], ["Damage per full bar", "360", "~500", "180"], ["Damage per second", "36", "~25", "~20.6"], ["Knockback", "2 blocks", "—", "12 blocks"], ["Speed", "12 blocks/s", "—", "24 blocks/s"]], "note": "Damage per second includes the 1 second cooldown. Damage scales evenly with charge time."}], "strategy": [{"title": "1 second charges", "text": "Charging for about 1 second deals around 50 damage but still costs only 10% ectoplasm, so it gets the most damage out of each ghost."}, {"title": "Spam up close", "text": "Uncharged shots deal the most damage per ghost and per second. If someone is chasing you, spam them for steady chip damage."}, {"title": "Charge for the void", "text": "Full charges knock enemies 12 blocks, which is great for knocking them into the void."}, {"title": "Charge when chasing", "text": "When you're chasing someone, charge to the max so the ghost reaches them faster and hits harder."}], "counter": [{"title": "Dodge it", "text": "Ghosts are easy to dodge. Strafe if Gompy is shooting from the side, and build up if it's shooting straight at you."}, {"title": "Get close", "text": "Low-charge ghosts are very slow, so get close and avoid them, where Gompy doesn't have time to charge."}], "skins": [{"name": "OG Chroma Skin", "img": "images/skins/gompy-og-chroma.webp"}], "bal": "sup", "balWhy": "Gompy's damage and knockback are good across the board, but the rework made it much worse. Spamming does more damage, but you have to be very close and collect twice as many ghosts as before. To get damage like before the rework, you have to charge slowly while moving slower, when before you could just shoot instantly."},
{"name": "Gregory", "img": "images/kits/gregory.webp", "cls": "Fighter", "tiers": {"casual": "C", "ranked": "C"}, "diff": "moderate", "hp": "100", "desc": "Place gargoyle statues and take control of them.", "adv": "Gregory can buy 3 Gargoyle Statues: Small for 50 iron, Regular for 1 emerald and Giant for 2 emeralds. You can hold as many as you want, but only place 4 at a time, and the Giant takes up 2 of those slots. When you place one, it faces the way you're looking.\nHop into a placed statue to control it as a gargoyle. While you do, your real body turns into a statue that glows for nearby enemies. You can swap between any of your placed statues, and return to your real body whenever you want; the gargoyle you left turns back into a statue. Statues don't show a name tag unless you're in them.\nYour real body is weak while it's a statue: any explosion kills it instantly. Enemies can also mine it like a block (10 hits with a wood pickaxe, 3 with diamond). If someone is mining you, you get an alert and can jump back into your body to fight with whatever HP you have left. Placed statues can be mined too: Regular takes the same as your body, Giant takes 5 diamond pickaxe hits and Small takes 2.\nGargoyles wear the same armor you do, take no fall damage, and can only use tools, swords, blocks, bows and crossbows, arrows and TNT (no Fireballs, Telepearls or other items). Jumping has to be pressed each time; holding jump doesn't work. Gargoyles can pick up resources and loot enemies they kill. When you go back to your real body, everything they carried is deposited automatically within 5 blocks.\nIf your gargoyle dies, you go back to your real body, where you can take over another statue or buy a new one.", "items": [{"name": "Small Gargoyle Statue", "img": "images/items/gargoyle-statue-small.png", "note": "50 iron, 1 slot", "desc": "50 HP, 1 block tall. Swords deal 30% less damage and swing every 0.36s. Jumps 1 block. Small enough to get into tight spots like bed defenses. Breaks in 2 diamond pickaxe hits."}, {"name": "Regular Gargoyle Statue", "img": "images/items/gargoyle-statue-regular.png", "note": "1 emerald, 1 slot", "desc": "90 HP, 2 blocks tall. Swords deal 10% less damage and swing every 0.34s. Jumps 2 blocks. Breaks in 10 wood or 3 diamond pickaxe hits."}, {"name": "Giant Gargoyle Statue", "img": "images/items/gargoyle-statue-giant.png", "note": "2 emeralds, 2 slots", "desc": "200 HP, 3.5 blocks tall and 3.5 blocks wide. Normal sword damage, but swings only every 0.67s. Jumps 5 blocks. Breaks in 5 diamond pickaxe hits."}], "abilities": [], "history": [{"type": "buff", "date": "Oct 30, 2026", "title": "", "changes": ["Swift Gargoyle Statue price changed from 1 emerald to 50 Iron"]}], "obtain": {"src": "Halloween Battle Pass 2026", "tier": "35", "badge": "images/bp/halloween-2026.webp", "note": "Cannot be rented yet"}, "passives": [{"name": "Stone Body", "when": "Controlling a gargoyle", "desc": "Your real body becomes a glowing statue. Any explosion kills it instantly, and enemies can mine it. You get an alert when it's being mined."}, {"name": "Gargoyle Form", "when": "Controlling a gargoyle", "desc": "Same armor as you, no fall damage, and only tools, swords, blocks, bows, crossbows, arrows and TNT can be used."}, {"name": "Loot Drop-off", "when": "Returning to your body", "desc": "Resources your gargoyle picked up are deposited automatically within 5 blocks."}], "tables": [{"title": "Gargoyle forms", "head": ["Form", "HP", "Size", "Sword damage", "Sword cooldown", "Jump", "Diamond sword DPS"], "rows": [["Your body", "100", "2 blocks", "100%", "0.3s", "Normal", "140"], ["Small", "50", "1 block", "70%", "0.36s", "1 block", "~82"], ["Regular", "90", "2 blocks", "90%", "0.34s", "2 blocks", "~111"], ["Giant", "200", "3.5 × 3.5 blocks", "100%", "0.67s", "5 blocks", "~63"]], "note": "Diamond sword DPS = 42 damage × sword damage ÷ cooldown, with no armor."}], "strategy": [{"title": "Farm with the Small statue", "text": "Use the Small gargoyle to collect diamonds and emeralds and save up for a crossbow and tier 3 upgrades."}, {"title": "Be a pest", "text": "Use the Small gargoyle to shoot people with a crossbow and help your teammates at middle without being there yourself."}, {"title": "Protect your body", "text": "If you know someone is coming for you, always leave the gargoyle and deal with them yourself."}], "counter": [{"title": "Go for the real body", "text": "Ignore the gargoyle, since it's very weak. Find Gregory's glowing statue and hit it with a fireball or TNT to kill it instantly."}, {"title": "Just fight it", "text": "If you have to fight a gargoyle, just kill it. Gregory wastes 1–2 emeralds, and even the Giant can't beat you with the same gear."}], "bal": "weak", "balWhy": "Every gargoyle form has bad damage and terrible sword cooldowns, and only the Giant has good HP. Its only real uses are taking no fall damage and getting into beds with the Small form. It's expensive and needs a stat rework to keep up."},
