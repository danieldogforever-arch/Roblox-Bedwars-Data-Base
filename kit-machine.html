<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kit Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0418;--card:#150b38;--soft:rgba(255,255,255,.07);--line:rgba(255,255,255,.28);--text:#fff;--muted:#b9aee0;--accent:#a98bff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-weight:400}
body{margin:0;min-height:100vh;color:var(--text);font:400 1.05rem/1.5 "Jua","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 15% 8%,rgba(110,60,220,.35),transparent 40%),radial-gradient(circle at 85% 92%,rgba(120,50,230,.3),transparent 45%),radial-gradient(circle,rgba(255,255,255,.3) 1px,transparent 1.6px) 0 0/87px 87px,radial-gradient(circle,rgba(180,156,255,.25) 2px,transparent 2.8px) 37px 51px/131px 131px,var(--bg);background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:2.8rem;margin:0;line-height:1.1}
h2{font-size:1.7rem;margin:0;line-height:1.2}
h3{font-size:1.2rem;margin:22px 0 6px}
p{margin:0 0 12px}.muted{color:var(--muted)}
.lead{margin:6px 0 0}
.box{background:rgba(8,3,26,.9);border:4px solid #fff;padding:24px;margin-top:26px}
.label{color:var(--muted);font-size:.95rem;margin:18px 0 8px}
#q{width:100%;font:inherit;font-size:1.3rem;padding:14px 16px;background:var(--card);color:#fff;border:3px solid #fff;border-radius:14px}
#q::placeholder{color:var(--muted)}
button{font:inherit;color:#fff;cursor:pointer}
button:focus-visible,#q:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#strip{display:flex;gap:12px;overflow-x:auto;padding:16px 2px 6px;cursor:grab;user-select:none;scrollbar-width:thin}
#strip.off{display:none}
.sitem{flex:none;display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:8px 18px 8px 8px;text-align:left}
.sitem:hover,.card:hover{border-color:#fff}
.sitem small{display:block;color:var(--muted);font-size:.85rem;line-height:1.2}
.th{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;background:#0d0626;border:2px solid #fff}
.th img,.pic img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.6em}
.cchip{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border:0;border-radius:99px;padding:6px 16px}
.cchip.on{background:#fff;color:#12082e}
.cchip.on .cico{filter:brightness(0)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cico{width:26px;height:26px;object-fit:contain;filter:brightness(0) invert(1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:16px;padding-top:6px}
.card{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.card .th{width:100%;height:auto;aspect-ratio:1;font-size:1.4rem}
.card b{display:block;margin-top:8px;line-height:1.15}
.card small{color:var(--muted)}
.dm{display:inline-block;width:12px;height:12px;border:2px solid #fff;border-radius:3px;transform:rotate(45deg);background:var(--c);margin:0 7px 0 3px;vertical-align:0}
.card .dm{position:absolute;top:2px;right:2px;margin:0;width:16px;height:16px;z-index:1}
.easy{--c:#5fe3a1}.moderate{--c:#ffd166}.hard{--c:#ff6b81}.extreme{--c:#a98bff}
.dgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px}
@media(max-width:780px){.dgrid{grid-template-columns:1fr}}
.pic{aspect-ratio:1;border:4px solid #fff;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:6rem}
.cap{text-align:center;margin-top:8px;color:var(--muted);min-height:1.5em}
.picwrap{position:relative}
.adet{margin-bottom:8px}
.dock{display:flex;flex-wrap:wrap;gap:14px 12px;align-items:flex-start}
.slot{align-self:flex-start;display:block;width:92px;background:none;border:0;padding:0;text-align:center;font-size:.8rem;line-height:1.15;color:var(--muted)}
.slot .aico{width:92px;height:92px;border:2px solid transparent}
.slot.on .aico{border-color:#fff;background:rgba(255,255,255,.16)}
.slot.on{color:#fff}
.slot:hover .aico{border-color:var(--line)}
.slot span{display:block;margin-top:6px;overflow-wrap:anywhere}
.dleft{position:sticky;top:20px;align-self:start}
.dleft .stats{grid-template-columns:repeat(2,minmax(0,1fr));margin:16px 0 0}
.dleft .stat{min-width:0}
.dleft .stat b,.dleft .cbtn{font-size:1.15rem;overflow-wrap:anywhere}
.dleft .cbtn .cico{width:30px;height:30px;flex:none}
@media(max-width:780px){.dleft{position:static}}
.wbtn{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:14px;background:rgba(8,3,26,.88);border:2px solid #fff;display:flex;align-items:center;justify-content:center;padding:0;z-index:3}
.wbtn.on{background:#fff;color:#12082e}
.wbtn img{width:30px;height:30px;object-fit:contain}
.wbtn i{position:absolute;right:-8px;bottom:-8px;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:#12082e;font-style:normal;font-size:.8rem;line-height:22px;text-align:center;padding:0 5px}
.skpanel{position:absolute;top:66px;left:10px;right:10px;z-index:4;background:rgba(8,3,26,.97);border:3px solid #fff;border-radius:16px;padding:16px 16px 20px;max-height:320px;overflow:auto}
.skpanel .t{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 10px;align-items:start}
.skgrid .sk{font-size:.7rem;line-height:1.1}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 16px}
.btn:hover{border-color:#fff}.btn.on{background:#fff;color:#12082e}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#skinbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-top:12px}
.sk{background:none;border:0;padding:0;text-align:center;font-size:.8rem;color:var(--muted);align-self:start;display:block}
.sk .lb{display:block;margin-top:8px;padding:0 2px;overflow-wrap:break-word;hyphens:none;line-height:1.2}
.sk .th{width:100%;height:auto;aspect-ratio:1;display:block;box-sizing:border-box;border:3px solid #fff}
.sk.on .th{border-color:var(--accent)}.sk.on{color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0 4px}
.stat{background:var(--soft);border-radius:14px;padding:12px 14px}
.stat>span{display:block;color:var(--muted);font-size:.85rem;margin-bottom:2px}
.stat b,.cbtn{font-size:1.35rem}
.cbtn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.cbtn .cico{width:38px;height:38px}
.tabs{display:flex;flex-wrap:wrap;gap:6px 26px;margin:24px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 2px;margin-bottom:-1px;color:var(--muted);font-size:1.15rem}
.tab.on{color:#fff;border-color:#fff}
.ab{display:flex;gap:16px;background:var(--soft);border-radius:16px;padding:14px;margin-bottom:14px}
.aico{width:84px;height:84px;flex:none;border-radius:14px;background:rgba(255,255,255,.07);padding:6px;font-size:2.6rem}
.aico .ph{background:none!important}
.aico img{width:100%;height:100%;object-fit:contain;display:block}
.tag{background:var(--accent);color:#12082e;border-radius:6px;padding:0 9px;font-size:.8rem;margin-right:10px}
.nm{font-size:1.25rem}
.modebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.mbtn{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 20px;font-size:1.1rem}
.mbtn small{opacity:.7;margin-left:8px;font-size:.85rem}
.mbtn:hover{border-color:#fff}.mbtn.on{background:#fff;color:#12082e}
.tpair{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.tbtn{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:4px 14px;text-align:center;min-width:92px}
.tbtn small{display:block;font-size:.75rem;color:var(--muted)}.tbtn b{font-size:1.4rem;line-height:1.2}
.tbtn:hover{border-color:#fff}.tbtn.on{background:#fff;color:#12082e}.tbtn.on small{color:#4a3d7a}
.dleft .stat.wide{grid-column:1/-1}
.cost{display:flex;align-items:center;gap:8px;width:fit-content;margin:10px 0 4px;padding:5px 14px 5px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:1rem;line-height:1}
.cost img{height:22px;width:auto;max-width:30px;object-fit:contain;display:block}
.cost b{font-weight:400;background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cost.emerald{background:rgba(60,200,120,.12);border-color:rgba(110,235,160,.35)}
.cost.emerald b{background-image:linear-gradient(90deg,#b6ffd2,#4be08a 55%,#1fa862)}
.cost.iron{background:rgba(220,225,235,.1);border-color:rgba(230,235,245,.3)}
.cost.iron b{background-image:linear-gradient(90deg,#ffffff,#d5d9e0 55%,#9aa1ac)}
.calc input{width:96px;background:var(--soft);color:inherit;font:inherit;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 10px}
.calc .cres{font-size:1.4rem;margin-left:6px}
.calc .cnote{font-size:.85rem;opacity:.7;margin-left:6px}
.ctable{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:12px}
.ctable span{background:rgba(255,255,255,.07);border-radius:8px;padding:4px 10px;font-size:.88rem}
.ctable b{font-weight:400;color:var(--accent)}
.cond{display:inline-block;margin-top:6px;background:rgba(255,255,255,.14);border-radius:8px;padding:1px 10px;font-size:.9rem}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nums span{background:rgba(0,0,0,.35);border-radius:8px;padding:2px 12px;color:var(--muted);font-size:.95rem}.nums b{color:#fff}
.fus{background:var(--soft);border-radius:18px;padding:18px;margin-bottom:16px}
.fpair{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,28px);margin-bottom:14px}
.fp{width:clamp(96px,26vw,138px);text-align:center;background:none;border:0;padding:0;font-size:1.15rem;line-height:1.25}
.fp .th{width:100%;height:auto;aspect-ratio:1;border-width:3px;border-radius:14px;margin-bottom:8px;display:block}
button.fp:hover .th{border-color:var(--accent)}
.plus{font-size:2.6rem;line-height:1}
.pbox{background:var(--soft);border-radius:16px;padding:16px 18px;margin-top:18px}
.pbox h3{margin:0 0 10px}
.pitem{margin-bottom:14px}.pitem:last-child{margin-bottom:0}
.when{background:rgba(255,255,255,.14);border-radius:6px;padding:0 9px;font-size:.8rem;margin-left:10px}
.fus p{margin:0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kit Machine</h1>
  <p class="muted lead">Type a kit name, pick one from the bar, or browse by class and tier. Stats, passives and strategy are still being added for each kit.</p>
  <div id="modebar" class="modebar" role="group" aria-label="Tier list"></div>

  <div class="box">
    <input id="q" type="text" placeholder="Type a kit name…" autocomplete="off" aria-label="Search kits">
    <div id="strip" class="off" aria-label="Matching kits"></div>
  </div>

  <div id="detail" class="box" hidden></div>

  <div id="browse" class="box">
    <h2>Browse kits</h2>
    <div class="label">Class</div><div id="cls" class="chips"></div>
    <div class="label">Tier</div><div id="tier" class="chips"></div>
    <div id="count" class="label" style="margin-top:22px"></div>
    <div id="grid" class="grid"></div>
  </div>
<p class="muted" style="margin-top:28px;text-align:center;font-size:.9rem">Kit descriptions and item names from the <a href="https://robloxbedwars.fandom.com/wiki/Kit" style="color:#a98bff">Roblox Bedwars Wiki</a>.</p>
</div>

<script>
/* ===== DATA. tier: OP,S,A,B,C,F. diff: easy,moderate,hard,extreme.
   abilities and items are separate lists (any number, or none); each: name, desc, cd = cooldown (s), dmg = damage, hits = hits per use (optional), img = picture.
   passives: name, when (e.g. On spawn), desc. strategy: title, text. skins: name, img (up to 10).
   FUSIONS: list each pair once; it shows on both kits' pages. ===== */
var WARDROBE_IMG = ""; /* optional: put your own wardrobe/shirt picture here */
var CLASS_IMG = {Defender:"images/classes/defender.png",Economy:"images/classes/economy.png",Fighter:"images/classes/fighter.png",Movement:"images/classes/movement.png",Destroyer:"images/classes/destroyer.png",Support:"images/classes/support.png",Tank:"images/classes/tank.png",Ranged:"images/classes/ranged.png"};
var KITS = [
{"name": "Abaddon", "img": "images/kits/abaddon.webp", "cls": "Fighter", "tiers": {"casual": "A", "ranked": "A"}, "diff": "easy", "hp": "100", "desc": "Places Scarab Hives that periodically spawn scarabs to seek out and attack nearby enemies and beds.", "adv": "Each hive spawns scarabs that hunt down enemies and beds. Scarabs attack every 0.5 seconds. Scarabs from the same hive do not stack their damage, so two scarabs from one hive deal the same DPS as one. Scarabs from different hives do stack, so two hives can hit you twice as hard, and three hives deal up to 3x the DPS. Hives are weak to pickaxes and break in 5 hits with a wooden pickaxe, 4 with stone, and 2 with iron or diamond. When a hive expires or is broken, its scarabs take about 10 damage. Scarab upgrades and Hive upgrades are bought separately.", "items": [{"name": "Scarab Upgrade 1", "img": "images/items/scarab-upgrade-1.png", "note": "Cost: 40 iron", "desc": "Scarabs deal 4 damage and have 200 HP. Scarabs can now fly and climb blocks to reach enemies.", "cd": 0.5, "dmg": 4}, {"name": "Hive Upgrade 1", "img": "images/items/hive-upgrade-1.png", "note": "Cost: 40 iron", "desc": "Hive lasts 15 seconds and spawns 4 scarabs in total."}, {"name": "Scarab Upgrade 2", "img": "images/items/scarab-upgrade-2.png", "note": "Cost: 2 emeralds", "desc": "Scarabs deal 6 damage, have 200 HP, and move faster. An exploding scarab with 100 HP spawns alongside the 4th scarab, with the same damage and block destruction as TNT.", "cd": 0.5, "dmg": 6}, {"name": "Hive Upgrade 2", "img": "images/items/hive-upgrade-2.png", "note": "Cost: 2 emeralds", "desc": "Hive lasts 18 seconds and spawns a scarab every 3.5 seconds, 6 in total. An exploding scarab spawns with the 4th one, making 7 in total."}, {"name": "Scarab Upgrade 3", "img": "images/items/scarab-upgrade-3.png", "note": "Cost: 4 emeralds", "desc": "Scarabs deal 8 damage and have 225 HP. Every time a scarab hits an enemy, you heal 1 HP.", "cd": 0.5, "dmg": 8}, {"name": "Hive Upgrade 3", "img": "images/items/hive-upgrade-3.png", "note": "Cost: 4 emeralds", "desc": "Hive still lasts 18 seconds. Each spawn has a 25% chance to spawn an extra scarab. An exploding scarab still spawns with the 4th one."}], "abilities": [{"name": "Place Hive", "img": "images/abilities/ability-template.png", "desc": "Places a Scarab Hive that spawns scarabs. Base (Tier 0): scarabs have 150 HP and deal 2 damage. The hive lasts 12 seconds and spawns a scarab every 4.5 seconds, 3 in total. You get a new hive every 20 seconds, holding up to 2.", "cd": 20}], "passives": [{"name": "Hive Supply", "when": "Every 20 seconds", "desc": "You receive a new Scarab Hive every 20 seconds and can hold up to 2 at a time."}, {"name": "Scarab Climbing", "when": "Scarab Upgrade 1 and up", "desc": "Scarabs can fly and climb blocks to reach enemies."}, {"name": "Scarab Lifesteal", "when": "Scarab Upgrade 3", "desc": "Every time a scarab hits an enemy, you heal 1 HP."}], "strategy": [{"title": "Protect your hives", "text": "Enemies can break hives quickly, so place them up high or hide them where they are hard to reach."}, {"title": "Let scarabs tank for you", "text": "Use your scarabs as a shield: they soak up hits while you fight."}], "skins": []},
{"name": "Adetunde", "img": "images/kits/adetunde.webp", "cls": "Fighter", "tiers": {"casual": "S", "ranked": "A"}, "diff": "hard", "hp": "100", "desc": "Start with a powerful Frosty Hammer. Hitting enemies has a chance to drop Frost Crystals, which you can spend to upgrade your hammer.", "adv": "You spawn with a Frosty Hammer, which has a 4.5 block reach, the same as a sword. Every hit on an enemy has an 80% chance to give you a Frost Crystal. Crystals are spent on hammer upgrades, can be stored in your Personal Chest, and are all lost when you die.\nTier 1 costs 3 crystals (9 in total), Tier 2 costs 7 crystals (21 in total), and Tier 3 costs 15. The upgrades are Speed, Shield and Damage, and you can only pick one Tier 3 upgrade. Every time you upgrade, you are frozen in place for 2 seconds.\nShield is capped at 50. If you have not hit anyone for 2 seconds, it drops by 5 every 0.75 seconds.\nThe Tier 3 upgrade you pick gives you something special: Damage unlocks the Arctic Slam ability, Shield unlocks the Permafrost Shield ability, and Speed (cooldown) unlocks the Blizzard Storm passive.", "items": [{"name": "Frosty Hammer", "img": "images/items/frosty-hammer.png", "desc": "Your main weapon, with a 4.5 block reach, the same as a sword. Tier 0 deals 23 damage every 0.35 seconds. Each hit has an 80% chance to drop a Frost Crystal.", "cd": 0.35, "dmg": 23}, {"name": "Frost Crystal", "img": "images/items/frost-crystal.png", "desc": "Gained from hitting enemies (80% chance). Spend them on hammer upgrades or store them in your Personal Chest. You lose all of them when you die."}], "abilities": [{"name": "Open Hammer Upgrades", "note": "Only while holding the Hammer", "img": "images/abilities/ability-template.png", "desc": "Opens the hammer upgrade menu. Each upgrade freezes you in place for 2 seconds.\nTier 0: 23 damage every 0.35 seconds.\nTier 1 (3 crystals): 30 damage every 0.32 seconds, and 2 shield per attack.\nTier 2 (7 crystals): 40 damage every 0.28 seconds, and 3 shield per attack.\nTier 3 (15 crystals, pick one): 52 damage, or 4 shield per attack, or a 0.25 second cooldown. Each one unlocks its own ability or passive."}, {"name": "Permafrost Shield", "note": "Tier 3 Shield upgrade", "img": "images/abilities/ability-template.png", "desc": "Gain 30 shield for 6 seconds. The shield then explodes in a 7 block radius, dealing damage based on how much shield you have. The explosion has 100% armor penetration.", "cd": 25, "nodps": true}, {"name": "Arctic Slam", "note": "Tier 3 Damage upgrade", "img": "images/abilities/ability-template.png", "desc": "Hits 3 times over 2 seconds for 40, then 30, then 20 damage (90 in total). Each hit has 10% armor penetration. Reaches a 20 block radius, 9 blocks wide from end to end and 3 blocks tall. Damages and breaks blocks depending on their type, and launches enemies 2 blocks into the air.", "cd": 25, "dmg": 90, "nodps": true}], "passives": [{"name": "Frost Crystal Drops", "when": "On hitting an enemy", "desc": "80% chance to gain a Frost Crystal. Crystals are lost on death, but you can keep them safe in your Personal Chest."}, {"name": "Upgrade Freeze", "when": "When you upgrade", "desc": "You are frozen in place for 2 seconds every time you upgrade your hammer."}, {"name": "Shield Decay", "when": "2 seconds without hitting anyone", "desc": "Shield is capped at 50 and drops by 5 every 0.75 seconds."}, {"name": "Blizzard Storm", "when": "Tier 3 Speed upgrade", "desc": "After landing 4 hits in a row, an aura with a 6 block radius forms around you. It ticks every 0.525 seconds, starting at 3 damage and rising by 1 per tick up to a max of 8. The longer you keep hitting, the longer the aura lasts after you stop: every hit adds 1 extra tick."}], "strategy": [{"title": "Hit and run early", "text": "Your hammer has a slow cooldown at first, so use hit-and-run tactics to collect crystals safely. Save them up before upgrading your cooldown, then your damage."}, {"title": "Upgrade order", "text": "Always keep upgrading, and take Cooldown and Damage before Shield."}, {"title": "Best Tier 3 pick", "text": "Tier 3 Damage gives the best DPS. You can choose the others if you prefer them or want to play that specific style."}, {"title": "Arctic Slam on bridges", "text": "Use Arctic Slam when enemies are crossing bridges. It destroys the bridge and drops them into the void."}], "skins": [{"name": "Void Adetunde", "img": "images/skins/adetunde-void.webp"}, {"name": "Snow Owl Adetunde", "img": "images/skins/adetunde-snow-owl.webp"}]},
{"name": "Aery", "img": "images/kits/aery.webp", "cls": "Fighter", "tiers": {"casual": "S", "ranked": "B"}, "diff": "hard", "hp": "90", "desc": "Killing enemies adds to your collection of spirit butterflies. Each spirit butterfly amplifies sword and projectile damage. Aery's base health is reduced by 10%.", "adv": "Aery spawns with 90 HP. You gain 2 butterflies for every kill, and none for assists. Each butterfly is one stack, and stacks increase your projectile damage by 80% of the butterfly's value.\nThe bonus slows down as you collect more: each new stack adds less damage than the last, and eventually each butterfly adds less than 1 damage. After killing an enemy, you have to wait 25 seconds before you can gain stacks from that same enemy again.\nWhen you die you lose around 30% of your stacks, a little more or less depending on how many you have.", "items": [], "abilities": [], "calc": {"title": "Stack calculator", "label": "Butterfly stacks", "unitIn": "stacks", "unitOut": "damage", "a": 2.0104, "p": 0.7144, "max": 60, "start": 20, "note": "Bonus damage from butterfly stacks. The listed values are exact; other numbers use the formula damage = 2.0104 × stacks^0.7144.", "table": {"2": 3.3, "4": 5.41, "6": 7.23, "8": 8.88, "10": 10.42, "12": 11.87, "14": 13.25, "16": 14.57, "18": 15.85, "20": 17.09, "22": 18.3}}, "passives": [{"name": "Butterfly Stacks", "when": "On kill", "desc": "Gain 2 butterflies for every kill. Assists give none. Each butterfly is one stack."}, {"name": "Butterfly Damage", "when": "While you have stacks", "desc": "Increases your projectile damage by 80% of the butterfly's value. Each extra stack adds less than the last, eventually under 1 damage per butterfly."}, {"name": "Same-Enemy Cooldown", "when": "After a kill", "desc": "You cannot gain stacks from the same enemy again for 25 seconds."}, {"name": "Stack Loss", "when": "On death", "desc": "You lose around 30% of your stacks, a little more or less depending on how many you have."}], "strategy": [{"title": "Get support early", "text": "Aery needs help early in the game to build up stacks. Around 20 stacks is the sweet spot."}, {"title": "Don't ego fights", "text": "Losing stacks hurts, so avoid fights you don't need to take."}, {"title": "Go ranged at 20 stacks", "text": "Once you reach 20 stacks, switch to ranged weapons so you don't risk losing all your stacks late in the game."}], "skins": [{"name": "Academy Aery", "img": "images/skins/aery-academy.webp"}, {"name": "Heartseeker Aery", "img": "images/skins/aery-heartseeker.webp"}]},
{"name": "Agni", "img": "images/kits/agni.webp", "cls": "Fighter", "tiers": {"casual": "B", "ranked": "C"}, "diff": "easy", "hp": "100", "desc": "Throw cluster bombs at your enemies and watch them go flying! Blast off with your Rocket Boost ability.", "adv": "Agni's kit is built around fire and explosives. Fire deals 3 damage per tick for 3 ticks, 9 damage in total.\nRocket Boost launches you into the air and burns enemies it hits. Cluster Bombs are thrown at enemies and burst into smaller fire bombs that spread out and explode. Throwing a Cluster Bomb takes 2 seconds from start to finish.", "items": [{"name": "Cluster Bomb", "img": "images/items/cluster-bomb.png", "note": "Cost: 45 iron", "desc": "You get a new Cluster Bomb every 35 seconds, holding up to 5, or you can buy one in the shop. The bomb deals 16-17 damage and applies Fire. It then drops 8 smaller fire bombs in a 25 block radius. Each one explodes in a 3x3 area, dealing 9 damage and applying Fire. Throwing it takes 2 seconds in total.", "cd": 35, "dmg": 16.5, "dmgText": "16-17", "nodps": true}], "abilities": [{"name": "Rocket Boost", "img": "images/abilities/ability-template.png", "desc": "Launches you up to 7 blocks into the air. Deals 12 damage to enemies and applies Fire (3 damage per tick, 3 ticks).", "cd": 13, "dmg": 12, "nodps": true}], "skins": [{"name": "Spirit Agni", "img": "images/skins/agni-spirit.webp"}], "strategy": [{"title": "Save your iron", "text": "Don't waste early-game iron on Cluster Bombs. Only buy them when you have plenty of iron left over."}, {"title": "When to throw them", "text": "Use Cluster Bombs in group fights, and always use one when you have to fight someone one-on-one."}, {"title": "Rocket Boost tricks", "text": "Use Rocket Boost to save yourself from fall damage, or to deal extra damage to your enemy."}]},
{"name": "Alchemist", "img": "images/kits/alchemist.webp", "cls": "Support", "tiers": {"casual": "S", "ranked": "S"}, "diff": "extreme", "hp": "100", "desc": "Use flasks to brew various potions with foraged ingredients.", "adv": "Thorns, Mushrooms and Flowers spawn frequently around the map. You can pick up all of them, and drop them or store them in a chest. The same goes for the potions you make, but not the flasks.\nYou can buy Alchemist Flasks in the shop for 10 iron, with a max of 16. While holding a flask, add Thorns, Mushrooms and Flowers to brew a special potion:\n3 Mushrooms: Sleep Splash Potion\n3 Flowers: Heal Splash Potion\n1 Thorn + 2 Mushrooms: Poison Splash Potion\n2 Thorns + 1 Flower: Big Shield", "items": [{"name": "Alchemist Flask", "img": "images/items/alchemist-flask.png", "note": "Cost: 10 iron", "desc": "Buy up to 16 in the shop. While holding it, add Thorns, Mushrooms and Flowers to brew special potions. Flasks cannot be stored in a chest."}, {"name": "Mushroom", "img": "images/items/mushroom.png", "desc": "Spawns frequently around the map. Used for Sleep and Poison potions. Can be picked up, dropped and stored in a chest."}, {"name": "Thorn", "img": "images/items/thorn.png", "desc": "Spawns frequently around the map. Used for Poison potions and Big Shields. Can be picked up, dropped and stored in a chest."}, {"name": "Flower", "img": "images/items/flower.png", "desc": "Spawns frequently around the map. Used for Heal potions and Big Shields. Can be picked up, dropped and stored in a chest."}, {"name": "Sleep Splash Potion", "img": "images/items/sleep-splash-potion.png", "note": "Recipe: 3 Mushrooms", "desc": "Stuns anyone hit, including you, for 2 seconds in a 3x3 block radius."}, {"name": "Heal Splash Potion", "img": "images/items/heal-potion.png", "note": "Recipe: 3 Flowers", "desc": "Heals 30 HP in a 5x5 block radius."}, {"name": "Poison Splash Potion", "img": "images/items/poison-potion.png", "note": "Recipe: 1 Thorn + 2 Mushrooms", "desc": "Deals 6 damage per tick for 10 ticks, with 80% armor penetration. Poison cannot kill: it leaves enemies on 1 HP at minimum.", "cd": 0.525, "dmg": 6}, {"name": "Big Shield", "img": "images/items/big-shield.png", "note": "Recipe: 2 Thorns + 1 Flower", "desc": "Gives you 30 shield."}], "abilities": [{"name": "Add Thorns", "note": "Only while holding the Flask", "img": "images/abilities/ability-template.png", "desc": "Adds a Thorn to the flask. Used in the Poison Splash Potion (1 Thorn) and Big Shield (2 Thorns) recipes."}, {"name": "Add Mushroom", "note": "Only while holding the Flask", "img": "images/abilities/ability-template.png", "desc": "Adds a Mushroom to the flask. Used in the Sleep Splash Potion (3 Mushrooms) and Poison Splash Potion (2 Mushrooms) recipes."}, {"name": "Add Flowers", "note": "Only while holding the Flask", "img": "images/abilities/ability-template.png", "desc": "Adds a Flower to the flask. Used in the Heal Splash Potion (3 Flowers) and Big Shield (1 Flower) recipes."}], "passives": [{"name": "Foraging", "when": "Always", "desc": "Thorns, Mushrooms and Flowers spawn frequently around the map. You can pick up, drop and store them in a chest."}], "strategy": [{"title": "Craft for your playstyle", "text": "Choose which potions to craft depending on how you play."}, {"title": "Solo and offensive play", "text": "Mainly craft Heal and Sleep potions, so you can stunlock enemies and keep yourself healthy."}, {"title": "Supporting your team", "text": "Craft Big Shields and Heal potions for your teammates, and Sleep and Poison potions for yourself to help in fights."}, {"title": "Always be prepared", "text": "Use a Shield potion before every fight, and have a Poison potion ready to throw. Prioritize keeping 1 Poison potion and 1 Shield potion on hand, and always keep crafting Heal potions and Shields."}], "skins": []},
{"name": "Arachne", "img": "images/kits/arachne.webp", "cls": "Movement", "tiers": {"casual": "B", "ranked": "C"}, "diff": "easy", "hp": "100", "desc": "The Spider Queen uses web bridges to traverse the map and can summon spiderlings from her webs to attack enemies. Enemies are slowed if they run into her webs.", "adv": "Arachne shoots webs that slow enemies down and double as a bridge only you and your Arachne teammates can use. Enemies who touch cobwebs are slowed by a lot, and the more cobwebs they touch, the slower they get.\nYou can summon spiders while you have webs placed. You get 1 to 4 spiders depending on how many cobwebs are up, so 1 cobweb gives 1 spider and 4 or more cobwebs give 4. Each spider spawns with 30 HP and deals 4 damage every 0.5 seconds. When a spider kills or assists on an enemy, its damage and HP go up, to a max of 80 HP and 15 damage.", "items": [], "abilities": [{"name": "Aim Web Bridge", "img": "images/abilities/ability-template.png", "desc": "Shoots a web in any direction with a 17 block line radius. Enemies who touch the cobwebs are slowed by a lot, and the slow builds up the more cobwebs they touch. You can jump onto the cobwebs and use them as a bridge, but only you and other Arachne teammates can use it.", "cd": 8}, {"name": "Spider Summon", "note": "Only while webs are present", "img": "images/abilities/ability-template.png", "desc": "Summons 1 to 4 spiders from your webs, depending on how many cobwebs are up (1 cobweb = 1 spider, 4 or more = 4). Each spider spawns with 30 HP and deals 4 damage every 0.5 seconds. A spider that kills or assists on an enemy gains damage and HP, up to 80 HP and 15 damage.", "cd": 10, "dmg": 4, "dmgText": "4 per hit (every 0.5s)", "nodps": true}], "passives": [{"name": "Sticky Webs", "when": "When enemies touch cobwebs", "desc": "Enemies are slowed by a lot, and the slow gets stronger the more cobwebs they touch."}, {"name": "Spider Growth", "when": "When a spider kills or assists", "desc": "The spider's damage and HP increase, up to a max of 80 HP and 15 damage. Spiders spawn with 30 HP and 4 damage."}], "strategy": [{"title": "Move fast and save iron", "text": "Use Arachne for movement, and save a ton of iron you would normally spend on blocks."}, {"title": "Grab loot first", "text": "On most maps you can use the ability right away and get to the middle for loot before anyone else, depending on the mode."}, {"title": "Slow your enemies", "text": "The webs slow enemies down a lot, which gives you a big advantage in PvP."}, {"title": "Let spiders tank", "text": "Use your spiders to soak up damage while you fight."}], "skins": []},

function tierOf(k,m){ return (k.tiers && k.tiers[m||S.mode]) || ""; }
function allTiers(){
  var extra = [];
  KITS.forEach(function(k){ MODES.forEach(function(m){ var t = tierOf(k,m.id); if(t && TIERS.indexOf(t)<0 && extra.indexOf(t)<0) extra.push(t); }); });
  return TIERS.concat(extra);
}

             : '<div class="fp"><div class="th"><span class="ph">?</span></div>'+esc(on)+'</div>';
  return '<div class="fus"><div class="fpair">'+me+'<span class="plus">+</span>'+ot+'</div>'+(f.note?'<p>'+esc(f.note)+'</p>':'')+'</div>';
}
function costHtml(n){
  var m = /^Cost:\s*(\d+)\s*(iron|emeralds?)\s*$/i.exec(n);
  if(!m) return '<div class="cond">'+esc(n)+'</div>';
  var cur = m[2].toLowerCase().charAt(0)==='e' ? 'emerald' : 'iron';
  return '<div class="cost '+cur+'"><img src="images/currency/'+cur+'.png" alt=""><b>Cost: '+m[1]+' '+(cur==='emerald'?(m[1]==='1'?'emerald':'emeralds'):'iron')+'</b></div>';
}
function calcVal(c,n){
  if(!(n>0)) return {v:0,exact:true};
  var key=String(n); if(c.table&&c.table[key]!=null) return {v:c.table[key],exact:true};
  return {v:c.a*Math.pow(n,c.p),exact:false};
}
function calcBox(c){
  var tb=Object.keys(c.table||{}).sort(function(x,y){return x-y;}).map(function(s){return '<span>'+s+' '+esc(c.unitIn)+' <b>+'+c.table[s].toFixed(2)+'</b></span>';}).join('');
  return '<div class="pbox calc"><h3>'+esc(c.title)+'</h3><label>'+esc(c.label)+' <input type="number" min="0" max="'+(c.max||200)+'" step="1" value="'+(c.start||20)+'" data-calc="1" inputmode="numeric"></label><span class="cres" id="calcres"></span><span class="cnote" id="calcnote"></span>'+
    '<p class="muted" style="margin:10px 0 0">'+esc(c.note)+'</p><div class="ctable">'+tb+'</div></div>';
}
function calcUpdate(){
  var k=S.sel, c=k&&k.calc, el=document.querySelector('[data-calc]'); if(!c||!el) return;
  var n=Math.max(0,Math.min(c.max||200,Math.floor(Number(el.value)||0))), r=calcVal(c,n);
  var res=$("calcres"), nt=$("calcnote"); if(!res) return;
  res.textContent='+'+r.v.toFixed(2)+' '+c.unitOut; nt.textContent=n===0?'':(r.exact?'':'estimated from the formula');
}
document.addEventListener('input',function(e){ if(e.target&&e.target.matches&&e.target.matches('[data-calc]')) calcUpdate(); });
function abCard(a,label){
  var v = a.nodps ? null : dps(a);
  return '<div class="ab"><div class="aico">'+pic(a,a.name)+'</div><div><span class="nm">'+esc(a.name)+'</span>'+(a.note?costHtml(a.note):'')+(a.desc?'<p style="margin:6px 0 0;white-space:pre-line">'+esc(a.desc)+'</p>':'')+(a.cd==null&&a.dmg==null?'':'<div class="nums">'+
    '<span>Cooldown <b>'+(a.cd==null?'—':a.cd>0?a.cd+'s':'None')+'</b></span><span>Damage <b>'+(a.dmg==null?'—':a.dmgText?a.dmgText:a.dmg>0?a.dmg+((a.hits||1)>1?' × '+a.hits:''):'None')+'</b></span>'+(v===null?'':'<span>DPS <b>'+v.toFixed(1)+'</b></span>')+'</div>')+'</div></div>';
}
function renderDetail(){
  var k = S.sel, d = $("detail");
  if(!k){ d.hidden = true; return; }
  d.hidden = false;
  var abs = k.abilities||[], its = k.items||[], total = 0, any = false;
  abs.concat(its).forEach(function(a){ var v = dps(a); if(v!==null){ total += v; any = true; } });
  var sk = k.skins||[], cur = S.skin>=0 ? sk[S.skin] : null;
  var wi = WARDROBE_IMG ? '<img src="'+esc(WARDROBE_IMG)+'" alt="">' : '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M8 3 2 6.5l2.5 4L7 9.5V21h10V9.5l2.5 1 2.5-4L16 3c-.5 1.7-2 3-4 3S8.5 4.7 8 3z"/></svg>';
  var h = '<div class="dgrid"><div class="dleft"><div class="picwrap skwrap"><div class="pic">'+pic(cur&&cur.img ? cur : k,k.name)+'</div>';
  if(sk.length){
    h += '<button class="wbtn'+(S.skins?' on':'')+'" data-act="skins" aria-expanded="'+S.skins+'" aria-label="Skins ('+sk.length+')">'+wi+'<i>'+sk.length+'</i></button>';
    if(S.skins) h += '<div class="skpanel"><div class="t">Skins</div><div class="skgrid"><button class="sk'+(S.skin<0?' on':'')+'" data-skin="-1" title="Default"><div class="th">'+pic(k,k.name)+'</div><span class="lb">Default</span></button>'+
      sk.map(function(s,i){return '<button class="sk'+(S.skin===i?' on':'')+'" data-skin="'+i+'" title="'+esc(s.name)+'"><div class="th">'+pic(s,s.name||k.name)+'</div><span class="lb">'+esc(s.name)+'</span></button>';}).join("")+'</div></div>';
  }
  h += '</div><div class="cap">'+esc(cur ? cur.name : "Default")+'</div>';
  h += '<div class="stats">'+
    '<div class="stat"><span>HP</span><b>'+(k.hp?esc(k.hp):'—')+'</b></div>'+
    '<div class="stat"><span>Class</span>'+(k.cls?'<button class="cbtn" data-cls="'+esc(k.cls)+'">'+cico(k.cls)+esc(k.cls)+'</button>':'<b>—</b>')+'</div>'+
    '<div class="stat wide"><span>Tier</span><div class="tpair">'+MODES.map(function(m){var t=tierOf(k,m.id);return '<button class="tbtn'+(S.mode===m.id?' on':'')+'" data-mode="'+m.id+'"'+(t?' data-tier="'+esc(t)+'"':'')+'><small>'+esc(m.label)+' · '+esc(m.sub)+'</small><b>'+(t?esc(t):'—')+'</b></button>';}).join('')+'</div></div>'+
    (k.diff ? '<div class="stat"><span>Difficulty</span><b>'+dm(k.diff)+DN[k.diff]+'</b></div>' : '')+'</div>'+
    '</div><div><div class="row"><h2>'+esc(k.name)+'</h2><button class="btn" data-act="close">Back to all kits</button></div>';
  h += '<div class="tabs">'+[["info","Overview"],["abil","Abilities and items"],["fus","Best fusions"]].map(function(t){
    return '<button class="tab'+(S.tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>';
  if(S.tab==="info"){
    h += '<p>'+esc(k.desc)+'</p>'+(k.adv?'<h3>Advanced description</h3><p style="white-space:pre-line">'+esc(k.adv)+'</p>':'');
    var ps = k.passives||[], st = k.strategy||[];
    if(k.calc) h += calcBox(k.calc);
    if(ps.length) h += '<div class="pbox"><h3>Passives</h3>'+ps.map(function(p){
      return '<div class="pitem"><span class="nm">'+esc(p.name)+'</span>'+(p.when?'<span class="when">'+esc(p.when)+'</span>':'')+'<p style="margin:4px 0 0">'+esc(p.desc)+'</p></div>';}).join("")+'</div>';
    if(st.length) h += '<div class="pbox"><h3>Strategy</h3>'+st.map(function(x){
      return '<div class="pitem"><span class="nm">'+esc(x.title)+'</span><p style="margin:4px 0 0">'+esc(x.text)+'</p></div>';}).join("")+'</div>';
  }else if(S.tab==="abil"){
    var all = abs.map(function(a,i){return {a:a,key:"a"+i,label:"Special Ability #"+(i+1)};}).concat(its.map(function(a,i){return {a:a,key:"i"+i,label:"Special Item #"+(i+1)};}));
    if(!all.length) h += '<p class="muted">No special abilities or items listed for this kit yet.</p>';
    else{
      var pick = all.filter(function(x){return x.key===S.pick;})[0] || all[0];
      var mk = function(title,pre,list,top){
        return list.length ? '<h3 style="margin:'+top+'px 0 10px">'+title+'</h3><div class="dock">'+list.map(function(a,i){
          var key = pre+i;
          return '<button class="slot'+(pick.key===key?' on':'')+'" data-pick="'+key+'"><div class="aico">'+pic(a,a.name)+'</div><span>'+esc(a.name)+'</span></button>';
        }).join("")+'</div>' : '';
      };
      h += mk("Special abilities","a",abs,0)+mk("Special items","i",its,abs.length?22:0)+'<div class="adet" style="margin-top:20px">'+abCard(pick.a,pick.label)+'</div>'+
        (any ? '<p class="muted" style="margin-top:16px">DPS = damage × hits ÷ cooldown.</p>' : '');
    }
  }else{
    var f = FUSIONS.filter(function(x){return x.a===k.name||x.b===k.name;});
    h += f.length ? f.map(function(x){return fusCard(k,x);}).join("") : '<p class="muted">No fusions listed for this kit yet.</p>';
  }
  d.innerHTML = h + '</div></div>';
  calcUpdate();
}
var lastSel = null;
function apply(){
  var h = ""; try{ h = decodeURIComponent(location.hash.slice(1)); }catch(e){}
  S.sel = KITS.filter(function(k){return slug(k.name)===h;})[0] || null;
  if(S.sel !== lastSel){ S.tab = "info"; S.skins = false; S.skin = -1; S.pick = ""; lastSel = S.sel; }
  renderDetail();
  if(S.sel) $("detail").scrollIntoView({block:"start"});
}
function go(s){ if(location.hash.slice(1)===s) apply(); else location.hash = s; }

var strip = $("strip"), down = false, sx = 0, sl = 0, moved = false;
strip.addEventListener("pointerdown",function(e){ if(e.pointerType!=="mouse") return; down = true; moved = false; sx = e.clientX; sl = strip.scrollLeft; });
window.addEventListener("pointermove",function(e){ if(!down) return; var d = e.clientX - sx; if(Math.abs(d)>4) moved = true; strip.scrollLeft = sl - d; });
window.addEventListener("pointerup",function(){ down = false; setTimeout(function(){ moved = false; },0); });

$("q").oninput = function(){ S.q = this.value; renderList(); };
$("q").onkeydown = function(e){
  if(e.key==="Enter"){ var q = S.q.trim().toLowerCase(), m = matches(); var ex = m.filter(function(k){return k.name.toLowerCase()===q;})[0]; if(ex||m[0]) go(slug((ex||m[0]).name)); }
  if(e.key==="Escape"){ this.value = ""; S.q = ""; renderList(); }
};
document.addEventListener("click",function(e){
  var t = e.target.closest("[data-kit],[data-mode],[data-cls],[data-tier],[data-tab],[data-skin],[data-pick],[data-act]");
  if(moved) return;
  var inSk = !!e.target.closest(".skwrap"), ds = t ? t.dataset : null, inDetail = !!(t && t.closest("#detail"));
  if(S.skins && !inSk){ S.skins = false; renderDetail(); }
  if(!t) return;
  if("mode" in ds){
    S.mode = ds.mode; try{ localStorage.setItem("bwMode",S.mode); }catch(x){}
    if(inDetail && ds.tier){ S.tier = ds.tier; renderList(); history.replaceState(null,"",location.pathname+location.search); apply(); $("browse").scrollIntoView({block:"start"}); }
    else{ renderList(); renderDetail(); }
  }
  else if("kit" in ds){ go(ds.kit); }
  else if("cls" in ds || "tier" in ds){
    var key = "cls" in ds ? "cls" : "tier";
    S[key] = (S[key]===ds[key]) ? "" : ds[key];
    renderList();
    if(inDetail){ history.replaceState(null,"",location.pathname+location.search); apply(); $("browse").scrollIntoView({block:"start"}); }
  }
  else if("pick" in ds){ S.pick = ds.pick; renderDetail(); }
  else if("tab" in ds){ S.tab = ds.tab; renderDetail(); }
  else if("skin" in ds){ S.skin = +ds.skin; S.skins = false; renderDetail(); }
  else if(ds.act==="skins"){ S.skins = !S.skins; renderDetail(); }
  else if(ds.act==="close"){ history.replaceState(null,"",location.pathname+location.search); apply(); window.scrollTo(0,0); }
});
window.addEventListener("keydown",function(e){ if(e.key==="Escape" && S.skins){ S.skins = false; renderDetail(); } });
window.addEventListener("hashchange",apply);
try{ var sm = localStorage.getItem("bwMode"); if(MODES.some(function(m){return m.id===sm;})) S.mode = sm; }catch(x){}
renderList(); apply();
</script>
</body>
</html>
