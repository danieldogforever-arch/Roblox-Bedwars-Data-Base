  if(has("jack-of-all-trades")){ tot*=77.6/63; per=tot/n; exact=exact&&key==="over2-0"&&!has("volley")&&!has("explosive")&&!has("critical-strike")&&!has("moonlit"); notes.push("Jack of All Trades copies 20% versions of damage, crit, healing, knockback and explosion cards you don't own"); }
  var lo=tot,hi=tot;
  if(has("critical-strike")){ exact=false; lo=tot; hi=tot*1.4; tot*=1.1625; per=tot/n; notes.push("Crits: about "+hi.toFixed(1)+" if every card crits for the max"); }
  if(has("moonlit")){ exact=false; notes.push("Moonlit: "+(tot*0.9).toFixed(1)+" to "+(tot*1.2).toFixed(1)+" as it ramps up, with up to 20% armor penetration"); }
  var cd=has("quick-draw-2")?8:has("quick-draw-1")?10:12, ex=[];
  if(has("explosive")) ex.push("+10 explosion");
  if(has("scorched")) ex.push("+15 burn over 3s");
  if(has("poisonous")) ex.push("+6 poison over 3s");
  if(has("electrifying-2")) ex.push("14.4 chain damage to up to 3 nearby enemies + Zapped 2"); else if(has("electrifying-1")) ex.push("8 chain damage to up to 3 nearby enemies + Zapped 1");
  if(has("energy-drain")) ex.push("heal "+Math.min(tot*0.25,{mini:4,std:6,over:8}[size]).toFixed(1)+" per throw");
  if(has("sticky-cards")) ex.push("grounds for 3s");
  if(has("decay")) ex.push("Decay for 10s");
  if(has("aerodynamic")) ex.push("knockback");
  return {n:n,per:per,tot:tot,cd:cd,exact:exact,ex:ex,notes:notes};
}
function deckUpdate(){
  var box=document.querySelector('.deck'); if(!box) return;
  document.querySelectorAll('[data-deck]').forEach(function(el){ var i=+el.getAttribute('data-deck'); el.value=DSEL[i]; el.disabled=i>0&&!DSEL[i-1]; Array.prototype.forEach.call(el.options,function(o){ if(o.value) o.disabled=!deckOk(o.value,i,DSEL); }); });
  var sel=DSEL.slice(), r=deckCalc(sel.filter(Boolean));
  $("dicons").innerHTML=sel.filter(Boolean).map(function(id){return '<img src="images/items/fortuna-'+id+'.png" alt="'+esc(DK[id][1])+'" title="'+esc(DK[id][1])+'">';}).join('');
  $("dres").innerHTML='<div class="nums"><span>Cards thrown <b>'+r.n+'</b></span><span>Damage each <b>'+(Math.round(r.per*100)/100)+'</b></span><span>Total <b>'+r.tot.toFixed(1)+'</b></span><span>Cooldown <b>'+r.cd+'s</b></span></div>'+
    (r.ex.length?'<p style="margin:8px 0 0">Final card: '+esc(r.ex.join(", "))+'</p>':'')+
    r.notes.map(function(x){return '<p class="muted" style="margin:6px 0 0">'+esc(x)+'</p>';}).join('')+
    '<p class="muted" style="margin:8px 0 0">'+(r.exact?'Tested damage.':'Estimated from tests. Some card combos stack in odd ways, so this can be off.')+'</p>';
}
document.addEventListener('change',function(e){
  var t=e.target; if(!t||!t.matches||!t.matches('[data-deck]')) return;
  var di=+t.getAttribute('data-deck'); DSEL[di]=t.value; if(!t.value){ for(var q=di+1;q<5;q++) DSEL[q]=""; }
  for(var i=0;i<5;i++){ if(DSEL[i]&&!deckOk(DSEL[i],i,DSEL)) DSEL[i]=""; }
  deckUpdate();
});

function tableHtml(tb){
  return '<div class="pbox"><h3>'+esc(tb.title)+'</h3><div class="twrap"><table class="ptable"><thead><tr>'+tb.head.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+'</tr></thead><tbody>'+
    tb.rows.map(function(r){return '<tr>'+r.map(function(c){var m=/^img:([^|]+)\|(.*)$/.exec(c); return m?'<td class="l"><img class="ticon'+(m[1].indexOf("classes/")>=0?' inv':'')+'" src="'+esc(m[1])+'" alt="">'+esc(m[2])+'</td>':'<td'+(c.length>22?' class="l"':'')+'>'+esc(c)+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div>'+
    (tb.note?'<p class="muted" style="margin:10px 0 0;white-space:pre-line">'+esc(tb.note)+'</p>':'')+'</div>';
}
function abCard(a,label){
  var v = a.nodps ? null : dps(a);
  return '<div class="ab"><div class="aico">'+pic(a,a.name)+'</div><div>'+(a.note&&!/^Cost:/i.test(a.note)?'<div class="abhead"><span class="nm">'+esc(a.name)+'</span>'+costHtml(a.note)+'</div>':'<span class="nm">'+esc(a.name)+'</span>'+(a.note?costHtml(a.note):''))+(a.desc?'<p style="margin:6px 0 0;white-space:pre-line">'+esc(a.desc)+'</p>':'')+(a.cd==null&&a.dmg==null?'':'<div class="nums">'+
    (a.cd==null&&!a.cdText?'':'<span>Cooldown <b>'+(a.cdText?a.cdText:a.cd>0?a.cd+'s':'None')+'</b></span>')+(a.dmg==null?'':'<span>Damage <b>'+(a.dmgText?a.dmgText:a.dmg>0?a.dmg+((a.hits||1)>1?' × '+a.hits:''):'None')+'</b></span>')+(a.dpsText?'<span>DPS <b>'+esc(a.dpsText)+'</b></span>':v===null?'':'<span>DPS <b>'+v.toFixed(1)+'</b></span>')+'</div>')+'</div></div>';
}
function renderDetail(){
  var k = S.sel, d = $("detail");
  if(!k){ d.hidden = true; return; }
  d.hidden = false;
  var abs = k.abilities||[], its = k.items||[], total = 0, any = false;
  abs.concat(its).forEach(function(a){ var v = dps(a); if(v!==null){ total += v; any = true; } });
  var sk = k.skins||[], cur = S.skin>=0 ? sk[S.skin] : null;
  var wi = WARDROBE_IMG ? '<img src="'+esc(WARDROBE_IMG)+'" alt="">' : '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M8 3 2 6.5l2.5 4L7 9.5V21h10V9.5l2.5 1 2.5-4L16 3c-.5 1.7-2 3-4 3S8.5 4.7 8 3z"/></svg>';
  var h = '<div class="dgrid"><div class="dleft"><div class="picwrap skwrap"><div class="pic">'+pic(cur&&cur.img ? cur : k,k.name)+'</div>';
  if(sk.length){
    h += '<button class="wbtn'+(S.skins?' on':'')+'" data-act="skins" aria-expanded="'+S.skins+'" aria-label="Skins ('+sk.length+')">'+wi+'<i>'+sk.length+'</i></button>';
    if(S.skins) h += '<div class="skpanel"><div class="t">Skins</div><div class="skgrid"><button class="sk'+(S.skin<0?' on':'')+'" data-skin="-1" title="Default"><div class="th">'+pic(k,k.name)+'</div><span class="lb">Default</span></button>'+
      sk.map(function(s,i){return '<button class="sk'+(S.skin===i?' on':'')+'" data-skin="'+i+'" title="'+esc(s.name)+'"><div class="th">'+pic(s,s.name||k.name)+'</div><span class="lb">'+esc(s.name)+'</span></button>';}).join("")+'</div></div>';
  }
  h += '</div><div class="cap">'+esc(cur ? cur.name : "Default")+'</div>';
  h += '<div class="stats">'+
    '<div class="stat"><span>HP</span><b>'+(k.hp?esc(k.hp):'—')+'</b></div>'+
    '<div class="stat"><span>Class</span>'+(k.cls?'<button class="cbtn" data-cls="'+esc(k.cls)+'">'+cico(k.cls)+esc(k.cls)+'</button>':'<b>—</b>')+'</div>'+
    '<div class="stat wide"><span>Tier</span><div class="tpair">'+MODES.map(function(m){var t=tierOf(k,m.id);return '<button class="tbtn'+(S.mode===m.id?' on':'')+'" data-mode="'+m.id+'"'+(t?' data-tier="'+esc(t)+'"':'')+'><small>'+esc(m.label)+' · '+esc(m.sub)+'</small><b>'+(t?esc(t):'—')+'</b></button>';}).join('')+'</div></div>'+
    '<div class="stat wide"><span>Balance</span>'+balBadge(k)+'</div>'+
    (k.diff ? '<div class="stat"><span>Difficulty</span><b>'+dm(k.diff)+DN[k.diff]+'</b></div>' : '')+obtainHtml(k)+'</div>'+
    '</div><div><div class="row"><h2>'+esc(k.name)+'</h2><button class="btn" data-act="close">Back to all kits</button></div>';
  h += '<div class="tabs">'+[["info","Overview"],["abil","Abilities and items"],["fus","Best fusions"],["hist","Balance History"]].map(function(t){
    return '<button class="tab'+(S.tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>';
  if(S.tab==="info"){
    h += '<p>'+esc(k.desc)+'</p>'+(k.adv?'<h3>Advanced description</h3><p style="white-space:pre-line">'+esc(k.adv)+'</p>':'');
    var ps = k.passives||[], st = k.strategy||[];
    if((k.notes||[]).length) h += '<div class="pbox knote"><h3>Note</h3>'+k.notes.map(function(x){return '<p style="margin:4px 0 0">'+esc(x)+'</p>';}).join("")+'</div>';
    (k.tables||[]).forEach(function(tb){ h += tableHtml(tb); });
    if(k.calc) h += calcBox(k.calc);
    if(k.deck) h += deckBox();
    if(ps.length) h += '<div class="pbox"><h3>Passives</h3>'+ps.map(function(p){
      return '<div class="pitem"><span class="nm">'+esc(p.name)+'</span>'+(p.when?'<span class="when">'+esc(p.when)+'</span>':'')+'<p style="margin:4px 0 0">'+esc(p.desc)+'</p></div>';}).join("")+'</div>';
    var cn = k.counter||[];
    if(st.length) h += '<div class="pbox"><h3>Strategy</h3>'+st.map(function(x){
      return '<div class="pitem"><span class="nm">'+esc(x.title)+'</span><p style="margin:4px 0 0">'+esc(x.text)+'</p></div>';}).join("")+'</div>';
    if(cn.length) h += '<div class="pbox"><h3>Counterplay</h3>'+cn.map(function(x){
      return '<div class="pitem"><span class="nm">'+esc(x.title)+'</span><p style="margin:4px 0 0">'+esc(x.text)+'</p></div>';}).join("")+'</div>';
  }else if(S.tab==="abil"){
    var all = abs.map(function(a,i){return {a:a,key:"a"+i,label:"Special Ability #"+(i+1)};}).concat(its.map(function(a,i){return {a:a,key:"i"+i,label:"Special Item #"+(i+1)};}));
    if(!all.length) h += '<p class="muted">No special abilities or items listed for this kit yet.</p>';
    else{
      var pick = all.filter(function(x){return x.key===S.pick;})[0] || all[0];
      var mk = function(title,pre,list,top){
        return list.length ? '<h3 style="margin:'+top+'px 0 10px">'+title+'</h3><div class="dock">'+list.map(function(a,i){
          var key = pre+i;
          return '<button class="slot'+(pick.key===key?' on':'')+'" data-pick="'+key+'"><div class="aico">'+pic(a,a.name)+'</div><span>'+esc(a.name)+'</span></button>';
        }).join("")+'</div>' : '';
      };
      h += mk("Special abilities","a",abs,0)+mk("Special items","i",its,abs.length?22:0)+'<div class="adet" style="margin-top:20px">'+abCard(pick.a,pick.label)+'</div>'+
        (any ? '<p class="muted" style="margin-top:16px">DPS = damage × hits ÷ cooldown.</p>' : '');
    }
  }else if(S.tab==="hist"){
    h += histHtml(k);
  }else{
    var f = FUSIONS.filter(function(x){return x.a===k.name||x.b===k.name;});
    h += f.length ? f.map(function(x){return fusCard(k,x);}).join("") : '<p class="muted">No fusions listed for this kit yet.</p>';
  }
  d.innerHTML = h + '</div></div>';
  collapseBoxes(d);
  calcUpdate();
  deckUpdate();
}
var OPENBOX = {};
try{ OPENBOX = JSON.parse(sessionStorage.getItem("km-open")||"{}"); }catch(e){}
function collapseBoxes(root){
  var boxes = Array.prototype.filter.call(root.querySelectorAll('.pbox'),function(b){ return !b.classList.contains('knote') && b.querySelector(':scope > h3'); });
  if(!boxes.length) return;
  boxes.forEach(function(b){
    var h = b.querySelector(':scope > h3'), det = document.createElement('details'), sum = document.createElement('summary');
    det.className = b.className; sum.appendChild(h); det.appendChild(sum);
    while(b.firstChild) det.appendChild(b.firstChild);
    var key = h.textContent.trim(); det.open = !!OPENBOX[key];
    det.addEventListener('toggle',function(){ OPENBOX[key] = det.open; try{ sessionStorage.setItem("km-open",JSON.stringify(OPENBOX)); }catch(e){} });
    b.parentNode.replaceChild(det,b);
  });
  if(boxes.length>1){
    var first = root.querySelector('details.pbox'), c = document.createElement('div'); c.className = 'pctrl';
    c.innerHTML = '<button type="button" data-boxes="open">Open all</button><button type="button" data-boxes="close">Close all</button>';
    c.addEventListener('click',function(e){ var b = e.target.closest('[data-boxes]'); if(!b) return; var on = b.getAttribute('data-boxes')==='open';
      root.querySelectorAll('details.pbox').forEach(function(x){ x.open = on; }); });
    first.parentNode.insertBefore(c,first);
  }
}
var lastSel = null;
function apply(){
  var h = ""; try{ h = decodeURIComponent(location.hash.slice(1)); }catch(e){}
  S.sel = KITS.filter(function(k){return slug(k.name)===h;})[0] || null;
  if(S.sel !== lastSel){ S.tab = "info"; S.skins = false; S.skin = -1; S.pick = ""; lastSel = S.sel; }
  renderDetail();
  $("browse").hidden = !!S.sel;
  if(S.sel) window.scrollTo(0,0);
}
function go(s){ if(location.hash.slice(1)===s) apply(); else location.hash = s; }

var strip = $("strip"), down = false, sx = 0, sl = 0, moved = false;
strip.addEventListener("pointerdown",function(e){ if(e.pointerType!=="mouse") return; down = true; moved = false; sx = e.clientX; sl = strip.scrollLeft; });
window.addEventListener("pointermove",function(e){ if(!down) return; var d = e.clientX - sx; if(Math.abs(d)>4) moved = true; strip.scrollLeft = sl - d; });
window.addEventListener("pointerup",function(){ down = false; setTimeout(function(){ moved = false; },0); });

$("q").oninput = function(){ S.q = this.value; renderList(); };
$("q").onkeydown = function(e){
  if(e.key==="Enter"){ var q = S.q.trim().toLowerCase(), m = matches(); var ex = m.filter(function(k){return k.name.toLowerCase()===q;})[0]; if(ex||m[0]) go(slug((ex||m[0]).name)); }
  if(e.key==="Escape"){ this.value = ""; S.q = ""; renderList(); }
};

function placeTip(w){
  var tip = w && w.querySelector(".baltip"), bd = w && w.querySelector(".bal"); if(!tip||!bd) return;
  var r = bd.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  var W = Math.min(330, vw-24), h = tip.offsetHeight;
  var left = Math.max(12, Math.min(r.left, vw-W-12));
  var top = r.bottom + 10;
  if(top + h > vh - 12){ var up = r.top - 10 - h; top = up >= 12 ? up : Math.max(12, vh - 12 - h); }
  tip.style.left = left+"px"; tip.style.top = top+"px";
}
function placeOpenTip(){ placeTip(document.querySelector(".balwrap:hover, .balwrap:focus-within, .balwrap.open")); }
document.addEventListener("mouseover",function(e){ var w = e.target.closest && e.target.closest(".balwrap"); if(w) placeTip(w); });
document.addEventListener("focusin",function(e){ var w = e.target.closest && e.target.closest(".balwrap"); if(w) placeTip(w); });
window.addEventListener("scroll",placeOpenTip,{passive:true});
window.addEventListener("resize",placeOpenTip);
document.addEventListener("click",function(e){
  var t = e.target.closest("[data-kit],[data-mode],[data-cls],[data-tier],[data-bal],[data-tab],[data-skin],[data-pick],[data-act]");
  if(moved) return;
  var inSk = !!e.target.closest(".skwrap"), ds = t ? t.dataset : null, inDetail = !!(t && t.closest("#detail"));
  if(S.skins && !inSk){ S.skins = false; renderDetail(); }
  var bw = e.target.closest(".balwrap");
  Array.prototype.forEach.call(document.querySelectorAll(".balwrap.open"),function(w){ if(w!==bw) w.classList.remove("open"); });
  if(bw && e.target.closest("[data-baltoggle]")){ bw.classList.toggle("open"); placeTip(bw); return; }
  if(!t) return;
  if("mode" in ds){
    S.mode = ds.mode; try{ localStorage.setItem("bwMode",S.mode); }catch(x){}
    if(inDetail && ds.tier){ S.tier = ds.tier; renderList(); history.replaceState(null,"",location.pathname+location.search); apply(); $("browse").scrollIntoView({block:"start"}); }
    else{ renderList(); renderDetail(); }
  }
  else if("kit" in ds){ go(ds.kit); }
  else if("cls" in ds || "tier" in ds){
    var key = "cls" in ds ? "cls" : "tier";
    S[key] = (S[key]===ds[key]) ? "" : ds[key];
    renderList();
    if(inDetail){ history.replaceState(null,"",location.pathname+location.search); apply(); $("browse").scrollIntoView({block:"start"}); }
  }
  else if("bal" in ds){
    S.bal = (S.bal===ds.bal) ? "" : ds.bal; renderList();
    if(inDetail){ history.replaceState(null,"",location.pathname+location.search); apply(); $("browse").scrollIntoView({block:"start"}); }
  }
  else if("pick" in ds){ S.pick = ds.pick; renderDetail(); }
  else if("tab" in ds){ S.tab = ds.tab; renderDetail(); }
  else if("skin" in ds){ S.skin = +ds.skin; S.skins = false; renderDetail(); }
  else if(ds.act==="skins"){ S.skins = !S.skins; renderDetail(); }
  else if(ds.act==="close"){ history.replaceState(null,"",location.pathname+location.search); apply(); window.scrollTo(0,0); }
});
window.addEventListener("keydown",function(e){ if(e.key==="Escape" && S.skins){ S.skins = false; renderDetail(); } });
window.addEventListener("hashchange",apply);
try{ var sm = localStorage.getItem("bwMode"); if(MODES.some(function(m){return m.id===sm;})) S.mode = sm; }catch(x){}
renderList(); apply();
</script>
</body>
