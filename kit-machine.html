<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kit Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0418;--card:#150b38;--soft:rgba(255,255,255,.07);--line:rgba(255,255,255,.28);--text:#fff;--muted:#b9aee0;--accent:#a98bff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-weight:400}
body{margin:0;min-height:100vh;color:var(--text);font:400 1.05rem/1.5 "Jua","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 15% 8%,rgba(110,60,220,.35),transparent 40%),radial-gradient(circle at 85% 92%,rgba(120,50,230,.3),transparent 45%),radial-gradient(circle,rgba(255,255,255,.4) 1px,transparent 1.6px) 0 0/87px 87px,radial-gradient(circle,rgba(180,156,255,.32) 2px,transparent 2.8px) 37px 51px/131px 131px,var(--bg);background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:2.8rem;margin:0;line-height:1.1}
h2{font-size:1.7rem;margin:0;line-height:1.2}
h3{font-size:1.2rem;margin:22px 0 6px}
p{margin:0 0 12px}.muted{color:var(--muted)}
.lead{margin:6px 0 0}
.chg{display:inline-block;flex:none;vertical-align:middle}
.hist{position:relative;margin-top:6px;padding-left:4px}
.hent{position:relative;display:flex;gap:14px;padding:0 0 18px}
.hent:not(:last-child)::before{content:"";position:absolute;left:17px;top:40px;bottom:2px;width:2px;background:rgba(255,255,255,.18)}
.hent .chg{margin-top:2px}
.hbody{flex:1;min-width:0;background:var(--soft);border-radius:16px;padding:12px 16px}
.htop{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.htag{font-size:.85rem;border-radius:999px;padding:2px 10px;color:#12082e}
.htag.t-buff{background:#5fe3a1}.htag.t-nerf{background:#ff7a8e}.htag.t-bal{background:#ffd166}
.hdate{color:var(--muted);font-size:.9rem}
.htitle{font-size:1.15rem;margin:6px 0 0;overflow-wrap:break-word}
.hchange{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.hchange .cost{margin:0}
.hchange .old{opacity:.55}
.hchange .old b{text-decoration:line-through}
.harrow{color:var(--muted)}
.hval{background:rgba(255,255,255,.08);border-radius:999px;padding:4px 12px;font-size:1rem}
.hval.old{text-decoration:line-through}
.hnote{color:var(--muted);margin:8px 0 0}
.hlist{margin:8px 0 0;padding-left:20px}
.hlist li{margin:3px 0;overflow-wrap:break-word}
.hlist li::marker{color:var(--muted)}
.hlist .ar{color:#ffd166;margin:0 3px}
.hkey{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.95rem;margin:0 0 14px}
.hkey span{display:inline-flex;align-items:center;gap:7px}
.topnav{display:flex;gap:18px;font-size:.95rem;margin-bottom:14px}
.topnav a{color:var(--muted);text-decoration:none}
.topnav a:hover,.topnav a:focus-visible{color:#fff}
#detail{position:relative;z-index:5}
.box{background:rgba(18,8,48,.55);border:4px solid #fff;padding:24px;margin-top:26px}
.label{color:var(--muted);font-size:.95rem;margin:18px 0 8px}
#q{width:100%;font:inherit;font-size:1.3rem;padding:14px 16px;background:var(--card);color:#fff;border:3px solid #fff;border-radius:14px}
#q::placeholder{color:var(--muted)}
button{font:inherit;color:#fff;cursor:pointer}
button:focus-visible,#q:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#strip{display:flex;gap:12px;overflow-x:auto;padding:16px 2px 6px;cursor:grab;user-select:none;scrollbar-width:thin}
#strip.off{display:none}
.sitem{flex:none;display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:8px 18px 8px 8px;text-align:left}
.sitem:hover,.card:hover{border-color:#fff}
.sitem small{display:block;color:var(--muted);font-size:.85rem;line-height:1.2}
.th{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;background:#0d0626;border:2px solid #fff}
.th img,.pic img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.6em}
.cchip{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border:0;border-radius:99px;padding:6px 16px}
.cchip.on{background:#fff;color:#12082e}
.cchip.on .cico{filter:brightness(0)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cico{width:26px;height:26px;object-fit:contain;filter:brightness(0) invert(1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:16px;padding-top:6px}
.card{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.card .th{width:100%;height:auto;aspect-ratio:1;font-size:1.4rem}
.card b{display:block;margin-top:8px;line-height:1.15}
.card small{color:var(--muted)}
.dm{display:inline-block;width:12px;height:12px;border:2px solid #fff;border-radius:3px;transform:rotate(45deg);background:var(--c);margin:0 7px 0 3px;vertical-align:0}
.card .dm{position:absolute;top:2px;right:2px;margin:0;width:16px;height:16px;z-index:1}
.easy{--c:#5fe3a1}.moderate{--c:#ffd166}.hard{--c:#ff6b81}.extreme{--c:#a98bff}
.dgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px}
@media(max-width:780px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dgrid>*{min-width:0}
.row h2{min-width:0;overflow-wrap:break-word}
.row .btn{flex:none;white-space:nowrap}
@media(max-width:560px){
  .wrap{padding-left:12px;padding-right:12px}
  .box{padding:16px}
  .tabs{gap:4px 18px}
  .tab{font-size:1.05rem}
  .row .btn{padding:6px 12px;font-size:.95rem}
  .dleft{padding-right:0}
  .ptable{font-size:.9rem}
  .ptable th,.ptable td{padding:6px 5px}
  .ptable td:first-child{white-space:normal}
  .ptable .ticon{display:block;margin:0 0 4px}
}
html,body{overflow-x:hidden}
.pic{aspect-ratio:1;border:4px solid #fff;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:6rem}
.cap{text-align:center;margin-top:8px;color:var(--muted);min-height:1.5em}
.picwrap{position:relative}
.adet{margin-bottom:8px}
.dock{display:flex;flex-wrap:wrap;gap:14px 12px;align-items:flex-start}
.slot{align-self:flex-start;display:block;width:92px;background:none;border:0;padding:0;text-align:center;font-size:.8rem;line-height:1.15;color:var(--muted)}
.slot .aico{width:92px;height:92px;border:2px solid transparent}
.slot.on .aico{border-color:#fff;background:rgba(255,255,255,.16)}
.slot.on{color:#fff}
.slot:hover .aico{border-color:var(--line)}
.slot span{display:block;margin-top:6px;overflow-wrap:anywhere}
.dleft{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:4px}
@media(max-width:780px){.dleft{position:static;max-height:none;overflow:visible}}
.dleft .stats{grid-template-columns:repeat(2,minmax(0,1fr));margin:16px 0 0}
.dleft .stat{min-width:0}
.dleft .stat b,.dleft .cbtn{font-size:1.15rem;overflow-wrap:anywhere}
.dleft .cbtn .cico{width:30px;height:30px;flex:none}
@media(max-width:780px){.dleft{position:static}}
.wbtn{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:14px;background:rgba(8,3,26,.88);border:2px solid #fff;display:flex;align-items:center;justify-content:center;padding:0;z-index:3}
.wbtn.on{background:#fff;color:#12082e}
.wbtn img{width:30px;height:30px;object-fit:contain}
.wbtn i{position:absolute;right:-8px;bottom:-8px;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:#12082e;font-style:normal;font-size:.8rem;line-height:22px;text-align:center;padding:0 5px}
.skpanel{position:absolute;top:66px;left:10px;right:10px;z-index:4;background:rgba(8,3,26,.97);border:3px solid #fff;border-radius:16px;padding:16px 16px 20px;max-height:320px;overflow:auto}
.skpanel .t{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 10px;align-items:start}
.skgrid .sk{font-size:.7rem;line-height:1.1}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 16px}
.btn:hover{border-color:#fff}.btn.on{background:#fff;color:#12082e}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#skinbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-top:12px}
.sk{background:none;border:0;padding:0;text-align:center;font-size:.8rem;color:var(--muted);align-self:start;display:block}
.sk .lb{display:block;margin-top:8px;padding:0 2px;overflow-wrap:break-word;hyphens:none;line-height:1.2}
.sk .th{width:100%;height:auto;aspect-ratio:1;display:block;box-sizing:border-box;border:3px solid #fff}
.sk.on .th{border-color:var(--accent)}.sk.on{color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0 4px}
.stat{background:var(--soft);border-radius:14px;padding:12px 14px}
.stat>span{display:block;color:var(--muted);font-size:.85rem;margin-bottom:2px}
.stat b,.cbtn{font-size:1.35rem}
.cbtn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.cbtn .cico{width:38px;height:38px}
.tabs{display:flex;flex-wrap:wrap;gap:6px 26px;margin:24px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 2px;margin-bottom:-1px;color:var(--muted);font-size:1.15rem}
.tab.on{color:#fff;border-color:#fff}
.ab{display:flex;gap:16px;background:var(--soft);border-radius:16px;padding:14px;margin-bottom:14px}
.aico{width:84px;height:84px;flex:none;border-radius:14px;background:rgba(255,255,255,.07);padding:6px;font-size:2.6rem}
.aico .ph{background:none!important}
.aico img{width:100%;height:100%;object-fit:contain;display:block}
.tag{background:var(--accent);color:#12082e;border-radius:6px;padding:0 9px;font-size:.8rem;margin-right:10px}
.nm{font-size:1.25rem}
.modebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.mbtn{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 20px;font-size:1.1rem}
.mbtn small{opacity:.7;margin-left:8px;font-size:.85rem}
.mbtn:hover{border-color:#fff}.mbtn.on{background:#fff;color:#12082e}
.tpair{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.tbtn{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:4px 14px;text-align:center;min-width:92px}
.tbtn small{display:block;font-size:.75rem;color:var(--muted)}.tbtn b{font-size:1.4rem;line-height:1.2}
.tbtn:hover{border-color:#fff}.tbtn.on{background:#fff;color:#12082e}.tbtn.on small{color:#4a3d7a}
.dleft .stat.wide{grid-column:1/-1}
.cost{display:flex;align-items:center;gap:8px;width:fit-content;margin:10px 0 4px;padding:5px 14px 5px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:1rem;line-height:1}
.cost img{height:22px;width:auto;max-width:30px;object-fit:contain;display:block}
.cost b{font-weight:400;background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cost.emerald{background:rgba(60,200,120,.12);border-color:rgba(110,235,160,.35)}
.cost.emerald b{background-image:linear-gradient(90deg,#b6ffd2,#4be08a 55%,#1fa862)}
.cost.iron{background:rgba(220,225,235,.1);border-color:rgba(230,235,245,.3)}
.cost.iron b{background-image:linear-gradient(90deg,#ffffff,#d5d9e0 55%,#9aa1ac)}
.calc input{width:96px;background:var(--soft);color:inherit;font:inherit;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 10px}
.calc .cres{font-size:1.4rem;margin-left:6px}
.calc .cnote{font-size:.85rem;opacity:.7;margin-left:6px}
.ctable{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:12px}
.ctable span{background:rgba(255,255,255,.07);border-radius:8px;padding:4px 10px;font-size:.88rem}
.ctable b{font-weight:400;color:var(--accent)}

.bal{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:999px;padding:5px 16px 5px 5px;font-size:1.05rem;line-height:1.1;color:var(--fg);background:var(--g);box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,255,255,.55);text-align:left;cursor:pointer}
.bal .bi,.cbal,.bchip .bi{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.bal svg,.cbal svg,.bchip svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.balwrap{position:relative;display:inline-block;max-width:100%}
.baltip{display:none;position:fixed;left:12px;top:12px;z-index:60;width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(8,3,26,.98);border:2px solid #fff;border-radius:14px;padding:12px 14px;font-size:.95rem;line-height:1.35;text-align:left;white-space:pre-line;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.baltip b{display:block;font-size:1rem;margin-bottom:4px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.balwrap:hover .baltip,.balwrap:focus-within .baltip,.balwrap.open .baltip{display:block}
.balnone{color:var(--muted);font-size:1.05rem}
.cbal{position:absolute;top:6px;left:6px;width:24px;height:24px;background:var(--g);z-index:1}
.cbal svg{width:14px;height:14px}
.bchip{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border:0;border-radius:99px;padding:5px 16px 5px 5px}
.bchip .bi{width:24px;height:24px;background:var(--g)}
.bchip .bi svg{width:14px;height:14px}
.bchip.on{background:#fff;color:#12082e}
.bkey{margin-top:14px;background:var(--soft);border-radius:14px;padding:10px 14px}
.bkey summary{cursor:pointer;color:var(--muted)}
.bkey .brow{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.bkey .bal{cursor:default;min-width:230px}
.bkey .brow span.d{flex:1;min-width:180px;color:var(--muted)}
.knote{border-left:4px solid #ffd23f}
.ptable{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}
.ptable th,.ptable td{padding:7px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.12)}
.ptable th{color:var(--muted);font-weight:400;font-size:.85rem}
.ptable td:first-child,.ptable th:first-child{text-align:left}
.ptable tr:last-child td{border-bottom:0}
.ptable td.hl{color:#7dffb0}
.twrap{overflow-x:auto}
.ptable td.l{text-align:left}
.ptable .ticon.inv{filter:brightness(0) invert(1)}
.ptable .ticon{width:22px;height:22px;object-fit:contain;vertical-align:-6px;margin-right:8px;image-rendering:pixelated}
.ptable td:first-child{white-space:nowrap}
.cond{display:inline-block;margin-top:6px;background:rgba(255,255,255,.14);border-radius:8px;padding:1px 10px;font-size:.9rem}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nums span{background:rgba(0,0,0,.35);border-radius:8px;padding:2px 12px;color:var(--muted);font-size:.95rem}.nums b{color:#fff}
.fus{background:var(--soft);border-radius:18px;padding:18px;margin-bottom:16px}
.fpair{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,28px);margin-bottom:14px}
.fp{width:clamp(96px,26vw,138px);text-align:center;background:none;border:0;padding:0;font-size:1.15rem;line-height:1.25}
.fp .th{width:100%;height:auto;aspect-ratio:1;border-width:3px;border-radius:14px;margin-bottom:8px;display:block}
button.fp:hover .th{border-color:var(--accent)}
.plus{font-size:2.6rem;line-height:1}
.pbox{background:var(--soft);border-radius:16px;padding:16px 18px;margin-top:18px}
.pbox h3{margin:0 0 10px}
.pitem{margin-bottom:14px}.pitem:last-child{margin-bottom:0}
.when{background:rgba(255,255,255,.14);border-radius:6px;padding:0 9px;font-size:.8rem;margin-left:10px}
.fus p{margin:0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav"><a href="index.html">Home</a><a href="charts.html">Tier Lists</a></nav>
  <h1>Kit Machine</h1>
  <p class="muted lead">Type a kit name, pick one from the bar, or browse by class and tier. Stats, passives and strategy are still being added for each kit.</p>
  <div id="modebar" class="modebar" role="group" aria-label="Tier list"></div>

  <div class="box">
    <input id="q" type="text" placeholder="Type a kit name…" autocomplete="off" aria-label="Search kits">
    <div id="strip" class="off" aria-label="Matching kits"></div>
  </div>

  <div id="detail" class="box" hidden></div>

  <div id="browse" class="box">
    <h2>Browse kits</h2>
    <div class="label">Class</div><div id="cls" class="chips"></div>
    <div class="label">Tier</div><div id="tier" class="chips"></div>
    <div class="label">Balance</div><div id="bal" class="chips"></div>
    <details id="balkey" class="bkey"></details>
    <div id="count" class="label" style="margin-top:22px"></div>
    <div id="grid" class="grid"></div>
  </div>
<p class="muted" style="margin-top:28px;text-align:center;font-size:.9rem">Kit descriptions and item names from the <a href="https://robloxbedwars.fandom.com/wiki/Kit" style="color:#a98bff">Roblox Bedwars Wiki</a>.</p>
</div>

<script>
/* ===== DATA. tier: OP,S,A,B,C,F. diff: easy,moderate,hard,extreme.
   abilities and items are separate lists (any number, or none); each: name, desc, cd = cooldown (s), dmg = damage, hits = hits per use (optional), img = picture.
   passives: name, when (e.g. On spawn), desc. strategy: title, text. skins: name, img (up to 10).
   FUSIONS: list each pair once; it shows on both kits' pages. ===== */
var WARDROBE_IMG = ""; /* optional: put your own wardrobe/shirt picture here */

 and crossbows can't headshot."}, {"name": "Projectile Bonus", "when": "Always", "desc": "Deals extra damage with the Bow, Crossbow and Headhunter compared to normal. The bonus for each weapon is listed under its item."}, {"name": "Cheaper Weapons", "when": "In the item shop", "desc": "The Tactical Crossbow costs 6 emeralds and the Tactical Headhunter costs 21 emeralds."}], "skins": [{"name": "Lunar Dragon Skin", "img": "images/skins/archer-lunar-dragon.webp"}, {"name": "Victorious Gold Skin", "img": "images/skins/archer-victorious-gold.webp"}, {"name": "Victorious Platinum Skin", "img": "images/skins/archer-platinum.webp"}, {"name": "Victorious Diamond Skin", "img": "images/skins/archer-diamond.webp"}, {"name": "Victorious Emerald Skin", "img": "images/skins/archer-emerald.webp"}, {"name": "Victorious Nightmare Skin", "img": "images/skins/archer-nightmare.webp"}], "strategy": [{"title": "Aim for headshots", "text": "Headshots are the best part of Archer, so always aim for the head."}, {"title": "Save emeralds for the Crossbow", "text": "Save the emeralds you get from the middle and buy the Tactical Crossbow as fast as you can. Archer gets the biggest damage increase over a normal crossbow, so it gives you a lot of control."}], "bal": "adj", "balWhy": "Its damage is worse than every special bow kit, including kits that aren't even in the Ranged class. It needs a unique mechanic instead of more damage, since the headshot gimmick is a bit outdated.", "counter": [{"title": "Not much counterplay", "text": "There isn't much counterplay, since no kit has better ranged damage."}, {"title": "Deny the middle", "text": "Don't let it collect the middle emeralds, so it can't get its crossbow early."}], "history": [{"type": "buff", "date": "Jul 21, 2023", "title": "", "changes": ["Tactical Crossbow Base Damage: 45 → 50", "Tactical Head Hunter Base Damage: 65 → 70"]}, {"type": "buff", "date": "Jun 28, 2023", "title": "", "changes": ["+Tactical Headhunter → Deals 8% more damage & {"name": "Ares", "img": "images/kits/ares.webp", "cls": "Ranged", "tiers": {"casual": "A", "ranked": "A"}, "diff": "hard", "hp": "100", "desc": "A powerful ancient warrior that uses electric-charged throwing spears to destroy his enemies.", "adv": "Ares throws electric-charged Spears. You can buy Spears in the shop for 40 iron, holding up to 10, or wait 40 seconds for a free one to generate. Free spears won't generate if you already have 3 or more.\nSpears fly slowly, at half the speed of an arrow, but have a massive range. They can hit through walls, and can hit someone above or below a floor or ceiling. They can also hit you, so be careful.\nWhen a Spear hits, it applies Zapped 1 for 5 seconds in a 4x4 block radius, which reduces healing and shields by 40%.", "items": [{"name": "Spear", "img": "images/items/spear.png", "note": "Cost: 40 iron", "desc": "Buy up to 10 in the shop, or wait 40 seconds for one to generate (it won't generate if you have 3 or more). Deals 40 damage with 40% armor penetration, with a 0.75 second throw cooldown. It has a massive range, but travels at half the speed of an arrow. It can hit through walls and floors or ceilings, and it can hit you. Applies Zapped 1 for 5 seconds in a 4x4 block radius, reducing healing and shields by 40%. Killing someone with it gives you another Spear.", "dmg": 40, "cd": 0.75}], "abilities": [], "passives": [{"name": "Spear Generation", "when": "Every 40 seconds", "desc": "You get a free Spear every 40 seconds. It won't generate if you already have 3 or more Spears."}, {"name": "Spear Refund", "when": "When you kill someone with a Spear", "desc": "You gain another Spear."}, {"name": "Zapped 1", "when": "When a Spear hits", "desc": "Everyone in a 4x4 block radius, including you, is Zapped for 5 seconds. Healing and shields are reduced by 40%."}], "strategy": [{"title": "Back off and throw", "text": "Damage someone first. When they are in range of a Spear, back off and throw it to get another one back."}, {"title": "Spam late game", "text": "Once you have a lot of iron later in the game, spam Spears."}, {"title": "Don't hit yourself", "text": "The blast can hit you too, so make sure you are outside the 4x4 radius when you throw."}, {"title": "Target healers and shielders", "text": "Zapped cuts healing and shields by 40%, so aim at enemies who heal or shield for the best results."}], "skins": [], "bal": "adj", "balWhy": "It now gets outclassed by other kits, and it needs more armor penetration to make up for all the damage it lost through nerfs.", "counter": [{"title": "Dodge early spears", "text": "Early game it won't have many spears, so dodge them by placing blocks and building over them. This baits it into throwing and missing."}, {"title": "Fight up close", "text": "Fight it up close so the spear also hits Ares himself."}], "history": [{"type": "nerf", "date": "Oct 30, 2026", "title": "", "changes": ["Spear damage decreased 45 -> 40"]}, {"type": "nerf", "date": "Sep 4, 2026", "title": "", "changes": ["Spear damage: 52 → 45"]}, {"type": "nerf", "date": "Jul 3, 2026", "title": "", "changes": ["Spear cost increased: 35 → 40", "Max Spear capacity reduced: 10 → 8"]}, {"type": "buff", "date": "Sep 30, 2022", "title": "", "changes": ["Max Spear stack size: 5 → 8", "Spear damage radius: 3 blocks → 4 blocks"]}, {"type": "nerf", "date": "Sep 2, 2022", "title": "", "changes": ["Spear cost increased (30 iron → 40 iron)"]}, {"type": "nerf", "date": "Jul 8, 2022", "title": "", "changes": ["Spear damage: 65 → 52"]}, {"type": "nerf", "date": "Jan 7, 2022", "title": "", "changes": ["Spear max stack size: 10 → 5"]}, {"type": "nerf", "date": "Nov 5, 2021", "title": "", "changes": ["Spears now have a max stack size of 10"]}]},
{"name": "Axolotl Amy", "img": "images/kits/axolotl-amy.webp", "cls": "Support", "tiers": {"casual": "B", "ranked": "S"}, "diff": "easy", "hp": "100", "desc": "Use your pet axolotls to empower yourself and nearby teammates with shields, increased attack damage, faster break speed and health regen.", "adv": "Buy Axolotls in the shop to power up yourself and nearby teammates. Every Axolotl has a 5 second cooldown and a 9 block radius.\nShield Axolotl gives shield when you are damaged, Damage Axolotl boosts damage after you hit someone, Break Speed Axolotl speeds up block breaking, and Health Regen Axolotl heals you when you drop below 50% HP.", "items": [{"name": "Shield Axolotl", "img": "images/items/shield-axolotl.png", "note": "Cost: 40 iron", "desc": "Gives you and nearby teammates 15 shield when they get damaged. 9 block radius.", "cd": 5}, {"name": "Damage Axolotl", "img": "images/items/damage-axolotl.png", "note": "Cost: 90 iron", "desc": "Gives you and nearby teammates 16% more damage. Activates after you deal damage. 9 block radius.", "cd": 5}, {"name": "Break Speed Axolotl", "img": "images/items/break-speed-axolotl.png", "note": "Cost: 1 emerald", "desc": "Gives you and nearby teammates 60% break speed. 9 block radius.", "cd": 5}, {"name": "Health Regen Axolotl", "img": "images/items/health-regen-axolotl.png", "note": "Cost: 5 emeralds", "desc": "Heals you and your teammates by 1% HP for 12 ticks, with 0.45 seconds between ticks. Activates when you take damage below 50% HP. 9 block radius.", "cd": 5}], "abilities": [], "strategy": [{"title": "Shield Axolotl early", "text": "Get the Shield Axolotl early in the game and stick with your teammates so they benefit from it too."}, {"title": "Damage Axolotl later", "text": "Only buy the Damage Axolotl after you have iron armor and a stone sword."}, {"title": "Break Speed is the strongest", "text": "Break Speed Axolotl is the most powerful one. Use it to shred through bed defenses."}, {"title": "Health Regen is expensive", "text": "The Health Regen Axolotl costs too much. Only buy it once you have the essentials you need, like a crossbow, diamond armor, enchants and pearls."}], "skins": [{"name": "Reindeer Trainer Skin", "img": "images/skins/axolotl-amy-reindeer-trainer.webp"}, {"name": "Easter Bunny Skin", "img": "images/skins/axolotl-amy-easter-bunny.webp"}, {"name": "Victorious Gold Skin", "img": "images/skins/axolotl-amy-victorious-gold.webp"}, {"name": "Victorious Platinum Skin", "img": "images/skins/axolotl-amy-victorious-platinum.webp"}, {"name": "Victorious Diamond Skin", "img": "images/skins/axolotl-amy-victorious-diamond.webp"}, {"name": "Victorious Emerald Skin", "img": "images/skins/axolotl-amy-victorious-emerald.webp"}, {"name": "Victorious Nightmare Skin", "img": "images/skins/axolotl-amy-victorious-nightmare.webp"}], "bal": "adj", "balWhy": "Some of the prices are outrageous for what the Axolotls do. The prices, and what each Axolotl does, might need some changes.", "counter": [{"title": "Strong bed defense", "text": "There isn't much counterplay besides your bed defense. It can shred obsidian, so place 2 layers plus wool, since it one-shots stone."}], "history": [{"type": "nerf", "date": "Mar 31, 2023", "title": "", "changes": ["Shield axolotl price: 20 iron → 30 iron", "Damage axolotl price: 50 iron → 60 iron"]}, {"type": "nerf", "date": "Dec 9, 2022", "title": "", "changes": ["Shield axolotl’s shield: 10 → 8", "Damage axolotl’s damage: 20% → 16%"]}, {"type": "buff", "date": "Nov 18, 2022", "title": "", "changes": ["Break speed axolotl price (3 ems → 1 em)"]}]},
{"name": "Baker", "img": "images/kits/baker.webp", "cls": "Support", "tiers": {"casual": "S", "ranked": "S"}, "diff": "easy", "hp": "100", "desc": "Gain access to health-gain apples, speed-boost pies, and spawn with a knockback baguette!", "adv": "Baker always spawns with the Knockback Baguette and can store it in chests for teammates to pick up. Baker can also drop all of its items for teammates, and they have the same capacities.\nApples, Golden Apples and Speed Pies are bought in the shop. Eating an apple slows you down while you eat.\nA Golden Apple heals 175 HP in total: 30 instantly, then 5 HP every 0.5 seconds for 15 seconds (145 HP), along with 5% damage reduction until it runs out.", "items": [{"name": "Health Apple", "img": "images/items/health-apple.png", "note": "Cost: 40 iron", "desc": "Max 3. Heals 20 HP. Takes 0.75 seconds to eat, and you move slower while eating."}, {"name": "Speed Pie", "img": "images/items/speed-pie.png", "note": "Cost: 2 emeralds", "desc": "Unlimited capacity. Gives 100 seconds of speed that increases your movement by 100% (2x)."}, {"name": "Golden Apple", "img": "images/items/golden-apple.png", "note": "Cost: 3 emeralds", "desc": "Max 3. Takes 1 second to eat, and you move slower while eating. Heals 30 HP instantly, then 5 HP every 0.5 seconds for 15 seconds (145 HP), plus 5% damage reduction until it runs out. 175 HP in total."}, {"name": "Knockback Baguette", "img": "images/items/knockback-baguette.png", "desc": "Baker always spawns with it. Deals 1 damage and 4 blocks of knockback. Can be stored in chests for teammates to pick up.", "dmg": 1}], "abilities": [], "bal": "op", "balWhy": "For 3 emeralds you are basically unkillable, unless the other team has enchants and gets lucky and rolls static. Coils aren't much of a counter because they aren't mobile. Healing more than double your HP for 3 emeralds is insane, and with the Speed Pie, which outclasses most movement kits, it's a bit crazy.\nSuggested changes: keep the healing the same but tick every 0.75s instead of 0.5s, which makes it easier to deal with in fights. Raise the damage reduction by another 5% to make up for it, and nerf the Speed Pie to 1.75x movement instead of 2x.", "passives": [{"name": "Knockback Baguette", "when": "Always", "desc": "Baker always spawns with the Knockback Baguette and can store it in chests for teammates to pick up."}, {"name": "Team Supplies", "when": "Always", "desc": "Baker can drop all of its items for teammates, and they have the same capacities."}], "strategy": [{"title": "Loot early", "text": "Focus on loot early in the game. If you have the emeralds, buy a Speed Pie to get diamonds quicker."}, {"title": "Dominate at tier 3", "text": "Once you reach tier 3, you can dominate with all the OP items."}, {"title": "Pair it with Berserker", "text": "Combine Baker with Berserker to simply be unkillable, even when static'd."}], "counter": [{"title": "Coil your base", "text": "Place coils in your base so Baker gets heavily nerfed when it arrives."}], "skins": [{"name": "Spirit Skin", "img": "images/skins/baker-spirit.webp"}, {"name": "Loveseeker Skin", "img": "images/skins/baker-loveseeker.webp"}], "history": [{"type": "nerf", "date": "Feb 24, 2023", "title": "", "changes": ["Gold apple price: 5 emeralds → 7 emeralds", "Apple price: 30 iron → 40 iron"]}, {"type": "buff", "date": "Feb 10, 2023", "title": "", "changes": ["Added the Golden Apple"]}, {"type": "nerf", "date": "Jan 27, 2023", "title": "", "changes": ["Apple heal: 22 → 18", "Pie speed boost: 30% → 24%"]}, {"type": "bal", "date": "Sep 30, 2022", "title": "", "changes": ["Speed Pie price: 2 ems → 3 ems", "Speed Pie duration: 2m → 2.5m", "Apple healing: 25 → 22"]}, {"type": "buff", "date": "Sep 2, 2022", "title": "", "changes": ["Speed Pie duration increased (1.5m → 2m)"]}, {"type": "nerf", "date": "Jul 8, 2022", "title": "", "changes": ["Apple healing: 30 HP → 25 HP", "You can now only hold up to 4 apples at once"]}, {"type": "buff", "date": "Sep {"name": "Barbarian", "img": "images/kits/barbarian.webp", "cls": "Fighter", "tiers": {"casual": "S", "ranked": "B"}, "diff": "hard", "hp": "100", "desc": "Build rage by damaging enemies. Instead of buying swords, your sword is upgraded when you reach enough rage. You lose all your rage on death. The Emerald Sword is replaced by the Rageblade.", "adv": "Barbarian cannot buy swords. You start with a wooden sword and upgrade it by building rage, which you get from dealing damage and from kills. Once upgraded, your sword never goes back to the previous one when you die.\nDamage needed for each upgrade:\nStone sword: 85\nIron sword: 210\nDiamond sword: 430\nRageblade: 650\nYour rage resets each time you upgrade, so you need 1375 damage in total.\nRanged damage gives 2x less rage than other damage. Killing an enemy gives you around 40 damage worth of rage. You cannot get rage from enemies who respawned within the last 9 seconds.\nWhen you die you lose all your rage and restart the tier you are on.", "items": [{"name": "Rageblade", "img": "images/items/rageblade.png", "note": "Rage needed: 650 damage", "desc": "Replaces the Emerald Sword. Deals 70 damage with a 0.25 second cooldown.", "cd": 0.25, "dmg": 70}], "abilities": [], "bal": "adj", "balWhy": "It is really good in casuals but terrible in ranked. A fix could be giving its normal swords more attack speed, so it isn't just \"no kit\". That wouldn't change much for casuals, but in ranked it would become a unique kit that attacks faster after each hit, up to a cap. The Rageblade wouldn't change, only the other swords.", "passives": [{"name": "No Sword Shop", "when": "Always", "desc": "Barbarian cannot buy swords. You start with a wooden sword and upgrade it by building rage."}, {"name": "Rage", "when": "When you deal damage or kill", "desc": "Damage and kills build rage. Ranged damage gives 2x less rage, and a kill gives around 40 damage worth of rage. You get no rage from enemies who respawned within 9 seconds."}, {"name": "Sword Upgrades", "when": "At 85, 210, 430 and 650 rage", "desc": "Reaching each rage amount upgrades your sword: stone, iron, diamond, then Rageblade. Rage resets on every upgrade, and you need 1375 damage in total."}, {"name": "Death Penalty", "when": "On death", "desc": "You lose all your rage and restart the tier you are on, but your sword never goes back to the previous one."}], "strategy": [{"title": "Early game", "text": "Get armor unless you are getting rushed. Make sure you don't die to the first enemy rush, or you will be at a disadvantage for the rest of the match."}, {"title": "Midgame", "text": "Look for tanky enemies with lots of HP to farm rage off of."}, {"title": "After the Rageblade", "text": "Play safe and don't risk dying, because the chances of getting a Rageblade again are low."}], "counter": [{"title": "Early game Barbarian", "text": "Don't give it the damage it needs for a stone sword."}, {"title": "Late game Barbarian", "text": "If it has a diamond sword, focus it and make sure it is constantly reset, because getting a Rageblade that early is not good for the whole lobby."}], "skins": [{"name": "Deep Void Skin", "img": "images/skins/barbarian-deep-void.webp"}, {"name": "Barbunny Skin", "img": "images/skins/barbarian-barbunny.webp"}, {"name": "Corrupted Skin", "img": "images/skins/barbarian-corrupted.webp"}, {"name": "Dynasty Skin", "img": "images/skins/barbarian-dynasty.webp"}, {"name": "Victorious Skin", "img": "images/skins/barbarian-victorious.webp"}], "history": [{"type": "buff", "date": "Sep 18, 2026", "title": "", "changes": ["Stone sword rage requirement: 90 → 85", "Iron sword rage requirement: 280 → 270"]}, {"type": "buff", "date": "May 8, 2026", "title": "", "changes": ["Increased rage gain if enemy gear is stronger than barbarian, up to 50%"]}, {"type": "buff", "date": "May 19, 2023", "title": "", "changes": ["Reduced Stone Sword rage cost: 120 → 100", "Reduced Iron Sword rage cost: 350 → 325"]}, {"type": "buff", "date": "Feb 10, 2023", "title": "", "changes": ["Rageblade damage: 65 → 70"]}, {"type": "buff", "date": "Sep 2, 2022", "title": "", "changes": ["Unlock the stone & iron sword slightly faster"]}, {"type": "nerf", "date": "Feb 11, 2022", "title": "", "changes": ["Increased rage required for Iron Sword, Diamond Sword and Rageblade"]}, {"type": "buff", "date": "Oct 2, 2021", "title": "", "changes": ["Reduced rage requirements for sword upgrades"]}, {"type": "bal", "date": "Jul 5, 2021", "title": "", "changes": ["Barbarian now has a unique Rageblade sword that replaces the Emerald Sword"]}, {"type": "buff", "date": "Jun 28, 2021", "title": "", "changes": ["Gain rage on kill", "Reduced diamond and emerald sword rage requirements"]}]},
{"name": "Beekeeper Beatrix", "img": "images/kits/beekeeper-beatrix.webp", "cls": "Economy", "tiers": {"casual": "C", "ranked": "S"}, "diff": "hard", "hp": "100", "desc": "Catch bees around the map to upgrade your Bee Hive. Upgrading your Bee Hive will return additional iron and emeralds.", "adv": "Bees spawn around the map, similar to Alchemist's ingredients but not as many, and the amount depends on the map. A bee on the ground disappears 3 minutes after it spawns, and bees pulse every 7 seconds so they are easier to find. Hold the Bee Net to pick a bee up: it goes into your inventory as a separate item, then you put it in a Beehive. You lose your bees when you die, but you keep the net. Bees inside a hive never despawn.\nYou can place up to 5 Beehives. A hive with 0 bees only produces iron, 1 iron every 10 seconds. The more bees inside, the faster it drops loot, and from 3 bees it can drop diamonds, and from 4 bees it can drop emeralds. Each drop is only 1 resource at a time: either 1 iron, 1 diamond or 1 emerald. After 10 bees a hive doesn't drop any faster. There are no hive upgrades.\nHives have normal block HP and are weak to pickaxes: they break in 5 hits with a wooden pickaxe, 4 with stone, and 2 with iron or diamond. They can also be broken by TNT and fireballs if they aren't covered with ceramic or obsidian.", "items": [{"name": "Bee", "img": "images/items/bee.png", "desc": "Spawns around the map, similar to Alchemist's ingredients but not as many, and the amount depends on the map. Pulses every 7 seconds so it's easier to find. Disappears 3 minutes after spawning on the ground, but never inside a hive. Pick it up with the Bee Net, put it in a Beehive, and you lose it if you die."}, {"name": "Beehive", "img": "images/items/beehive.png", "note": "Cost: 60 iron", "desc": "You can place up to 5. Produces loot based on how many bees are inside (see the drop table). It has normal block HP and no upgrades. Weak to pickaxes: breaks in 5 hits with a wooden pickaxe, 4 with stone, and 2 with iron or diamond. TNT and fireballs can break it unless it is covered with ceramic or obsidian."}, {"name": "Bee Net", "img": "images/items/bee-net.png", "desc": "Hold it to pick up bees. Bees go into your inventory as a separate item. You keep the net when you die, but you lose your bees."}], "abilities": [], "tables": [{"title": "Hive drop table", "head": ["Bees in hive", "Drops every", "Iron", "Diamond", "Emerald"], "rows": [["0", "10s", "100%", "0%", "0%"], ["1", "9.75s", "100%", "0%", "0%"], ["2", "9.5s", "100%", "0%", "0%"], ["3", "8.5s", "83%", "17%", "0%"], ["4", "7.5s", "69%", "28%", "4%"], ["5", "6.25s", "80%", "15%", "4%"], ["6", "4.5s", "78%", "14%", "8%"], ["7", "3.75s", "87%", "11%", "3%"], ["8", "2.75s", "76%", "12%", "12%"], ["9", "2.25s", "78%", "13%", "9%"], ["10", "2s", "74%", "13%", "12.5%"]], "note": "Each drop is 1 iron, 1 diamond or 1 emerald. Chances were measured from tests with 5 hives over 2 minutes 30 seconds, so they are estimates. Emeralds jump from about 4% to about 12% at 8 bees. A hive doesn't drop any faster after 10 bees, so a new hive is more beneficial."}], "bal": "bal", "balWhy": "It gives a lot of loot, but it's risky to use because the hive can be found and broken if you or your teammates aren't there to protect it.", "strategy": [{"title": "Don't go past 10 bees", "text": "Don't put more than 10 bees in a hive. Making a new hive is more beneficial."}, {"title": "Escape and slow chasers", "text": "Buy a ton of blocks so you can escape from people, and buy Gloop (35 iron) to slow down anyone chasing you. It slows them for 1 second and gives them Grounded for 10 seconds, so they can't use movement abilities or ender pearls."}, {"title": "Protect your hive", "text": "Surround your hive in ceramic early in the game, then replace it with obsidian so enemies can't place a Siege TNT on it."}], "counter": [{"title": "Break the hive early", "text": "If you see a Beekeeper collecting bees in the lobby, go for the hive while they aren't there. Do it early, before they have the emeralds to surround it with obsidian."}, {"title": "Keep resetting them", "text": "Keep killing the Beekeeper so they can't get any more bees in their hives."}], "skins": [{"name": "OG Chroma Skin", "img": "images/skins/beekeeper-beatrix-og-chroma.webp"}, {"name": "Meadow Skin", "img": "images/skins/beekeeper-beatrix-meadow.webp"}], "history": [{"type": "nerf", "date": "Mar 13, 2026", "title": "", "changes": ["Emerald and diamond drop rate reduced on lower level bee hive"]}, {"type": "buff", "date": "Jun 9, 2023", "title": "", "changes": ["Resource spawn rate: +25%"]}, {"type": "buff", "date": "Apr 7, 2023", "title": "", "changes": ["Beehive diamond drop level requirement reduced: 4 → 2 bees", "Beehive emerald drop level requirement reduced: 6 → 4 bees"]}, {"type": "nerf", "date": "Aug 5, 2022", "title": "", "changes": ["Emerald generation reduced by 40%", "Diamond generation reduced by 25%"]}, {"type": "buff", "date": "Jul 15, 2022", "title": "", "changes": ["Hive drops are no longer split between players"]}, {"type": "buff", "date": "Sep 24, 2021", "title": "", "changes": ["Bee spawn rate: 60s → 45s", "Buffed ore spawn rate"]}, {"type": "nerf", "date": "Aug 28, 2021", "title": "", "changes": ["Fixed Beekeeper spawning too many emeralds"]}]},
{"name": "Bekzat", "img": "images/kits/bekzat.webp", "cls": "Ranged", "tiers": {"casual": "A", "ranked": "A"}, "diff": "moderate", "hp": "100", "desc": "Summon a mythical falcon to dominate an area. Work in tandem to critically strike your companion's target with your feather light bows", "adv": "Bekzat's bows are Featherlight, so there is no slowdown while charging a shot. Shots deal normal bow damage, unless the Falcon is targeting the player you are shooting, then you deal increased damage.\nThe Falcon flies around the enemy it is targeting and attacks every 5 seconds. Its damage and HP go up as you buy better Featherlight bows (see the Falcon tiers table). With the Summon Falcon ability you can target any enemy within 60 blocks by aiming and clicking on them, and once it is out you can recall it with Recall Falcon.\nIf a player damages the Falcon, it won't heal unless you recall it, and then it heals 6% HP every second. If a player kills the Falcon, you have to wait 5 seconds before it starts recharging, and only once it is at half charge can you summon it again.", "items": [{"name": "Featherlight Headhunter", "img": "images/items/featherlight-headhunter.png", "note": "Cost: 25 emeralds", "desc": "No slowdown while charging. Upgrades the Falcon to tier 3: 20 damage and 250 HP.", "cd": 1.25, "dmg": 88, "dmgText": "88 (headshot 115.5)", "dpsText": "70.4 - 92.4"}, {"name": "Featherlight Crossbow", "img": "images/items/featherlight-crossbow.png", "note": "Cost: 8 emeralds", "desc": "No slowdown while charging. Upgrades the Falcon to tier 2: 18 damage and 200 HP.", "cd": 1.25, "dmg": 54.4}, {"name": "Featherlight Bow", "img": "images/items/featherlight-bow.png", "note": "Cost: 32 iron", "desc": "No slowdown while charging. Upgrades the Falcon to tier 1: 16 damage and 150 HP.", "cd": 0.625, "cdText": "0.625s - 1s", "dmg": 28.8, "nodps": true}], "abilities": [{"name": "Summon Falcon", "img": "images/abilities/ability-template.png", "cd": 5, "nodps": true, "desc": "Aim and click on any enemy within 60 blocks to send the Falcon after them. It flies around the enemy and attacks every 5 seconds. If it is killed, it starts recharging after 5 seconds, and you can only summon it again once it is at half charge."}, {"name": "Recall Falcon", "img": "images/abilities/ability-template.png", "cd": 3, "nodps": true, "desc": "Calls the Falcon back to you. While recalled it heals 6% HP every second. A Falcon that was damaged won't heal unless you recall it."}], "tables": [{"title": "Falcon tiers", "head": ["Tier", "Unlocked by", "Damage", "HP"], "rows": [["0", "No bow", "14", "100"], ["1", "Featherlight Bow", "16", "150"], ["2", "Featherlight Crossbow", "18", "200"], ["3", "Featherlight Headhunter", "20", "250"]], "note": "The Falcon attacks every 5 seconds. While it is targeting an enemy, you get +60% critical strike damage against that enemy."}], "passives": [{"name": "Featherlight", "when": "Charging a bow", "desc": "There is no slowdown while charging a shot."}, {"name": "Falcon Focus", "when": "Shooting the enemy your Falcon is targeting", "desc": "You get +60% critical strike damage against them."}], "strategy": [{"title": "Only send the Falcon when you have a target", "text": "Make sure to only have the Falcon out when you are targeting someone, otherwise it will be killed easily."}, {"title": "Use the bow", "text": "Most kits aren't worth buying a bow for, but Bekzat doesn't need to charge it, so he gets the highest amount of damage out of it."}], "counter": [{"title": "Shoot the Falcon", "text": "Always target the Falcon when you have a projectile weapon. If you kill it, Bekzat can't use it to target anyone, so he loses the +60% crit damage and becomes very weak for that time."}, {"title": "The Falcon is easy to kill", "text": "Killing the Falcon isn't that hard, so Bekzat is good but not uncounterable."}], "bal": "bal", "balWhy": "It costs a bit more to use, but the Falcon gives great stalling chip damage and he has really high projectile damage. The Falcon isn't that hard to kill, which keeps him good but not uncounterable.", "skins": [{"name": "Sailor Skin", "img": "images/skins/bekzat-sailor.webp"}]},
{"name": "Bounty Hunter", "img": "images/kits/bounty-hunter.webp", "cls": "Economy", "tiers": {"casual": "S", "ranked": "A"}, "diff": "moderate", "hp": "100", "desc": "Get assigned bounties for killing certain players in the match. Completing a bounty rewards a random amount of resources.", "adv": "A random player in the server is your target. Hunting Time marks your target on the map, but your target also sees your mark, so they know where you are and that they are your target. They can't see the mark if you don't click Hunting Time. You can reroll your target (random) every 60 seconds.\nKilling your bounty rewards iron and emeralds, but no diamonds, and the reward scales with how long the game has been going. If you hit your bounty and your teammate kills them, you get the reward too (there is a 5 to 10 second leeway).\nAfter you get a new bounty you have to wait 30 seconds before you can get another one, and that timer starts when you reroll. So if you reroll and kill your target quickly, you still wait out the 30 seconds. If you reroll and don't kill them within 30 seconds, then kill them after that, your next bounty appears right away and the 30 second timer starts again.\nYou level up by killing your bounty, and each level upgrades Hunting Time (see the level table).", "items": [], "abilities": [{"name": "Hunting Time", "img": "images/abilities/ability-template.png", "nodps": true, "desc": "Lasts 15 seconds. Marks your target on the map, but your target sees your mark too, so they know you are hunting them. Gives bonuses depending on your level: level 1 +5% damage to your target, level 2 +10%, level 3 the same damage plus +75% movement speed, level 4 the same as level 3 plus 10% less damage taken from and dealt to everyone who isn't your target while active.", "cd": 30}, {"name": "Reroll", "img": "images/abilities/ability-template.png", "cd": 60, "nodps": true, "desc": "Changes your target to a different random player. The 30 second wait before your next bounty starts when you reroll."}], "tables": [{"title": "Bounty levels", "head": ["Level", "Bounty kills needed", "Level up reward", "Hunting Time"], "rows": [["1", "-", "-", "+5% damage to your target"], ["2", "2", "50 iron", "+10% damage to your target"], ["3", "2", "2 emeralds", "+10% damage to your target and +75% movement speed (1.75x)"], ["4", "3", "4 emeralds", "Same as level 3, plus you take 10% less damage and deal 10% less damage to everyone who isn't your target while it's active"], ["5", "5", "-", "No new Hunting Time, but every target gives double rewards"]], "note": "Bounty kills needed is the number of bounty kills to reach that level from the level before it."}, {"title": "Bounty rewards by game time", "head": ["Game time", "Iron", "Emeralds"], "rows": [["0 - 2 min", "1 - 40", "1 (instead of iron)"], ["2 - 3 min", "30 - 60", "Unknown"], ["3 - 6 min", "about 40", "1 - 2"], ["6 - 10 min", "50 - 80", "1 - 3"], ["10 - 15 min", "125 - 250", "4 - 8"], ["15 - 20 min", "300+", "10 - 15"]], "note": "These are estimates, not exact numbers. The 2 - 3 minute iron range is a rough guess. They don't include the double rewards from level 5."}], "strategy": [{"title": "Don't use Hunting Time early", "text": "Don't activate Hunting Time early in the game. It does no damage, so it only tells your opponent that they are your target."}, {"title": "Use it from level 3", "text": "Use Hunting Time once you reach level 3 for the good speed boost. You can use it to run away from fights, not only to catch up to your target."}, {"title": "Get a crossbow fast", "text": "Save up for a crossbow as soon as you can. It helps you get to your targets really quickly."}], "counter": [{"title": "Reset before you get hit", "text": "If you know you are the target and haven't been hit, try resetting before the Bounty Hunter hits you so you don't feed."}], "bal": "bal", "balWhy": "It's really good in modes with fewer people, and a bit worse in modes with more people.", "skins": [{"name": "OG Chroma Skin", "img": "images/skins/bounty-hunter-og-chroma.webp"}, {"name": "Wanderer Skin", "img": "images/skins/bounty-hunter-wanderer.webp"}], "history": [{"type": "nerf", "date": "Aug 21, 2026", "title": "", "changes": ["Now can only receive 1 bounty request every 20 seconds"]}, {"type": "bal", "date": "Aug 14, 2026", "title": "Rework", "changes": ["Bounty Hunter gets iron and emeralds on completing a bounty. The reward is shown on the bounty poster.", "Bounty Hunter now has a progression system. Level up by completing bounties. On level up, gain extra resources and upgrade their ability!", "New Ability:", "Bounty Hunter track and focus on their current target for 15 seconds. Increase damage by 10% against their target but 10% less damage to other players.", "On level 2: Get 50 Iron, and increase the damage boost to target during ability by 20%", "On level 3: Get 2 Emerald, get 15% movement speed while the ability is active", "On level 4: Get 4 Emerald, get 10% damage reduction against other players while ability is active", "On level 5: Get 8 Emerald, Double all Bounty Reward"]}]},
{"name": "Builder", "img": "images/kits/builder.webp", "cls": "Defender", "tiers": {"casual": "B", "ranked": "B"}, "diff": "easy", "hp": "100", "desc": "Fortify blocks with extra health and blast protection using the Builder's hammer. Purchase the Hammer from the Item Shop.", "adv": "Builder spawns with a Builder Hammer and 8 Stone Bricks. The Stone Bricks are normal, so you still need to upgrade them. With the hammer you can upgrade blocks using iron or emeralds. Upgraded (reinforced) blocks are blast resistant and have 60% more durability, which makes them harder to break.\nIt takes about 8 TNT to break a single reinforced stone brick, while the other reinforced blocks still get one shot by TNT. Siege TNT still one shots, but it destroys fewer blocks when they are reinforced than when they aren't.\nThe hammer can also upgrade other kits' items, like Beekeeper Beatrix's Beehives.\nThe Bridge Printer is bought in the shop. Use the hammer and click the printer source to turn it on or off, and it stretches out blocks (see the Bridge Printer details).\nFun fact: the official kit description says to buy the Hammer from the Item Shop, but that is out of date. Builder used to need to buy it, and now spawns with it.", "items": [{"name": "Hammer", "img": "images/items/hammer.png", "desc": "Builder spawns with it. Upgrades blocks with iron or emeralds, making them blast resistant and giving them 60% more durability. Can also upgrade other kits' items, like Beekeeper Beatrix's Beehives. Click a Bridge Printer source with it to turn the printer on or off."}, {"name": "Bridge Printer Block", "img": "images/items/bridge-printer-block.png", "note": "Cost: 18 iron", "desc": "Stretches out up to 25 blocks, vertically or horizontally, and you can place up to 24. The source breaks in 2 hits with a wood or stone pickaxe and 1 hit with iron or diamond. The stretched blocks break in 1 hit with a wood pickaxe or better. You don't get it back when it breaks unless its extra blocks haven't been broken. Connected printers activate together with one click, and standing above or below several printers suffocates you."}], "abilities": [], "tables": [{"title": "Block upgrade costs", "head": ["Block", "Upgrade cost"], "rows": [["Wool", "2 iron"], ["Stone Brick", "6 iron"], ["Obsidian", "1 emerald"], ["Ceramic", "6 iron"], ["Tesla Coil", "147 iron"]], "note": "Upgraded blocks are blast resistant and have 60% more durability."}, {"title": "Bridge Printer", "head": ["Stat", "Value"], "rows": [["Cost", "18 iron"], ["Stretches", "25 blocks, vertical or horizontal"], ["Max placed", "24"], ["Source block breaks in", "2 hits with a wood or stone pickaxe, 1 hit with iron or diamond"], ["Stretched blocks", "1 hit with a wood pickaxe or better"]], "note": "You don't get the Bridge Printer back if you break it, unless its extra blocks haven't been broken or destroyed. You can break certain blocks to make it a certain length before you activate it. It only turns on or off when you are holding your hammer and click the printer source. If several printers are touching, they connect and all activate with one click, no matter which one you press. If you are standing above or below several printers, you will be suffocated."}], "bal": "sup", "balWhy": "Siege TNT completely obliterates Builder, so it could be changed to destroy fewer blocks when placed on reinforced ones. It's also a bit expensive: obsidian shouldn't cost 1 emerald to upgrade, and 100 iron would be a better price.", "counter": [{"title": "Place a Siege TNT", "text": "Just place a Siege TNT and the entire bed will be exposed, unless there is obsidian under it."}], "skins": [{"name": "Nutcracker Skin", "img": "images/skins/builder-nutcracker.webp"}], "strategy": [{"title": "Defend your bed early", "text": "Place your Stone Bricks around your bed as an early game defense, then upgrade them."}, {"title": "Use Bridge Printers as traps", "text": "Use Bridge Printers as traps, or to troll your teammates or enemies by suffocating them or voiding them."}], "history": [{"type": "buff", "date": "Jul 7, 2023", "title": "", "changes": ["Fortified block resistance: 1.35 → 1.45"]}, {"type": "buff", "date": "Jan 27, 2023", "title": "", "changes": ["Bridge Printer deploy time per scaffold: 0.1s → 0.05s"]}, {"type": "buff", "date": "Jan 20, 2023", "title": "Update", "changes": ["Added the Bridge Printer Block: hit it with your hammer to toggle a scaffold bridge"]}, {"type": "buff", "date": "Nov 18, 2022", "title": "", "changes": ["Reinforced blocks are more blast resistant"]}, {"type": "nerf", "date": "Sep 2, 2022", "title": "", "changes": ["Reinforced blocks are no longer blast proof (they still gain a lot of blast resistance)"]}, {"type": "buff", "date": "Nov 12, 2021", "title": "", "changes": ["Upgrading a block now gives blast protection", "Buffed upgraded block max health", "Slightly increased upgrade cost"]}]},
{"name": "Caitlyn", "img": "images/kits/caitlyn.webp", "cls": "Fighter", "tiers": {"casual": "C", "ranked": "S"}, "diff": "hard", "hp": "100", "desc": "Fulfill assassination contracts to empower your attacks with a deadly decay.", "adv": "Caitlyn's attacks apply decay, which deals 2 damage per second for 2 seconds. Hitting an enemy that is already decaying makes the decay 25% stronger per hit, up to double the base damage at 4 total hits. Contracts upgrade the decay so it hits harder, lasts longer, and gets special effects.\nPress R to open the contracts menu. It shows the stats of her Dark Decay (duration, damage and bonus effects) and three random players with their team color, armor type and distance in blocks. Pick one to assassinate and upgrade your ability. The target is highlighted in red, so you can see where they are, until they are killed (teammates can help) or you reject the contract, which you can do once every minute.\nBetter armor on the target gives better upgrades. Sometimes a special contract appears on a player with diamond armor or higher, and completing it gives your decay a special effect. The upgrade and its amount are shown on the contract screen. Amounts are random and scale with the target's armor and how long the game has gone on.", "items": [], "abilities": [{"name": "Open Contracts", "img": "images/abilities/ability-template.png", "nodps": true, "desc": "Press R to open the contracts menu. Choose one of 3 random players to assassinate and upgrade your decay. Reject the current contract once every minute."}], "tables": [{"title": "Contract upgrades", "head": ["Upgrade", "What it does", "Max"], "rows": [["Target Damage", "More damage to your current target", "25%"], ["Armor Penetration", "How much of your decay ignores armor", "75%"], ["Damage", "More decay damage per tick", "+10"], ["Duration", "Longer decay", "+5s"]]}, {"title": "Special contracts", "head": ["Effect", "What it does", "Appears when"], "rows": [["img:images/classes/support.png|Silence", "Healing on decaying enemies is reduced by 75%", "The target has diamond armor or higher and a Support kit"], ["img:images/classes/movement.png|Thrill of the Hunt", "+15% move speed when moving toward decaying enemies", "The target has diamond armor or higher and a Movement kit"], ["img:images/classes/tank.png|Dark Insight", "Heal for 50% of the decay damage you deal", "The target has diamond armor or higher and a Tank kit"], ["img:images/icons/decay.png|Assassin's Instinct", "Decay deals double damage to your active target", "The target has diamond armor or higher and is also a Caitlyn"], ["img:images/classes/economy.png|Bounty", "Killing your target gives you 2 emeralds", "The target has diamond armor or higher and an Economy kit"], ["img:images/icons/eye.png|Focus", "You take and deal +25% damage with your active target", "Passive: you get it whenever you select a target"], ["img:images/icons/diamond-helmet.png|Vulnerable", "Decaying enemies take +10% damage from all sources", "Any player in the server has diamond armor or higher, any kit"]], "note": "Special contracts only have a chance to appear. Except for Focus, they depend on the target's kit and armor. Info is from the wiki, not our own testing."}], "passives": [{"name": "Dark Decay", "when": "Hitting enemies", "desc": "Applies decay: 2 damage per second for 2 seconds. Each extra hit on a decaying enemy adds 25% strength, up to double damage at 4 hits."}], "strategy": [{"title": "Upgrade duration and damage", "text": "Focus on the decay duration and decay damage upgrades, or just choose the player nearest to you if they are close."}, {"title": "Get the Fire enchant", "text": "Always get the Fire enchant to deal a ton of tick damage."}, {"title": "Early crossbow", "text": "Focus on getting a crossbow early to make your life easier."}], "counter": [{"title": "Don't feed a diamond Caitlyn", "text": "Try not to die to a Caitlyn with diamond armor, as you might give her a special contract."}, {"title": "Block after the first hit", "text": "Caitlyn relies heavily on hitting multiple shots, so if you get hit once, build a wall to stop getting hit again."}], "bal": "adj", "balWhy": "It's only good in Ranked 5v5s, and even there it has fallen off a bit. In every other mode it's very weak, and it's very late game prone, which most games don't reach. It needs a rework.", "history": [{"type": "nerf", "date": "Jun 9, 2023", "title": "", "changes": ["Reduce initial decay duration: 4 → 3 seconds", "Reduce decay duration upgrade amounts", "Reduce decay damage upgrade amounts"]}, {"type": "nerf", "date": "May 26, 2023", "title": "", "changes": ["Reduced contract’s armor reward"]}, {"type": "buff", "date": "Feb 24, 2023", "title": "", "changes": ["Focus: Take and deal +20% damage when fighting active target", "You can now discard your active contract after 1 minute"]}]},

        }).join("")+'</div>' : '';
      };
      h += mk("Special abilities","a",abs,0)+mk("Special items","i",its,abs.length?22:0)+'<div class="adet" style="margin-top:20px">'+abCard(pick.a,pick.label)+'</div>'+
        (any ? '<p class="muted" style="margin-top:16px">DPS = damage × hits ÷ cooldown.</p>' : '');
    }
  }else if(S.tab==="hist"){
    h += histHtml(k);
  }else{
    var f = FUSIONS.filter(function(x){return x.a===k.name||x.b===k.name;});
    h += f.length ? f.map(function(x){return fusCard(k,x);}).join("") : '<p class="muted">No fusions listed for this kit yet.</p>';
  }
  d.innerHTML = h + '</div></div>';
  calcUpdate();
}
var lastSel = null;
function apply(){
  var h = ""; try{ h = decodeURIComponent(location.hash.slice(1)); }catch(e){}
  S.sel = KITS.filter(function(k){return slug(k.name)===h;})[0] || null;
  if(S.sel !== lastSel){ S.tab = "info"; S.skins = false; S.skin = -1; S.pick = ""; lastSel = S.sel; }
  renderDetail();
  $("browse").hidden = !!S.sel;
  if(S.sel) window.scrollTo(0,0);
}
function go(s){ if(location.hash.slice(1)===s) apply(); else location.hash = s; }

var strip = $("strip"), down = false, sx = 0, sl = 0, moved = false;
strip.addEventListener("pointerdown",function(e){ if(e.pointerType!=="mouse") return; down = true; moved = false; sx = e.clientX; sl = strip.scrollLeft; });
window.addEventListener("pointermove",function(e){ if(!down) return; var d = e.clientX - sx; if(Math.abs(d)>4) moved = true; strip.scrollLeft = sl - d; });
window.addEventListener("pointerup",function(){ down = false; setTimeout(function(){ moved = false; },0); });

$("q").oninput = function(){ S.q = this.value; renderList(); };
$("q").onkeydown = function(e){
  if(e.key==="Enter"){ var q = S.q.trim().toLowerCase(), m = matches(); var ex = m.filter(function(k){return k.name.toLowerCase()===q;})[0]; if(ex||m[0]) go(slug((ex||m[0]).name)); }
  if(e.key==="Escape"){ this.value = ""; S.q = ""; renderList(); }
};

function placeTip(w){
  var tip = w && w.querySelector(".baltip"), bd = w && w.querySelector(".bal"); if(!tip||!bd) return;
  var r = bd.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  var W = Math.min(330, vw-24), h = tip.offsetHeight;
  var left = Math.max(12, Math.min(r.left, vw-W-12));
  var top = r.bottom + 10;
  if(top + h > vh - 12){ var up = r.top - 10 - h; top = up >= 12 ? up : Math.max(12, vh - 12 - h); }
  tip.style.left = left+"px"; tip.style.top = top+"px";
}
function placeOpenTip(){ placeTip(document.querySelector(".balwrap:hover, .balwrap:focus-within, .balwrap.open")); }
document.addEventListener("mouseover",function(e){ var w = e.target.closest && e.target.closest(".balwrap"); if(w) placeTip(w); });
document.addEventListener("focusin",function(e){ var w = e.target.closest && e.target.closest(".balwrap"); if(w) placeTip(w); });
window.addEventListener("scroll",placeOpenTip,{passive:true});
window.addEventListener("resize",placeOpenTip);
document.addEventListener("click",function(e){
  var t = e.target.closest("[data-kit],[data-mode],[data-cls],[data-tier],[data-bal],[data-tab],[data-skin],[data-pick],[data-act]");
  if(moved) return;
  var inSk = !!e.target.closest(".skwrap"), ds = t ? t.dataset : null, inDetail = !!(t && t.closest("#detail"));
  if(S.skins && !inSk){ S.skins = false; renderDetail(); }
  var bw = e.target.closest(".balwrap");
  Array.prototype.forEach.call(document.querySelectorAll(".balwrap.open"),function(w){ if(w!==bw) w.classList.remove("open"); });
  if(bw && e.target.closest("[data-baltoggle]")){ bw.classList.toggle("open"); placeTip(bw); return; }
  if(!t) return;
  if("mode" in ds){
    S.mode = ds.mode; try{ localStorage.setItem("bwMode",S.mode); }catch(x){}
    if(inDetail && ds.tier){ S.tier = ds.tier; renderList(); history.replaceState(null,"",location.pathname+location.search); apply(); $("browse").scrollIntoView({block:"start"}); }
    else{ renderList(); renderDetail(); }
  }
  else if("kit" in ds){ go(ds.kit); }
  else if("cls" in ds || "tier" in ds){
    var key = "cls" in ds ? "cls" : "tier";
    S[key] = (S[key]===ds[key]) ? "" : ds[key];
    renderList();
    if(inDetail){ history.replaceState(null,"",location.pathname+location.search); apply(); $("browse").scrollIntoView({block:"start"}); }
  }
  else if("bal" in ds){
    S.bal = (S.bal===ds.bal) ? "" : ds.bal; renderList();
    if(inDetail){ history.replaceState(null,"",location.pathname+location.search); apply(); $("browse").scrollIntoView({block:"start"}); }
  }
  else if("pick" in ds){ S.pick = ds.pick; renderDetail(); }
  else if("tab" in ds){ S.tab = ds.tab; renderDetail(); }
  else if("skin" in ds){ S.skin = +ds.skin; S.skins = false; renderDetail(); }
  else if(ds.act==="skins"){ S.skins = !S.skins; renderDetail(); }
  else if(ds.act==="close"){ history.replaceState(null,"",location.pathname+location.search); apply(); window.scrollTo(0,0); }
});
window.addEventListener("keydown",function(e){ if(e.key==="Escape" && S.skins){ S.skins = false; renderDetail(); } });
window.addEventListener("hashchange",apply);
try{ var sm = localStorage.getItem("bwMode"); if(MODES.some(function(m){return m.id===sm;})) S.mode = sm; }catch(x){}
renderList(); apply();
</script>
</body>
</html>
