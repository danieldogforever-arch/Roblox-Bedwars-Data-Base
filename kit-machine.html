<style>
:root{--bg:#0a0418;--card:#150b38;--soft:rgba(255,255,255,.07);--line:rgba(255,255,255,.28);--text:#fff;--muted:#b9aee0;--accent:#a98bff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;font-weight:400}
body{margin:0;min-height:100vh;color:var(--text);font:400 1.05rem/1.5 "Jua","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 15% 8%,rgba(110,60,220,.35),transparent 40%),radial-gradient(circle at 85% 92%,rgba(120,50,230,.3),transparent 45%),radial-gradient(circle,rgba(255,255,255,.4) 1px,transparent 1.6px) 0 0/87px 87px,radial-gradient(circle,rgba(180,156,255,.32) 2px,transparent 2.8px) 37px 51px/131px 131px,var(--bg);background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:2.8rem;margin:0;line-height:1.1}
h2{font-size:1.7rem;margin:0;line-height:1.2}
h3{font-size:1.2rem;margin:22px 0 6px}
p{margin:0 0 12px}.muted{color:var(--muted)}
.lead{margin:6px 0 0}
.chg{display:inline-block;flex:none;vertical-align:middle}
.hist{position:relative;margin-top:6px;padding-left:4px}

.hbody{flex:1;min-width:0;background:var(--soft);border-radius:16px;padding:12px 16px}

.htag.t-buff{background:#5fe3a1}.htag.t-nerf{background:#ff7a8e}.htag.t-bal{background:#ffd166}
.hdate{color:var(--muted);font-size:.9rem}

.hlist{margin:8px 0 0;padding-left:20px}

.hkey span{display:inline-flex;align-items:center;gap:7px}

.stat.obtain .osrc b{font-size:1rem;line-height:1.25}
.stat.obtain .otier{display:block;color:var(--muted);font-size:.9rem}
.stat.obtain .ocost{font-size:.92rem;margin-top:6px;color:#ffe08a}
.stat.obtain .ocost span{color:var(--muted);margin-right:6px}
.stat.obtain .ocost{display:flex;align-items:center;gap:0}
.stat.obtain .ocost span{min-width:44px}
.stat.obtain .ocost img{width:20px;height:20px;margin-right:6px;object-fit:contain}
.topnav{display:flex;gap:18px;font-size:.95rem;margin-bottom:14px}
.topnav a{color:var(--muted);text-decoration:none}
.topnav a:hover,.topnav a:focus-visible{color:#fff}
#detail{position:relative;z-index:5}
.box{background:rgba(18,8,48,.55);border:4px solid #fff;padding:24px;margin-top:26px}
.label{color:var(--muted);font-size:.95rem;margin:18px 0 8px}
#q{width:100%;font:inherit;font-size:1.3rem;padding:14px 16px;background:var(--card);color:#fff;border:3px solid #fff;border-radius:14px}
#q::placeholder{color:var(--muted)}
button{font:inherit;color:#fff;cursor:pointer}
button:focus-visible,#q:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#strip{display:flex;gap:12px;overflow-x:auto;padding:16px 2px 6px;cursor:grab;user-select:none;scrollbar-width:thin}
#strip.off{display:none}
.sitem{flex:none;display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:8px 18px 8px 8px;text-align:left}
.sitem:hover,.card:hover{border-color:#fff}
.sitem small{display:block;color:var(--muted);font-size:.85rem;line-height:1.2}
.th{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;background:#0d0626;border:2px solid #fff}
.th img,.pic img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.6em}
.cchip{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border:0;border-radius:99px;padding:6px 16px}
.cchip.on{background:#fff;color:#12082e}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.cico{width:26px;height:26px;object-fit:contain;filter:brightness(0) invert(1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:16px;padding-top:6px}
.card{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.card .th{width:100%;height:auto;aspect-ratio:1;font-size:1.4rem}
.card b{display:block;margin-top:8px;line-height:1.15}
.card small{color:var(--muted)}
.dm{display:inline-block;width:12px;height:12px;border:2px solid #fff;border-radius:3px;transform:rotate(45deg);background:var(--c);margin:0 7px 0 3px;vertical-align:0}
.card .dm{position:absolute;top:2px;right:2px;margin:0;width:16px;height:16px;z-index:1}
.easy{--c:#5fe3a1}.moderate{--c:#ffd166}.hard{--c:#ff6b81}.extreme{--c:#a98bff}
.dgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px}
@media(max-width:780px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dgrid>*{min-width:0}
.row h2{min-width:0;overflow-wrap:break-word}
.row .btn{flex:none;white-space:nowrap}
@media(max-width:560px){
  .wrap{padding-left:12px;padding-right:12px}
  .box{padding:16px}
  .tabs{gap:4px 18px}
  .tab{font-size:1.05rem}
  .row .btn{padding:6px 12px;font-size:.95rem}
  .dleft{padding-right:0}
  .ptable{font-size:.9rem}
  .ptable th,.ptable td{padding:6px 5px}
  .ptable td:first-child{white-space:normal}
  .ptable .ticon{display:block;margin:0 0 4px}
}
html,body{overflow-x:hidden}
.pic{aspect-ratio:1;border:4px solid #fff;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:6rem}
.cap{text-align:center;margin-top:8px;color:var(--muted);min-height:1.5em}
.picwrap{position:relative}
.adet{margin-bottom:8px}
.dock{display:flex;flex-wrap:wrap;gap:14px 12px;align-items:flex-start}
.slot{align-self:flex-start;display:block;width:92px;background:none;border:0;padding:0;text-align:center;font-size:.8rem;line-height:1.15;color:var(--muted)}
.slot .aico{width:92px;height:92px;border:2px solid transparent}
.slot.on .aico{border-color:#fff;background:rgba(255,255,255,.16)}
.slot.on{color:#fff}
.slot:hover .aico{border-color:var(--line)}
.slot span{display:block;margin-top:6px;overflow-wrap:anywhere}
.dleft{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:4px}
@media(max-width:780px){.dleft{position:static;max-height:none;overflow:visible}}
.dleft .stats{grid-template-columns:repeat(2,minmax(0,1fr));margin:16px 0 0}
.dleft .stat{min-width:0}
.dleft .stat b,.dleft .cbtn{font-size:1.15rem;overflow-wrap:anywhere}
.dleft .cbtn .cico{width:30px;height:30px;flex:none}
@media(max-width:780px){.dleft{position:static}}
.wbtn{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:14px;background:rgba(8,3,26,.88);border:2px solid #fff;display:flex;align-items:center;justify-content:center;padding:0;z-index:3}
.wbtn.on{background:#fff;color:#12082e}
.wbtn img{width:30px;height:30px;object-fit:contain}
.wbtn i{position:absolute;right:-8px;bottom:-8px;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:#12082e;font-style:normal;font-size:.8rem;line-height:22px;text-align:center;padding:0 5px}
.skpanel{position:absolute;top:66px;left:10px;right:10px;z-index:4;background:rgba(8,3,26,.97);border:3px solid #fff;border-radius:16px;padding:16px 16px 20px;max-height:320px;overflow:auto}
.skpanel .t{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 10px;align-items:start}
.skgrid .sk{font-size:.7rem;line-height:1.1}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 16px}
.btn:hover{border-color:#fff}.btn.on{background:#fff;color:#12082e}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.sk{background:none;border:0;padding:0;text-align:center;font-size:.8rem;color:var(--muted);align-self:start;display:block}

.sk.on .th{border-color:var(--accent)}.sk.on{color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0 4px}
.stat{background:var(--soft);border-radius:14px;padding:12px 14px}
.stat>span{display:block;color:var(--muted);font-size:.85rem;margin-bottom:2px}

.cbtn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.cbtn .cico{width:38px;height:38px}
.tabs{display:flex;flex-wrap:wrap;gap:6px 26px;margin:24px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 2px;margin-bottom:-1px;color:var(--muted);font-size:1.15rem}
.tab.on{color:#fff;border-color:#fff}
.ab{display:flex;gap:16px;background:var(--soft);border-radius:16px;padding:14px;margin-bottom:14px}
.aico{width:84px;height:84px;flex:none;border-radius:14px;background:rgba(255,255,255,.07);padding:6px;font-size:2.6rem}
.aico .ph{background:none!important}
.aico img{width:100%;height:100%;object-fit:contain;display:block}
.tag{background:var(--accent);color:#12082e;border-radius:6px;padding:0 9px;font-size:.8rem;margin-right:10px}
.nm{font-size:1.25rem}
.modebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.mbtn{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 20px;font-size:1.1rem}
.mbtn small{opacity:.7;margin-left:8px;font-size:.85rem}
.mbtn:hover{border-color:#fff}.mbtn.on{background:#fff;color:#12082e}
.tpair{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.tbtn{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:4px 14px;text-align:center;min-width:92px}
.tbtn small{display:block;font-size:.75rem;color:var(--muted)}.tbtn b{font-size:1.4rem;line-height:1.2}
.tbtn:hover{border-color:#fff}.tbtn.on{background:#fff;color:#12082e}.tbtn.on small{color:#4a3d7a}
.dleft .stat.wide{grid-column:1/-1}
.cost{display:flex;align-items:center;gap:8px;width:fit-content;margin:10px 0 4px;padding:5px 14px 5px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:1rem;line-height:1}
.cost img{height:22px;width:auto;max-width:30px;object-fit:contain;display:block}
.cost b{font-weight:400;background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cost.emerald{background:rgba(60,200,120,.12);border-color:rgba(110,235,160,.35)}
.cost.emerald b{background-image:linear-gradient(90deg,#b6ffd2,#4be08a 55%,#1fa862)}
.cost.iron{background:rgba(220,225,235,.1);border-color:rgba(230,235,245,.3)}
.cost.iron b{background-image:linear-gradient(90deg,#ffffff,#d5d9e0 55%,#9aa1ac)}
.calc input{width:96px;background:var(--soft);color:inherit;font:inherit;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 10px}
.calc .cres{font-size:1.4rem;margin-left:6px}
.calc .cnote{font-size:.85rem;opacity:.7;margin-left:6px}
.dslots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.dslot{display:flex;flex-direction:column;gap:4px;font-size:.85rem}.dslot select{background:var(--soft);color:inherit;font:inherit;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 8px}.dslot select option{background:#1d1238}.dicons{display:flex;gap:6px;margin:12px 0 4px;min-height:4px}.dicons img{width:44px;height:44px;border-radius:8px}.dres .nums{margin-top:6px}
.ctable{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:12px}
.ctable span{background:rgba(255,255,255,.07);border-radius:8px;padding:4px 10px;font-size:.88rem}
.ctable b{font-weight:400;color:var(--accent)}

.bal{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:999px;padding:5px 16px 5px 5px;font-size:1.05rem;line-height:1.1;color:var(--fg);background:var(--g);box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,255,255,.55);text-align:left;cursor:pointer}

.bal svg,.cbal svg,.bchip svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.balwrap{position:relative;display:inline-block;max-width:100%}
.baltip{display:none;position:fixed;left:12px;top:12px;z-index:60;width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(8,3,26,.98);border:2px solid #fff;border-radius:14px;padding:12px 14px;font-size:.95rem;line-height:1.35;text-align:left;white-space:pre-line;box-shadow:0 8px 24px rgba(0,0,0,.5)}

.balwrap:hover .baltip,.balwrap:focus-within .baltip,.balwrap.open .baltip{display:block}
.balnone{color:var(--muted);font-size:1.05rem}

.bchip .bi svg{width:14px;height:14px}
.bchip.on{background:#fff;color:#12082e}
.bkey{margin-top:14px;background:var(--soft);border-radius:14px;padding:10px 14px}

.bkey .brow{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}

.ptable th,.ptable td{padding:7px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.12)}

.ptable td.hl{color:#7dffb0}

.ptable td:first-child{white-space:nowrap}
.cond{display:inline-block;margin-top:6px;background:rgba(255,255,255,.14);border-radius:8px;padding:1px 10px;font-size:.9rem}

.fus{background:var(--soft);border-radius:18px;padding:18px;margin-bottom:16px}

.plus{font-size:2.6rem;line-height:1}

<div class="wrap">
  <h1>Kit Machine</h1>
  <p class="muted lead">Type a kit name, pick one from the bar, or browse by class and tier.</p>
  <div id="modebar" class="modebar" role="group" aria-label="Tier list"></div>

  <div class="box">
    <input id="q" type="text" placeholder="Type a kit name…" autocomplete="off" aria-label="Search kits">
    <div id="strip" class="off" aria-label="Matching kits"></div>
  </div>

  <div id="detail" class="box" hidden></div>

{"name": "Arachne", "img": "images/kits/arachne.webp", "cls": "Movement", "tiers": {"casual": "B", "ranked": "C"}, "diff": "easy", "hp": "100", "desc": "The Spider Queen uses web bridges to traverse the map and can summon spiderlings from her webs to attack enemies. Enemies are slowed if they run into her webs.", "adv": "Arachne shoots webs that slow enemies down and double as a bridge only you and your Arachne teammates can use. Enemies who touch cobwebs are slowed by a lot, and the more cobwebs they touch, the slower they get.\nYou can summon spiders while you have webs placed. You get 1 to 4 spiders depending on how many cobwebs are up, so 1 cobweb gives 1 spider and 4 or more cobwebs give 4. Spiders disappear after 6 seconds. Each spider spawns with 30 HP and deals 4 damage every 0.5 seconds. When a spider kills or assists on an enemy, its damage and HP go up, to a max of 80 HP and 15 damage.", "items": [], "abilities": [{"name": "Aim Web Bridge", "img": "images/abilities/ability-template.png", "desc": "Shoots a web in any direction with a 17 block line radius. Enemies who touch the cobwebs are slowed by a lot, and the slow builds up the more cobwebs they touch. You can jump onto the cobwebs and use them as a bridge, but only you and other Arachne teammates can use it.", "cd": 8}, {"name": "Spider Summon", "note": "Only while webs are present", "img": "images/abilities/ability-template.png", "desc": "Summons 1 to 4 spiders from your webs, depending on how many cobwebs are up (1 cobweb = 1 spider, 4 or more = 4). Spiders last 6 seconds before they disappear. Each spider spawns with 30 HP and deals 4 damage every 0.5 seconds. A spider that kills or assists on an enemy gains damage and HP, up to 80 HP and 15 damage.", "cd": 10, "dmg": 4, "dmgText": "4 per hit (every 0.5s)", "nodps": true}], "passives": [{"name": "Sticky Webs", "when": "When enemies touch cobwebs", "desc": "Enemies are slowed by a lot, and the slow gets stronger the more cobwebs they touch."}, {"nam {"name": "Archer", "img": "images/kits/archer.webp", "cls": "Ranged", "tiers": {"casual": "C", "ranked": "C"}, "diff": "hard", "hp": "100", "desc": "Can headshot with bows, crossbows and headhunters, which normally can't! Deal 12.5% more projectile damage and gain access to the Tactical Crossbow in the Item Shop.", "adv": "Normal bows and crossbows can't headshot, but Archer can headshot with the Bow, Crossbow and Headhunter. Archer also deals extra damage with each of them. The Tactical Crossbow and Tactical Headhunter are cheaper for Archer, at 6 emeralds and 21 emeralds. Each weapon's damage, cooldown and bonus over normal damage are listed under Abilities and items.", "items": [{"name": "Bow", "desc": "Damage depends on how long you charge it.\nLowest charge: 10 damage (15 headshot), 0.625 second cooldown.\nHighest charge: 20 damage (30 headshot), 1 second cooldown.\nBodyshots deal 12.50% more damage than normal, and headshots deal 79.89% more.", "cd": 0.625, "cdText": "0.625s - 1s", "dmg": 20, "dmgText": "10 - 20 (headshot 15 - 30)", "nodps": true, "img": "images/items/bow.png", "note": "Cost: 24 iron"}, {"name": "Tactical Crossbow", "img": "images/items/tactical-crossbow.png", "note": "Cost: 6 emeralds", "desc": "Cheaper for Archer. Deals 42.75 damage (64 headshot) with a 1.3 second cooldown.\nBodyshots deal 25.74% more damage than normal, and headshots deal 88.59% more.", "cd": 1.3, "dmg": 42.75, "dmgText": "42.75 (headshot 64)", "dpsText": "34.2 - 51.2"}, {"name": "Tactical Headhunter", "img": "images/items/tactical-headhunter.png", "note": "Cost: 21 emeralds", "desc": "Cheaper for Archer. Deals 67.5 damage (101.25 headshot) with a 1.3 second cooldown.\nBodyshots and headshots both deal 22.73% more damage than normal.", "cd": 1.3, "dmg": 67.5, "dmgText": "67.5 (headshot 101.25)", "dpsText": "54.0 - 81.0"}], "abilities": [], "passives": [{"name": "Headshots", "when": "Always", "desc": "Archer can headshot with the Bow, Crossbow and Headhunter. Normal bows and {"name": "Baker", "img": "images/kits/baker.webp", "cls": "Support", "tiers": {"casual": "S", "ranked": "S"}, "diff": "easy", "hp": "100", "desc": "Gain access to health-gain apples, speed-boost pies, and spawn with a knockback baguette!", "adv": "Baker always spawns with the Knockback Baguette and can store it in chests for teammates to pick up. Baker can also drop all of its items for teammates, and they have the same capacities.\nApples, Golden Apples and Speed Pies are bought in the shop. Eating an apple slows you down while you eat.\nA Golden Apple heals 175 HP in total: 30 instantly, then 5 HP every 0.5 seconds for 15 seconds (145 HP), along with 5% damage reduction until it runs out.", "items": [{"name": "Health Apple", "img": "images/items/health-apple.png", "note": "Cost: 40 iron", "desc": "Max 3. Heals 20 HP. Takes 0.8 seconds to eat, and you move slower while eating."}, {"name": "Speed Pie", "img": "images/items/speed-pie.png", "note": "Cost: 2 emeralds", "desc": "Unlimited capacity. Gives 100 seconds of speed that increases your movement speed by 27.5% (1.275x). Takes 0.8 seconds to eat."}, {"name": "Golden Apple", "img": "images/items/golden-apple.png", "note": "Cost: 3 emeralds", "desc": "Max 3. Takes 1 second to eat, and you move slower while eating. Heals 30 HP instantly, then 5 HP every 0.5 seconds for 15 seconds (145 HP), plus 5% damage reduction until it runs out. 175 HP in total."}, {"name": "Knockback Baguette", "img": "images/items/knockback-baguette.png", "desc": "Baker always spawns with it. Deals 1 damage and 4 blocks of knockback. Can be stored in chests for teammates to pick up.", "dmg": 1}], "abilities": [], "bal": "op", "balWhy": "For 3 emeralds you are basically unkillable, unless the other team has enchants and gets lucky and rolls static. Coils aren't much of a counter because they aren't mobile. Healing more than double your HP for 3 emeralds is insane, and with the Speed Pie, which outclasses most movement kits, it's a bit crazy.\nSuggested changes: keep the healing the same but tick every 0.75s instead of 0.5s, which makes it easier to deal with in fights. Raise the damage reduction by another 5% to make up for it, and nerf the Speed Pie to 1.75x movement instead of 2x.", "passives": [{"name": "Knockback Baguette", "when": "Always", "desc": "Baker always spawns with the Knockback Baguette and can store it in chests for teammates to pick up."}, {"name": "Team Supplies", "when": "Always", "desc": "Baker can drop all of its items for teammates, and they have the same capacities."}], "strategy": [{"title": "Loot early", "text": "Focus on loot early in the game. If you have the emeralds, buy a Speed Pie to get diamonds quicker."}, {"title": "Dominate at tier 3", "text": "Once you reach tier 3, you can dominate with all the OP items."}, {"title": "Pair it with Berserker", "text": "Combine Baker with Berserker to simply be unkillable, even when static'd."}], "counter": [{"title": "Coil your base", "text": "Place coils in your base so Baker gets heavily nerfed when it arrives."}], "skins": [{"name": "Spirit Skin", "img": "images/skins/baker-spirit.webp"}, {"name": "Loveseeker Skin", "img": "images/skins/baker-loveseeker.webp"}], "history": [{"type": "nerf", "date": "Oct 17, 2025", "title": "", "changes": ["Apple Consume Time: 1 → .8", "Golden Apple Consume Time: .5 → 1", "Golden Apple Instant Heal: 40 → 30", "Speed Pie Duration: 125 → 100 sec"]}, {"type": "nerf", "date": "May 2, 2025", "title": "", "changes": ["Increased the consume time of apples: 0.8s → 1s", "Decreased the max stack size of apples and golden apples: 4 → 3"]}, {"type": "bal", "date": "Nov 22, 2024", "title": "", "changes": ["Spawns with a knockback baguette", "Increased knockback of knockback baguette", "Golden Apple damage reduction 15% → 5%", "Golden Apple health regen per tick 10hp → 5hp", "Golden Apple price 6 emeralds → 3 emeralds"]}, {"type": "nerf", "date": "Oct 25, 2024", "title": "", "changes": ["Speed Pie speed multiplier: 1.24x → 1.275x", "Speed Pie duration: 150s → 125s", "Apple heal: 18 → 20 health"]}, {"type": "buff", "date": "Nov 3, 2023", "title": "", "changes": ["Decreased speed pie price 3 emeralds → 2 emeralds", "Decreased golden apple price 7 emeralds → 6 emeralds"]}, {"type": "nerf", "date": "Feb 24, 2023", "title": "", "changes": ["Gold apple price: 5 emeralds → 7 emeralds", "Apple price: 30 iron → 40 iron"]}, {"type": "buff", "date": "Feb 10, 2023", "title": "", "changes": ["Added the Golden Apple"]}, {"type": "nerf", "date": "Jan 27, 2023", "title": "", "changes": ["Apple heal: 22 → 18", "Pie speed boost: 30% → 24%"]}, {"type": "bal", "date": "Sep 30, 2022", "title": "", "changes": ["Speed Pie price: 2 ems → 3 ems", "Speed Pie duration: 2m → 2.5m", "Apple healing: 25 → 22"]}, {"type": "buff", "date": "Sep 2, 2022", "title": "", "changes": ["Speed Pie duration increased (1.5m → 2m)"]}, {"type": "nerf", "date": "Jul 8, 2022", "title": "", "changes": ["Apple healing: 30 HP → 25 HP", "You can now only hold up to 4 apples at once"]}, {"type": "buff", "date": "Sep 24, 2021", "title": "", "changes": ["Speed pie bonus: 20% → 30%", "Apple heal: 20 → 30"]}], "obtain": {"src": "Kit Shop", "buy": 10000, "rent": 1500}},
{"name": "Barbarian", "img": "images/kits/barbarian.webp", "cls": "Fighter", "tiers": {"casual": "S", "ranked": "B"}, "diff": "hard", "hp": "100", "desc": "Build rage by damaging enemies. Instead of buying swords, your sword is upgraded when you reach enough rage. You lose all your rage on death. The Emerald Sword is replaced by the Rageblade.", "adv": "Barbarian cannot buy swords. You start with a wooden sword and upgrade it by building rage, which you get from dealing damage and from kills. Once upgraded, your sword never goes back to the previous one when you die.\nDamage needed for each upgrade:\nStone sword: 85\nIron sword: 210\nDiamond sword: 430\nRageblade: 650\nYour rage resets each time you upgrade, so you need 1375 damage in total.\nRanged damage gives 2x less rage than other damage. Killing an enemy gives you around 40 damage worth of rage. You cannot get rage from enemies who respawned within the last 9 seconds.\nWhen you die you lose all your rage and restart the tier you are on.", "items": [{"name": "Rageblade", "img": "images/items/rageblade.png", "note": "Rage needed: 650 damage", "desc": "Replaces the Emerald Sword. Deals 70 damage with a 0.25 second cooldown.", "cd": 0.25, "dmg": 70}], "abilities": [], "bal": "adj", "balWhy": "It is really good in casuals but terrible in ranked. A fix could be giving its normal swords more attack speed, so it isn't just \"no kit\". That wouldn't change much for casuals, but in ranked it would become a unique kit that attacks faster after each hit, up to a cap. The Rageblade wouldn't change, only the other swords.", "passives": [{"name": "No Sword Shop", "when": "Always", "desc": "Barbarian cannot buy swords. You start with a wooden sword and upgrade it by building rage."}, {"name": "Rage", "when": "When you deal damage or kill", "desc": "Damage and kills build rage. Ranged damage gives 2x less rage, and a kill gives around 40 damage worth of rage. You get no rage from enemies who respawned within 9 seconds."}, {"name": "Sword Upgrades", "when": "At 85, 210, 430 and 650 rage", "desc": "Reaching each rage amount upgrades your sword: stone, iron, diamond, then Rageblade. Rage resets on every upgrade, and you need 1375 damage in total."}, {"name": "Death Penalty", "when": "On death", "desc": "You lose all your rage and restart the tier you are on, but your sword never goes back to the previous one."}], "strategy": [{"title": "Early game", "text": "Get armor unless you are getting rushed. Make sure you don't die to the first enemy rush, or you will be at a disadvantage for the rest of the match."}, {"title": "Midgame", "text": "Look for tanky enemies with lots of HP to farm rage off of."}, {"title": "After the Rageblade", "text": "Play safe and don't risk dying, because the chances of getting a Rageblade again are low."}], "counter": [{"title": "Early game Barbarian", "text": "Don't give it the damage it needs for a stone sword."}, {"title": "Late game Barbarian", "text": "If it has a diamond sword, focus it and make sure it is constantly reset, because getting a Rageblade that early is not good for the whole lobby."}], "skins": [{"name": "Deep Void Skin", "img": "images/skins/barbarian-deep-void.webp"}, {"name": "Barbunny Skin", "img": "images/skins/barbarian-barbunny.webp"}, {"name": "Corrupted Skin", "img": "images/skins/barbarian-corrupted.webp"}, {"name": "Dynasty Skin", "img": "images/skins/barbarian-dynasty.webp"}, {"name": "Victorious Skin", "img": "images/skins/barbarian-victorious.webp"}], "history": [{"type": "buff", "date": "Sep 18, 2026", "title": "", "changes": ["Stone sword rage requirement: 90 → 85", "Iron sword rage requirement: 280 → 270"]}, {"type": "buff", "date": "May 8, 2026", "title": "", "changes": ["Increased rage gain if enemy gear is stronger than barbarian, up to 50%"]}, {"type": "bal", "date": "Sep 5, 2025", "title": "", "changes": ["Barbarian now loses all progress on the current sword tier, but can not drop below the current sword, except if the current sword is a Rageblade"]}, {"type": "buff", "date": "Jul 18, 2025", "title": "", "changes": ["Lose less rage at lower sword tiers", "Rebalanced a wide range of kits to adjust for the combat changes."]}, {"type": "nerf", "date": "May 30, 2025", "title": "", "changes": ["Reduced Rage gained from damage by 10%"]}, {"type": "bal", "date": "May 3, 2024", "title": "", "changes": ["Lowered rage requirements for swords", "Reduced rage by half for projectiles"]}, {"type": "buff", "date": "Feb 2, 2024", "title": "", "changes": ["Lower rage required to upgrade to a diamond sword 750 → 700", "Lower rage required to upgrade to an iron sword 325 → 300"]}, {"type": "buff", "date": "May 19, 2023", "title": "", "changes": ["Reduced Stone Sword rage cost: 120 → 100", "Reduced Iron Sword rage cost: 350 → 325"]}, {"type": "buff", "date": "Feb 10, 2023", "title": "", "changes": ["Rageblade damage: 65 → 70"]}, {"type": "buff", "date": "Sep 2, 2022", "title": "", "changes": ["Unlock the stone & iron sword slightly faster"]}, {"type": "nerf", "date": "Feb 11, 2022", "title": "", "changes": ["Increased rage required for Iron Sword, Diamond Sword and Rageblade"]}, {"type": "buff", "date": "Oct 2, 2021", "title": "", "changes": ["Reduced rage requirements for sword upgrades"]}, {"type": "bal", "date": "Jul 5, 2021", "title": "", "changes": ["Barbarian now has a unique Rageblade sword that replaces the Emerald Sword"]}, {"type": "buff", "date": "Jun 28, 2021", "title": "", "changes": ["Gain rage on kill", "Reduced diamond and emerald sword rage requirements"]}], "obtain": {"src": "Kit Shop", "buy": 10000, "rent": 1500}},
{"name": "Beekeeper Beatrix", "img": "images/kits/beekeeper-beatrix.webp", "cls": "Economy", "tiers": {"casual": "C", "ranked": "S"}, "diff": "hard", "hp": "100", "desc": "Catch bees around the map to upgrade your Bee Hive. Upgrading your Bee Hive will return additional iron and emeralds.", "adv": "Bees spawn around the map, similar to Alchemist's ingredients but not as many, and the amount depends on the map. A bee on the ground disappears 3 minutes after it spawns, and bees pulse every 7 seconds so they are easier to find. Hold the Bee Net to pick a bee up: it goes into your inventory as a separate item, then you put it in a Beehive. You lose your bees when you die, but you keep the net. Bees inside a hive never despawn.\nYou can place up to 5 Beehives. A hive with 0 bees only produces iron, 1 iron every 10 seconds. The more bees inside, the faster it drops loot, and from 3 bees it can drop diamonds, and from 4 bees it can drop emeralds. Each drop is only 1 resource at a time: either 1 iron, 1 diamond or 1 emerald. After 10 bees a hive doesn't drop any faster. There are no hive upgrades.\nHives have normal block HP and are weak to pickaxes: they break in 5 hits with a wooden pickaxe, 4 with stone, and 2 with iron or diamond. They can also be broken by TNT and fireballs if they aren't covered with ceramic or obsidian.", "items": [{"name": "Bee", "img": "images/items/bee.png", "desc": "Spawns around the map, similar to Alchemist's ingredients but not as many, and the amount depends on the map. Pulses every 7 seconds so it's easier to find. Disappears 3 minutes after spawning on the ground, but never inside a hive. Pick it up with the Bee Net, put it in a Beehive, and you lose it if you die."}, {"name": "Beehive", "img": "images/items/beehive.png", "note": "Cost: 60 iron", "desc": "You can place up to 5. Produces loot based on how many bees are inside (see the drop table). It has normal block HP and no upgrades. Weak to pickaxes: breaks in 5 hits with a wooden pickaxe, 4 with stone, and 2 with iron or diamond. TNT and fireballs can break it unless it is covered with ceramic or obsidian."}, {"name": "Bee Net", "img": "images/items/bee-net.png", "desc": "Hold it to pick up bees. Bees go into your inventory as a separate item. You keep the net when you die, but you lose your bees."}], "abilities": [], "tables": [{"title": "Hive drop table", "head": ["Bees in hive", "Drops every", "Iron", "Diamond", "Emerald"], "rows": [["0", "10s", "100%", "0%", "0%"], ["1", "9.75s", "100%", "0%", "0%"], ["2", "9.5s", "100%", "0%", "0%"], ["3", "8.5s", "85%", "15%", "0%"], ["4", "7.5s", "82%", "15%", "3%"], ["5", "6.25s", "81%", "15%", "4%"], ["6", "4.5s", "79%", "15%", "6%"], ["7", "3.75s", "78%", "14%", "8%"], ["8", "2.75s", "76%", "14%", "10%"], ["9", "2.25s", "75%", "14%", "11%"], ["10", "2s", "75%", "13%", "12%"], ["11 - 14", "2s", "74%", "13%", "13%"], ["15", "2s", "74%", "12%", "14%"]], "note": "These are approximate chances. Each drop is 1 iron, 1 diamond or 1 emerald, and a hive doesn't drop any faster after 10 bees. Going past 10 bees may raise the emerald chance a little, up to 15 bees."}], "bal": "bal", "balWhy": "It gives a lot of loot, but it's risky to use because the hive can be found and broken if you or your teammates aren't there to protect it.", "strategy": [{"title": "Fill hives to 10 bees first", "text": "Get each hive to 10 bees before adding more, because making a new hive is more beneficial than going past 10. Once all 5 hives have 10 bees, you can add extra bees up to 15 per hive, which may slightly raise your emerald chance."}, {"title": "Escape and slow chasers", "text": "Buy a ton of blocks so you can escape from people, and buy Gloop (35 iron) to slow down anyone chasing you. It slows them for 1 second and gives them Grounded for 10 seconds, so they can't use movement abilities or ender pearls."}, {"title": "Protect your hive", "text": "Surround your hive in ceramic early in the game, then replace it with obsidian so enemies can't place a Siege TNT on it."}], "counter": [{"title": "Break the hive early", "text": "If you see a Beekeeper collecting bees in the lobby, go for the hive while they aren't there. Do it early, before they have the emeralds to surround it with obsidian."}, {"title": "Keep resetting them", "text": "Keep killing the Beekeeper so they can't get any more bees in their hives."}], "skins": [{"name": "OG Chroma Skin", "img": "images/skins/beekeeper-beatrix-og-chroma.webp"}, {"name": "Meadow Skin", "img": "images/skins/beekeeper-beatrix-meadow.webp"}], "history": [{"type": "nerf", "date": "Mar 13, 2026", "title": "", "changes": ["Emerald and diamond drop rate reduced on lower level bee hive"]}, {"type": "bal", "date": "Jan 30, 2026", "title": "", "changes": ["Collectible spawn rates now scale with map size: larger maps spawn more, smaller maps spawn less"]}, {"type": "buff", "date": "Jan 16, 2026", "title": "", "changes": ["Decreased bee spawn interval"]}, {"type": "buff", "date": "Nov 14, 2025", "title": "", "changes": ["Beekeepers who place a hive will get it back if they break it", "Bees now have a pulsing effect, to make them easier to find"]}, {"type": "nerf", "date": "Jan 31, 2025", "title": "", "changes": ["Slightly decreased chance of getting emeralds"]}, {"type": "bal", "date": "Jan 24, 2025", "title": "", "changes": ["Can now place a maximum of 5 Beehives", "Each bee added to a beehive after 6 bees will significantly increase the drop rate of emeralds, up to 15 bees"]}, {"type": "buff", "date": "Jan 3, 2025", "title": "", "changes": ["Teammates can no longer break beehives"]}, {"type": "nerf", "date": "Jun 28, 2024", "title": "", "changes": ["Decreased emerald drop chance"]}, {"type": "nerf", "date": "May 31, 2024", "title": "", "changes": ["Slightly reduced chance drop emerald & diamond"]}, {"type": "buff", "date": "May 3, 2024", "title": "", "changes": ["Decrease spawn interval time: 45s→40s"]}, {"type": "nerf", "date": "Apr 5, 2024", "title": "Season X", "changes": ["Beehive generator cooldown: 8 seconds → 10 seconds"]}, {"type": "buff", "date": "Aug 18, 2023", "title": "", "changes": ["Initial spawned bees count: 3 → 4", "Bee spawn over time: 2 → 3 bees every 45s", "Increased max range for bee collection prompt", "Decreased hold duration required for bee collection and deposit"]}, {"type": "buff", "date": "Jun 9, 2023", "title": "", "changes": ["Resource spawn rate: +25%"]}, {"type": "buff", "date": "Apr 7, 2023", "title": "", "changes": ["Beehive diamond drop level requirement reduced: 4 → 2 bees", "Beehive emerald drop level requirement reduced: 6 → 4 bees"]}, {"type": "nerf", "date": "Aug 5, 2022", "title": "", "changes": ["Emerald generation reduced by 40%", "Diamond generation reduced by 25%"]}, {"type": "buff", "date": "Jul 15, 2022", "title": "", "changes": ["Hive drops are no longer split between players"]}, {"type": "buff", "date": "Sep 24, 2021", "title": "", "changes": ["Bee spawn rate: 60s → 45s", "Buffed ore spawn rate"]}, {"type": "nerf", "date": "Aug 28, 2021", "title": "", "changes": ["Fixed Beekeeper spawning too many emeralds"]}], "obtain": {"src": "Season 1 Battle Pass", "tier": "20 (paid)", "badge": "images/bp/s1.webp", "rent": 2000, "buy": 25000}},
{"name": "Bekzat", "img": "images/kits/bekzat.webp", "cls": "Ranged", "tiers": {"casual": "A", "ranked": "A"}, "diff": "moderate", "hp": "100", "desc": "Summon a mythical falcon to dominate an area. Work in tandem to critically strike your companion's target with your feather light bows", "adv": "Bekzat's bows are Featherlight, so there is no slowdown while charging a shot. Shots deal normal bow damage, unless the Falcon is targeting the player you are shooting, then you deal increased damage.\nThe Falcon flies around the enemy it is targeting and attacks every 5 seconds. Its damage and HP go up as you buy better Featherlight bows (see the Falcon tiers table). With the Summon Falcon ability you can target any enemy within 60 blocks by aiming and clicking on them, and once it is out you can recall it with Recall Falcon.\nIf a player damages the Falcon, it won't heal unless you recall it, and then it heals 6% HP every second. If a player kills the Falcon, you have to wait 5 seconds before it starts recharging, and only once it is at half charge can you summon it again.", "items": [{"name": "Featherlight Headhunter", "img": "images/items/featherlight-headhunter.png", "note": "Cost: 25 emeralds", "desc": "No slowdown while charging. Upgrades the Falcon to tier 3: 20 damage and 250 HP.", "cd": 1.3, "dmg": 88, "dmgText": "88 (headshot 115.5)", "dpsText": "70.4 - 92.4"}, {"name": "Featherlight Crossbow", "img": "images/items/featherlight-crossbow.png", "note": "Cost: 8 emeralds", "desc": "No slowdown while charging. Upgrades the Falcon to tier 2: 18 damage and 200 HP.", "cd": 1.3, "dmg": 54.4}, {"name": "Featherlight Bow", "img": "images/items/featherlight-bow.png", "note": "Cost: 32 iron", "desc": "No slowdown while charging. Upgrades the Falcon to tier 1: 16 damage and 150 HP.", "cd": 0.625, "cdText": "0.625s - 1s", "dmg": 28.8, "nodps": true}], "abilities": [{"name": "Summon Falcon", "img": "images/abilities/ability-template.png", "cd": 5, "nodps": true, "desc": "Aim and click on any enemy within 60 blocks to send the Falcon after them. It flies around the enemy and attacks every 5 seconds. If it is killed, it starts recharging after 5 seconds, and you can only summon it again once it is at half charge."}, {"name": "Recall Falcon", "img": "images/abilities/ability-template.png", "cd": 3, "nodps": true, "desc": "Calls the Falcon back to you. While recalled it heals 6% HP every second. A Falcon that was damaged won't heal unless you recall it."}], "tables": [{"title": "Falcon tiers", "head": ["Tier", "Unlocked by", "Damage", "HP"], "rows": [["0", "No bow", "14", "100"], ["1", "Featherlight Bow", "16", "150"], ["2", "Featherlight Crossbow", "18", "200"], ["3", "Featherlight Headhunter", "20", "250"]], "note": "The Falcon attacks every 5 seconds. While it is targeting an enemy, you get +60% critical strike damage against that enemy."}], "passives": [{"name": "Featherlight", "when": "Charging a bow", "desc": "There is no slowdown while charging a shot."}, {"name": "Falcon Focus", "when": "Shooting the enemy your Falcon is targeting", "desc": "You get +60% critical strike damage against them."}], "strategy": [{"title": "Only send the Falcon when you have a target", "text": "Make sure to only have the Falcon out when you are targeting someone, otherwise it will be killed easily."}, {"title": "Use the bow", "text": "Most kits aren't worth buying a bow for, but Bekzat doesn't need to charge it, so he gets the highest amount of damage out of it."}], "counter": [{"title": "Shoot the Falcon", "text": "Always target the Falcon when you have a projectile weapon. If you kill it, Bekzat can't use it to target anyone, so he loses the +60% crit damage and becomes very weak for that time."}, {"title": "The Falcon is easy to kill", "text": "Killing the Falcon isn't that hard, so Bekzat is good but not uncounterable."}], "bal": "bal", "balWhy": "It costs a bit more to use, but the Falcon gives great stalling chip damage and he has really high projectile damage. The Falcon isn't that hard to kill, which keeps him good but not uncounterable.", "skins": [{"name": "Sailor Skin", "img": "images/skins/bekzat-sailor.webp"}], "history": [{"type": "buff", "date": "Aug 8, 2025", "title": "", "changes": ["Bow damage multiplier on falcon targets 1.5 → 1.6"]}, {"type": "buff", "date": "Mar 28, 2025", "title": "", "changes": ["Bird Health now scales with Bekzat’s weapon", "Base: 100 health", "Feather-light Bow: +40 max health (140)", "Feather-light Crossbow: +80 max health (180)", "Feather-light Headhunter: +120 max health (220)", "Bird Damage now scales with Bekzat’s weapon", "Base: 14 damage", "Feather-light Bow: +2 damage (16)", "Feather-light Crossbow: +4 damage (18)", "Feather-light Headhunter: +6 damage (20)"]}, {"type": "buff", "date": "Nov 22, 2024", "title": "", "changes": ["reduced price for Feather light weapons", "Falconer bow: 36 Iron → 32 Iron", "Falconer Crossbow: 9 Emerald → 8 Emerald", "Falconer HeadHunter: 27 Emerald → 25 Emerald"]}, {"type": "buff", "date": "May 31, 2024", "title": "", "changes": ["Decrease bird attack cooldown 5-8s → 3-6s", "Increase bird damage 10 → 14"]}], "obtain": {"src": "Season 10 Battle Pass", "tier": "40 (paid)", "badge": "images/bp/s10.webp", "rent": 2000, "buy": 12000}},
{"name": "Bounty Hunter", "img": "images/kits/bounty-hunter.webp", "cls": "Economy", "tiers": {"casual": "S", "ranked": "A"}, "diff": "moderate", "hp": "100", "desc": "Get assigned bounties for killing certain players in the match. Completing a bounty rewards a random amount of resources.", "adv": "A random player in the server is your target. Hunting Time marks your target on the map, but your target also sees your mark, so they know where you are and that they are your target. They can't see the mark if you don't click Hunting Time. You can reroll your target (random) every 60 seconds.\nKilling your bounty rewards iron and emeralds, but no diamonds, and the reward scales with how long the game has been going. If you hit your bounty and your teammate kills them, you get the reward too (there is a 5 to 10 second leeway).\nAfter you get a new bounty you have to wait 20 seconds before you can get another one, and that timer starts when you reroll. So if you reroll and kill your target quickly, you still wait out the 20 seconds. If you reroll and don't kill them within 20 seconds, then kill them after that, your next bounty appears right away and the 20 second timer starts again.\nYou level up by killing your bounty, and each level upgrades Hunting Time (see the level table).", "items": [], "abilities": [{"name": "Hunting Time", "img": "images/abilities/ability-template.png", "nodps": true, "desc": "Lasts 15 seconds. Marks your target on the map, but your target sees your mark too, so they know you are hunting them. Gives bonuses depending on your level: level 1 +10% damage to your target, level 2 +20%, level 3 the same damage plus +12.5% movement speed, level 4 the same as level 3 plus 10% less damage taken from and dealt to everyone who isn't your target while active.", "cd": 30}, {"name": "Reroll", "img": "images/abilities/ability-template.png", "cd": 60, "nodps": true, "desc": "Changes your target to a different random player. The 20 second wait before your next bounty starts when you reroll."}], "tables": [{"title": "Bounty levels", "head": ["Level", "Bounty kills needed", "Level up reward", "Hunting Time"], "rows": [["1", "-", "-", "+10% damage to your target"], ["2", "2", "50 iron", "+20% damage to your target"], ["3", "2", "2 emeralds", "+20% damage to your target and +12.5% movement speed"], ["4", "3", "4 emeralds", "Same as level 3, plus you take 10% less damage and deal 10% less damage to everyone who isn't your target while it's active"], ["5", "5", "-", "No new Hunting Time, but every target gives double rewards"]], "note": "Bounty kills needed is the number of bounty kills to reach that level from the level before it."}, {"title": "Bounty rewards by game time", "head": ["Game time", "Iron", "Emeralds"], "rows": [["0 - 2 min", "1 - 40", "1 (instead of iron)"], ["2 - 3 min", "30 - 60", "-"], ["3 - 6 min", "about 40", "1 - 2"], ["6 - 10 min", "50 - 80", "1 - 3"], ["10 - 15 min", "125 - 250", "4 - 8"], ["15 - 20 min", "300+", "10 - 15"]], "note": "These are approximate amounts. They don't include the double rewards from level 5."}], "strategy": [{"title": "Don't use Hunting Time early", "text": "Don't activate Hunting Time early in the game. It does no damage, so it only tells your opponent that they are your target."}, {"title": "Use it from level 3", "text": "Use Hunting Time once you reach level 3 for the good speed boost. You can use it to run away from fights, not only to catch up to your target."}, {"title": "Get a crossbow fast", "text": "Save up for a crossbow as soon as you can. It helps you get to your targets really quickly."}], "counter": [{"title": "Reset before you get hit", "text": "If you know you are the target and haven't been hit, try resetting before the Bounty Hunter hits you so you don't feed."}], "bal": "bal", "balWhy": "It's really good in modes with fewer people, and a bit worse in modes with more people.", "skins": [{"name": "OG Chroma Skin", "img": "images/skins/bounty-hunter-og-chroma.webp"}, {"name": "Wanderer Skin", "img": "images/skins/bounty-hunter-wanderer.webp"}], "history": [{"type": "nerf", "date": "Aug 21, 2026", "title": "", "changes": ["Now can only receive 1 bounty request every 20 seconds"]}, {"type": "bal", "date": "Aug 14, 2026", "title": "Rework", "changes": ["Bounty Hunter gets iron and emeralds on completing a bounty. The reward is shown on the bounty poster.", "Bounty Hunter now has a progression system. Level up by completing bounties. On level up, gain extra resources and upgrade their ability!", "New Ability:", "Bounty Hunter track and focus on their current target for 15 seconds. Increase damage by 10% against their target but 10% less damage to other players.", "On level 2: Get 50 Iron, and increase the damage boost to target during ability by 20%", "On level 3: Get 2 Emerald, get 15% movement speed while the ability is active", "On level 4: Get 4 Emerald, get 10% damage reduction against other players while ability is active", "On level 5: Get 8 Emerald, Double all Bounty Reward"]}, {"type": "buff", "date": "Feb 13, 2026", "title": "", "changes": ["Assists payout 50% of bounty rewards (rounded values)"]}, {"type": "buff", "date": "Dec 12, 2025", "title": "", "changes": ["Adjusted scaling + loot table values"]}, {"type": "buff", "date": "Jun 13, 2025", "title": "", "changes": ["Reroll Cooldown: 120 → 45 seconds", "Buffed diamond and emerald reward scaling. Especially in the early game"]}, {"type": "buff", "date": "Mar 14, 2025", "title": "", "changes": ["Increased reward growth rate by 20%"]}, {"type": "buff", "date": "Jan 3, 2025", "title": "", "changes": ["Added Reroll Bounty ability to switch bounty targets with a 120 second cooldown."]}, {"type": "buff", "date": "Dec 6, 2024", "title": "", "changes": ["Can reroll your target after 60 seconds"]}, {"type": "bal", "date": "Feb 16, 2024", "title": "", "changes": ["Bounty rewards now scale over time"]}, {"type": "buff", "date": "Jan 12, 2024", "title": "", "changes": ["Raised upper limit on bounty rewards"]}], "obtain": {"src": "Season 1 Battle Pass", "tier": "16 (free)", "badge": "images/bp/s1.webp", "rent": 2000, "buy": 25000}},
{"name": "Builder", "img": "images/kits/builder.webp", "cls": "Defender", "tiers": {"casual": "B", "ranked": "B"}, "diff": "easy", "hp": "100", "desc": "Fortify blocks with extra health and blast protection using the Builder's hammer. Purchase the Hammer from the Item Shop.", "adv": "Builder spawns with a Builder Hammer and 8 Stone Bricks. The Stone Bricks are normal, so you still need to upgrade them. With the hammer you can upgrade blocks using iron or emeralds. Upgraded (reinforced) blocks are blast resistant and have 60% more durability, which makes them harder to break.\nIt takes about 8 TNT to break a single reinforced stone brick, while the other reinforced blocks still get one shot by TNT. Siege TNT still one shots, but it destroys fewer blocks when they are reinforced than when they aren't.\nThe hammer can also upgrade other kits' items, like Beekeeper Beatrix's Beehives.\nThe Bridge Printer is bought in the shop. Use the hammer and click the printer source to turn it on or off, and it stretches out blocks (see the Bridge Printer details).\nFun fact: the official kit description says to buy the Hammer from the Item Shop, but that is out of date. Builder used to need to buy it, and now spawns with it.", "items": [{"name": "Hammer", "img": "images/items/hammer.png", "desc": "Builder spawns with it. Upgrades blocks with iron or emeralds, making them blast resistant and giving them 60% more durability. Can also upgrade other kits' items, like Beekeeper Beatrix's Beehives. Click a Bridge Printer source with it to turn the printer on or off."}, {"name": "Bridge Printer Block", "img": "images/items/bridge-printer-block.png", "note": "Cost: 18 iron", "desc": "Stretches out up to 25 blocks, vertically or horizontally, and you can place up to 24. The source breaks in 2 hits with a wood or stone pickaxe and 1 hit with iron or diamond. The stretched blocks break in 1 hit with a wood pickaxe or better. You don't get it back when it breaks unless its extra blocks haven't been broken. Connected printers activate together with one click, and standing above or below several printers suffocates you."}], "abilities": [], "tables": [{"title": "Block upgrade costs", "head": ["Block", "Upgrade cost"], "rows": [["Wool", "2 iron"], ["Stone Brick", "6 iron"], ["Obsidian", "1 emerald"], ["Ceramic", "6 iron"], ["Tesla Coil", "147 iron"]], "note": "Upgraded blocks are blast resistant and have 60% more durability."}, {"title": "Bridge Printer", "head": ["Stat", "Value"], "rows": [["Cost", "18 iron"], ["Stretches", "25 blocks, vertical or horizontal"], ["Max placed", "24"], ["Source block breaks in", "2 hits with a wood or stone pickaxe, 1 hit with iron or diamond"], ["Stretched blocks", "1 hit with a wood pickaxe or better"]], "note": "You don't get the Bridge Printer back if you break it, unless its extra blocks haven't been broken or destroyed. You can break certain blocks to make it a certain length before you activate it. It only turns on or off when you are holding your hammer and click the printer source. If several printers are touching, they connect and all activate with one click, no matter which one you press. If you are standing above or below several printers, you will be suffocated."}], "bal": "sup", "balWhy": "Siege TNT completely obliterates Builder, so it could be changed to destroy fewer blocks when placed on reinforced ones. It's also a bit expensive: obsidian shouldn't cost 1 emerald to upgrade, and 100 iron would be a better price.", "counter": [{"title": "Place a Siege TNT", "text": "Just place a Siege TNT and the entire bed will be exposed, unless there is obsidian under it."}], "skins": [{"name": "Nutcracker Skin", "img": "images/skins/builder-nutcracker.webp"}], "strategy": [{"title": "Defend your bed early", "text": "Place your Stone Bricks around your bed as an early game defense, then upgrade them."}, {"title": "Use Bridge Printers as traps", "text": "Use Bridge Printers as traps, or to troll your teammates or enemies by suffocating them or voiding them."}], "history": [{"type": "buff", "date": "Sep 19, 2025", "title": "", "changes": ["Max block health multiplier 1.5x → 1.6x"]}, {"type": "buff", "date": "Jan 31, 2025", "title": "", "changes": ["Increased fortification defense against explosions (should be close to what it was before the TNT buff)"]}, {"type": "buff", "date": "Nov 22, 2024", "title": "", "changes": ["Reinforcing blocks instantly heals them to full"]}, {"type": "buff", "date": "Aug 9, 2024", "title": "", "changes": ["Now starts the game with Hammer item"]}, {"type": "buff", "date": "Mar 15, 2024", "title": "", "changes": ["Increase auto bridge scaffold distance (20 blocks → 25 blocks)", "Decrease drawbridge block cost (40 iron → 18 iron)"]}, {"type": "nerf", "date": "Jan 19, 2024", "title": "", "changes": ["Increased cost to fortify blastproof blocks 1.50 → 1.75 times the cost of the block", "Increased cost to fortify non-blastproof blocks 2.25 → 2.50 times the cost of the block"]}, {"type": "buff", "date": "Oct 20, 2023", "title": "", "changes": ["Start the game with 8 stone brick"]}, {"type": "buff", "date": "Sep 29, 2023", "title": "", "changes": ["Fortified block blast resistance multiplier: 1.45 → 1.65", "Fortified blocks will not burn"]}, {"type": "buff", "date": "Jul 7, 2023", "title": "", "changes": ["Fortified block resistance: 1.35 → 1.45"]}, {"type": "buff", "date": "Jan 27, 2023", "title": "", "changes": ["Bridge Printer deploy time per scaffold: 0.1s → 0.05s"]}, {"type": "buff", "date": "Jan 20, 2023", "title": "Update", "changes": ["Added the Bridge Printer Block: hit it with your hammer to toggle a scaffold bridge"]}, {"type": "buff", "date": "Nov 18, 2022", "title": "", "changes": ["Reinforced blocks are more blast resistant"]}, {"type": "nerf", "date": "Sep 2, 2022", "title": "", "changes": ["Reinforced blocks are no longer blast proof (they still gain a lot of blast resistance)"]}, {"type": "buff", "date": "Nov 12, 2021", "title": "", "changes": ["Upgrading a block now gives blast protection", "Buffed upgraded block max health", "Slightly increased upgrade cost"]}], "obtain": {"src": "Kit Shop", "buy": 10000, "rent": 1500}},
{"name": "Caitlyn", "img": "images/kits/caitlyn.webp", "cls": "Fighter", "tiers": {"casual": "C", "ranked": "S"}, "diff": "hard", "hp": "100", "desc": "Fulfill assassination contracts to empower your attacks with a deadly decay.", "adv": "Caitlyn's attacks apply decay, which deals 2 damage per second for 2 seconds. Hitting an enemy that is already decaying makes the decay 25% stronger per hit, stacking up to 3 times. Contracts upgrade the decay so it hits harder, lasts longer, and gets special effects.\nPress R to open the contracts menu. It shows the stats of her Dark Decay (duration, damage and bonus effects) and three random players with their team color, armor type and distance in blocks. Pick one to assassinate and upgrade your ability. The target is highlighted in red, so you can see where they are, until they are killed (teammates can help) or you reject the contract, which you can do once every minute.\nBetter armor on the target gives better upgrades. Sometimes a special contract appears on a player with diamond armor or higher, and completing it gives your decay a special effect. The upgrade and its amount are shown on the contract screen. Amounts are random and scale with the target's armor and how long the game has gone on.", "items": [], "abilities": [{"name": "Open Contracts", "img": "images/abilities/ability-template.png", "nodps": true, "desc": "Press R to open the contracts menu. Choose one of 3 random players to assassinate and upgrade your decay. Reject the current contract once every minute."}], "tables": [{"title": "Contract upgrades", "head": ["Upgrade", "What it does", "Max"], "rows": [["Target Damage", "More damage to your current target", "25%"], ["Armor Penetration", "How much of your decay ignores armor", "75%"], ["Damage", "More decay damage per tick", "+10"], ["Duration", "Longer decay", "+5s"]]}, {"title": "Special contracts", "head": ["Effect", "What it does", "Appears when"], "rows": [["img:images/classes/support.png|Silence", "Healing on decaying enemies is reduced by 75%", "The target has diamond armor or higher and a Support kit"], ["img:images/classes/movement.png|Thrill of the Hunt", "+15% move speed when moving toward decaying enemies", "The target has diamond armor or higher and a Movement kit"], ["img:images/classes/tank.png|Dark Insight", "Heal for 50% of the decay damage you deal", "The target has diamond armor or higher and a Tank kit"], ["img:images/icons/decay.png|Assassin's Instinct", "Decay deals double damage to your active target", "The target has diamond armor or higher and is also a Caitlyn"], ["img:images/classes/economy.png|Bounty", "Killing your target gives you 2 emeralds", "The target has diamond armor or higher and an Economy kit"], ["img:images/icons/eye.png|Focus", "You take and deal +25% damage with your active target", "Passive: you get it whenever you select a target"], ["img:images/icons/diamond-helmet.png|Vulnerable", "Decaying enemies take +10% damage from all sources", "Any player in the server has diamond armor or higher, any kit"]], "note": "Special contracts only have a chance to appear. Except for Focus, they depend on the target's kit and armor."}], "passives": [{"name": "Dark Decay", "when": "Hitting enemies", "desc": "Applies decay: 2 damage per second for 2 seconds. Each extra hit on a decaying enemy adds 25% strength, stacking up to 3 times."}], "strategy": [{"title": "Upgrade duration and damage", "text": "Focus on the decay duration and decay damage upgrades, or just choose the player nearest to you if they are close."}, {"title": "Get the Fire enchant", "text": "Always get the Fire enchant to deal a ton of tick damage."}, {"title": "Early crossbow", "text": "Focus on getting a crossbow early to make your life easier."}], "counter": [{"title": "Don't feed a diamond Caitlyn", "text": "Try not to die to a Caitlyn with diamond armor, as you might give her a special contract."}, {"title": "Block after the first hit", "text": "Caitlyn relies heavily on hitting multiple shots, so if you get hit once, build a wall to stop getting hit again."}], "bal": "adj", "balWhy": "It's only good in Ranked 5v5s, and even there it has fallen off a bit. In every other mode it's very weak, and it's very late game prone, which most games don't reach. It needs a rework.", "history": [{"type": "nerf", "date": "Jan 16, 2026", "title": "", "changes": ["Vulnerable damage: 12% → 10%", "Decay initial duration: 3s → 2s", "Active target damage boost: 30% → 25%"]}, {"type": "nerf", "date": "Jul 11, 2025", "title": "", "changes": ["Reduced the bonus to decay damage upgrades from armor effectiveness"]}, {"type": "nerf", "date": "Apr 11, 2025", "title": "", "changes": ["Contract delay time 30s → 40s", "Max bleed stacks 4 → 3", "Max bleed duration 6s → 5s"]}, {"type": "nerf", "date": "Feb 14, 2025", "title": "", "changes": ["Reduce contract reward scaling from higher tier targets", "Reduced Target Damage Cap: 40% → 30%", "Reduced Armor Pen Cap: 100% → 75%", "Vulnerable Perk: 15% → 12% bonus damage against decayed enemies"]}, {"type": "nerf", "date": "Jan 17, 2025", "title": "", "changes": ["Reduced instances where her Decay was activated by other damage over time sources or caused other damage over time sources to be re-activated on Decay damage taken", "Reduced the increase in Decay damage per kill from 0.75 → 0.5", "Reduced the increase in Decay duration per kill from 0.6 → 0.5", "Reduced the maximum Decay duration from 10s → 6s", "Reduced damage boost toward active contract target from 6% → 5%"]}, {"type": "nerf", "date": "Jun 28, 2024", "title": "", "changes": ["Slightly decrease contract upgrade scaling"]}, {"type": "buff", "date": "May 17, 2024", "title": "", "changes": ["Contract upgrades scale 1.5x faster"]}, {"type": "buff", "date": "Apr 19, 2024", "title": "", "changes": ["Increased rewards for completing more difficult contracts"]}, {"type": "nerf", "date": "Nov 24, 2023", "title": "", "changes": ["Base decay damage: 4 → 2", "Reduced contract rewards"]}, {"type": "buff", "date": "Sep 1, 2023", "title": "", "changes": ["Increased base decay damage 2→ 4", "Increased upgrade scaling"]}, {"type": "nerf", "date": "Jun 9, 2023", "title": "", "changes": ["Reduce initial decay duration: 4 → 3 seconds", "Reduce decay duration upgrade amounts", "Reduce decay damage upgrade amounts"]}, {"type": "nerf", "date": "May 26, 2023", "title": "", "changes": ["Reduced contract’s armor reward"]}, {"type": "buff", "date": "Feb 24, 2023", "title": "", "changes": ["Focus: Take and deal +20% damage when fighting active target", "You can now discard your active contract after 1 minute"]}], "obtain": {"src": "Season 7 Battle Pass", "tier": "50 (paid)", "badge": "images/bp/s7.webp", "rent": 2000}},
{"name": "Cobalt", "img": "images/kits/cobalt.webp", "cls": "Tank", "tiers": {"casual": "S", "ranked": "A"}, "diff": "easy", "hp": "100", "desc": "Every time you take damage you have a chance of dropping a battery on the ground. Once the battery activates you can pick it up for a small shield. After collecting 3 batteries you will overload, gaining movement speed!", "adv": "Whenever you take damage, you have a 33% chance to drop a battery. Picking one up gives you 16 shield.\nAfter picking up 3 batteries, you go into Overcharge for 8 seconds. You get 20% more speed, and anyone who hits you with a melee weapon takes 25% of that damage back as mirror damage, with 0% armor penetration. They also get Zapped, so they heal and gain shields 60% less for 10 seconds.\nYou can still drop batteries during Overcharge, but you can't pick them up. When Overcharge ends, you lose any shield you have left.", "items": [], "abilities": [], "history": [{"type": "buff", "date": "Oct 30, 2026", "title": "", "changes": ["Shield Per Battery 12 -> 16", "Improved tile placement for batteries"]}, {"type": "bal", "date": "Apr 10, 2026", "title": "Rework", "changes": ["While in Overload you will reflect 25% of all melee damage dealt to you back to the attacker", "No longer gives a damage buff", "Still has speed boost", "Duration increased: 6s → 8s"]}, {"type": "buff", "date": "Aug 11, 2023", "title": "", "changes": ["Shield health gain from battery 8 → 12"]}, {"type": "nerf", "date": "Nov 4, 2022", "title": "", "changes": ["Overload damage boost: 20% → 15%", "Overload speed boost: 30% → 20%", "Battery shield strength: 10 → 8"]}, {"type": "nerf", "date": "Aug 5, 2022", "title": "", "changes": ["Shield 15 → 10"]}], "obtain": {"src": "Season 5 Battle Pass", "tier": "30 (paid)", "badge": "images/bp/s5.webp", "rent": 2000}, "passives": [{"name": "Batteries", "when": "When you take damage", "desc": "33% chance to drop a battery. Pick it up for 16 shield. You can drop batteries during Overcharge, but you can't pick them up."}, {"name": "Overcharge", "when": "After picking up 3 batteries", "desc": "Lasts 8 seconds. +20% speed, and melee attackers take 25% of their damage back as mirror damage (0% armor penetration). Your shield is removed when it ends."}, {"name": "Zapped", "when": "Hitting Cobalt in Overcharge", "desc": "Anyone who hits you with a melee weapon during Overcharge heals and gains shields 60% less for 10 seconds."}], "tables": [{"title": "Cobalt stats", "head": ["Stat", "Value"], "rows": [["Battery drop chance", "33% when you take damage"], ["Shield per battery", "16"], ["Batteries for Overcharge", "3"], ["Overcharge duration", "8 seconds"], ["Overcharge speed", "+20%"], ["Mirror damage", "25% of melee damage taken"], ["Mirror armor penetration", "0%"], ["Zapped", "Melee attackers: 60% less healing and shields for 10 seconds"]]}], "strategy": [{"title": "Get shield before fights", "text": "Try to bait enemies into shooting you, so you drop batteries and get shield before the fight starts."}, {"title": "Only pick up 2", "text": "If there are 3 or more batteries on the floor, don't pick up all 3 to start Overcharge. Pick up only 2 so you have 32 free shield going into the fight."}, {"title": "Use Zapped", "text": "If your enemy is healing or using a kit with shields, make sure you take advantage of Zapped."}, {"title": "Run and reset", "text": "If you're getting low, use the Overcharge speed boost to run away, then stall out the 8 second timer so you can pick up more batteries."}], "counter": [{"title": "Don't shoot it for no reason", "text": "Only hit Cobalt when it matters. Every hit is a chance for it to drop a battery and gain shield."}, {"title": "Get Static", "text": "The Static enchant nerfs its tankiness by a lot."}], "skins": [], "bal": "adj", "balWhy": "Cobalt's shields are insane early to mid game, but its mirror damage has problems. It's nice that it has a unique purpose, but with 0% armor penetration the mirror damage barely does anything, so its only real use is getting shields and giving out an early Zapped effect. It's also weird that when Cobalt itself is Zapped, it still only gets 60% less shield from batteries; that should be removed. A fix: go back to 36 total shield (12 per battery) and give the mirror damage 100% armor penetration."},
{"name": "Cogsworth", "img": "images/kits/cogsworth.webp", "cls": "Economy", "tiers": {"casual": "A", "ranked": "A"}, "diff": "easy", "hp": "100", "desc": "Deploy robots that search for generators and collect resources!", "adv": "Cogsworth spawns with a Dimmy-X1 bot and the Overclock ability. You can buy as many Dimmy-X1 (50 iron) and Emmy-Z2 (1 emerald) bots as you want, but only 4 of each can be placed at once. Placing a bot takes 2.5 seconds and locks you in place.\nDimmy-X1 goes to the nearest diamond generator and brings the diamonds to your team chest. Emmy-Z2 collects emeralds and puts them in your personal chest. Bots have a 60% chance to double the resources they pick up, and you can also take resources straight off your bots.\nBots move as fast as players, take no knockback, can jump over 1 block gaps, and run away from enemies unless they're waiting for a diamond or emerald to spawn. They glow red on your screen when an enemy is within 8 blocks. They need a bridge to reach a generator, and sometimes the AI walks into the void.\nOverclock lasts 5 seconds (20 second cooldown) and makes your bots 1.85x faster. While it's active, every bot deals 4 damage every 0.5 seconds (10 ticks) in an 8 block radius with knockback, and Zaps enemies it hits. The damage stacks, so all 8 bots deal 32 per tick.", "items": [{"name": "Dimmy-X1", "img": "images/items/dimmy-x1.png", "note": "Cost: 50 iron", "desc": "150 HP. Collects diamonds and puts them in your team chest. You spawn with one, and up to 4 can be placed.", "dmgText": "4 every 0.5s during Overclock", "nodps": true}, {"name": "Emmy-Z2", "img": "images/items/emmy-z2.png", "note": "Cost: 1 emerald", "desc": "200 HP. Collects emeralds and puts them in your personal chest. Up to 4 can be placed.", "dmgText": "4 every 0.5s during Overclock", "nodps": true}], "abilities": [{"name": "Overclock", "img": "images/abilities/ability-template.png", "note": "5 seconds", "desc": "Your bots move 1.85x faster. Each bot deals 4 dama {"name": "Conqueror", "img": "images/kits/conqueror.webp", "cls": "Support", "tiers": {"casual": "C", "ranked": "B"}, "diff": "easy", "hp": "100", "desc": "Place banners to empower nearby allies.", "adv": "Conqueror can buy 3 banners in the shop for 60 iron each: the Defense Banner, Fire Banner and Heal Banner. You can hold up to 3 of each, but only 1 of each type can be placed at a time.\nBanners buff every ally within a 9 block radius and disappear after 30 seconds. They're weak to pickaxes (16 hits with wood, 10 with stone, 7 with iron, 4 with diamond) and can also be destroyed with TNT or fireballs.\nThe Defense Banner makes you take no knockback. The Fire Banner gives your hits the normal Fire enchant. Both buffs stay for 5 seconds after the banner disappears or you leave its radius. The Heal Banner heals you every second based on your missing HP, so it heals more the lower you are, but it stops as soon as you leave.", "items": [{"name": "Defense Banner", "img": "images/items/defense-banner.png", "note": "Cost: 60 iron", "desc": "Allies within 9 blocks take no knockback. The buff stays for 5 seconds after the banner disappears or you leave the radius. Lasts 30 seconds."}, {"name": "Fire Banner", "img": "images/items/fire-banner.png", "note": "Cost: 60 iron", "desc": "Allies within 9 blocks get the normal Fire enchant on their hits. It stays for 5 seconds after the banner disappears or you leave the radius. Lasts 30 seconds."}, {"name": "Heal Banner", "img": "images/items/heal-banner.png", "note": "Cost: 60 iron", "desc": "Every second, heals allies within 9 blocks by 13% of their missing HP. Each teammate in the area makes it heal 5% less (13% becomes about 12.35% with one more teammate), but it always heals at least 5. Only works while you're in range. Lasts 30 seconds."}], "abilities": [], "history": [{"type": "nerf", "date": "May 8, 2026", "title": "", "changes": ["Healing banner’s healing reduced by 5% for each teammate in area"]}, {"type": "nerf", "date": {"name": "Crocowolf", "img": "images/kits/crocowolf.webp", "cls": "Fighter", "tiers": {"casual": "A", "ranked": "A"}, "diff": "moderate", "hp": "100", "desc": "Being in the vicinity of damage dealt builds bloodlust. Activate Beast Form to temporarily give you enhanced damage, knockback, and movement speed. Dealing damage to non-player entities builds more bloodlust. When your bed breaks you will be given full bloodlust.", "adv": "Crocowolf builds Bloodlust from damage dealt near it. Once you have 300 Bloodlust, you can activate Beast Form.\nBloodlust counts the base damage of every hit within 5 blocks of you: your hits, your teammates' hits and your enemies' hits, including hits on you. For example, an iron sword (30 damage) fills it in 10 hits. Hits on NPCs like Diamond Guards and the Titan count double, so you only need half as much. Kills don't give extra Bloodlust, and you lose all of it when you die. When your bed breaks, your bar fills all the way up.\nActivating Beast Form heals you 20 HP right away. While transformed you deal 25% more damage from every source (swords, ranged weapons and more), move 27.5% faster (1.275x), and deal 1 block more knockback.\nBeast Form slowly drains your Bloodlust, lasting about 12 seconds from a full bar. You have to wait 5 seconds before you can cancel it, and if you cancel early you keep whatever Bloodlust is left (cancel 6 seconds in and you keep about 50%). You can only activate it with a full bar.", "items": [], "abilities": [{"name": "Beast Form Activate/Deactivate", "img": "images/abilities/ability-template.png", "note": "Needs 300 Bloodlust", "desc": "Transform into Beast Form: heal 20 HP instantly, deal 25% more damage from every source, move 27.5% faster, and deal 1 block more knockback. It drains your Bloodlust (about 12 seconds from full). You can cancel it after 5 seconds and keep whatever Bloodlust is left. Only works with a full bar.", "nodps": true}], "history": [{"type": "bal", "date": "Apr 10, 2026", "title":
