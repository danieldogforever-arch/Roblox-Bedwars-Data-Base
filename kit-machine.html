{"name": "Cyber", "img": "images/kits/cyber.webp", "cls": "Economy", "tiers": {"casual": "A", "ranked": "C"}, "diff": "moderate", "hp": "100", "desc": "Deploy and control drones to pickup resources from around the map. Drones can also airdrop primed TNT.", "adv": "Cyber can buy a Drone for 40 iron. Equip it to take control and fly it anywhere on the map. The drone can carry a stack of iron, diamonds or emeralds, but only one type at a time (like 10 diamonds, but no iron or emeralds with them).\nWhile you're not flying it, you can load up to 10 TNT into the drone. While flying, press X to drop a TNT, which starts detonating wherever it lands.\nThe drone has a 490 second battery. When it runs out, the drone explodes (it doesn't do damage) and you have to buy a new one. Stop using the drone to instantly refill the battery.\nThe drone only has 20 HP and doesn't show a health bar, so it's hard to tell how hurt it is. If Cyber dies, the drone stops completely wherever it is. If the drone is destroyed, whoever killed it gets the loot it was carrying.", "items": [{"name": "Drone", "img": "images/items/drone.png", "note": "Cost: 40 iron", "desc": "Equip to fly it around the map. 20 HP, no health bar. Carries a stack of one resource type at a time and up to 10 TNT. Battery lasts 490 seconds and refills instantly when you stop using it."}], "abilities": [{"name": "Speed Boost", "img": "images/abilities/ability-template.png", "note": "Only while flying the Drone", "desc": "Makes the drone faster for 4 seconds.", "cd": 12, "nodps": true}, {"name": "TNT Drop", "img": "images/abilities/ability-template.png", "note": "Only while flying the Drone", "desc": "Press X to drop one of the drone's TNT (up to 10 loaded). It starts detonating wherever it lands.", "nodps": true}], "history": [{"type": "bal", "date": "Jul 11, 2025", "title": "", "changes": ["No longer receives free drone at the start of the match", "Drone cost changed 50 iron → 40 iron"]}, {"type": "buff", "date": "Jun 14, 2024", "title": "", "changes": ["Increased drone speed boost duration 3s → 4s", "Increased drone health 15 → 20", "Decreased drone price 60 iron → 50 iron"]}, {"type": "buff", "date": "May 17, 2024", "title": "", "changes": ["Start match with a drone", "Drone base speed 1.4 → 1.5", "Drone boosted speed 1.8 → 1.85", "Drone speed boost cooldown 13s → 12s"]}, {"type": "buff", "date": "Mar 1, 2024", "title": "", "changes": ["Added a speed boost ability to drones with a 13 second cooldown"]}, {"type": "nerf", "date": "Jun 30, 2023", "title": "", "changes": ["Must manually add TNT into your drone.", "Drone max TNT capacity: 10"]}, {"type": "buff", "date": "Apr 21, 2023", "title": "", "changes": ["Drone Speed: 1.3 → 1.4"]}, {"type": "nerf", "date": "Jan 13, 2023", "title": "", "changes": ["Drone speed: -15%"]}, {"type": "nerf", "date": "Dec 9, 2022", "title": "", "changes": ["Drone cost: 50 iron → 60 iron"]}, {"type": "nerf", "date": "Sep 16, 2022", "title": "", "changes": ["Killing Cyber's drone now gives you its held items"]}, {"type": "nerf", "date": "May 13, 2022", "title": "", "changes": ["Drone cost: 15 iron → 50 iron"]}, {"type": "nerf", "date": "May 6, 2022", "title": "", "changes": ["Drone HP: 60 → 15"]}], "obtain": {"src": "Kit Shop", "buy": 10000, "rent": 1500}, "passives": [{"name": "Battery", "when": "While flying", "desc": "490 seconds of flight. When it runs out the drone explodes harmlessly and you need a new one. Stop flying to refill it instantly."}, {"name": "Fragile", "when": "Always", "desc": "The drone only has 20 HP and no health bar. If Cyber dies, the drone stops where it is. Whoever destroys the drone gets the loot it was carrying."}], "tables": [{"title": "Drone stats", "head": ["Stat", "Value"], "rows": [["Cost", "40 iron"], ["HP", "20"], ["Battery", "490 seconds"], ["TNT capacity", "10"], ["Carries", "1 resource type at a time (any amount)"], ["Speed", "8.73 blocks/s (about +27% faster than walking)"], ["Speed Boost", "About 10.8 blocks/s for 4 seconds (12s cooldown)"]], "note": "Speed Boost makes the drone about 23% faster than its normal speed."}], "strategy": [{"title": "Stay under bases", "text": "The drone is very fragile, so fly under bases and only come up to grab loot quickly."}, {"title": "Watch your surroundings", "text": "Keep an eye out for anyone trying to shoot down your drone."}], "counter": [{"title": "Shoot it down", "text": "Buy a bow and shoot it. It only takes 2 bow shots (depending on your kit) or 1 crossbow shot, and you get whatever loot it was carrying."}, {"title": "Kill Cyber", "text": "If you kill Cyber, the drone stops completely where it is."}], "bal": "weak", "balWhy": "Cyber is decent in lobbies where people don't go to diamond generators often, but when they do, it's super weak. It has no way to duplicate resources like other economy kits, and it's very fragile compared to other kits. It needs a heavy resource buff to be viable, and maybe more defense, like an upgraded drone that's slower and bulkier and swaps the speed boost for an attack.", "skins": [{"name": "DJ Skin", "img": "images/skins/cyber-dj.webp"}]},
{"name": "Death Adder", "img": "images/kits/death-adder.webp", "cls": "Destroyer", "tiers": {"casual": "B", "ranked": "A"}, "diff": "moderate", "hp": "100", "desc": "Charge up explosive comets to rain destruction on your enemy's base. Collect alchemy crystals to unlock even stronger abilities!", "adv": "Death Adder spawns with the Charge Explosive Comet ability. Alchemy Crystals spawn around the map every so often and despawn after 3 minutes. Collecting them gives you crystals to shoot (your UI shows how many you're holding), and collecting enough levels up your comet. The count resets every level, and it only matters how many you collect, even if you're already full.\nHold the ability to charge a comet, then release to shoot it. Each charge takes 1 second, and the first one has to finish before you can shoot. You can cancel any time, and the ability has a 1 second cooldown. Each shot uses 1 crystal no matter how many charges you use. While charging you move about 50% slower.\nThe comet deals hit damage, then explodes for around 60 damage, with less damage the farther the explosion is from the target. Neither part has armor penetration. Level 3 unlocks a second charge and level 5 a third; extra charges make the explosion bigger. Block damage maxes out at level 3, which can take obsidian down by about 80%.", "items": [], "abilities": [{"name": "Charge Explosive Comet", "img": "images/abilities/ability-template.png", "note": "Uses 1 Alchemy Crystal", "desc": "Hold to charge (1 second per charge), release to shoot. The comet deals hit damage and then explodes for around 60 damage, with falloff. You move about 50% slower while charging. Cancel any time.", "cd": 1, "dmgText": "Hit 10-24 + ~60 explosion (by level)", "nodps": true}], "history": [{"type": "buff", "date": "Jul 25, 2025", "title": "", "changes": ["Ability block damage increased for Tier 3 & 4 (Now does significant damage to obsidian)"]}, {"type": "buff", "date": "Jun 13, 2025", "title": "", "changes": ["Fixed not being able to reach Tier 5 Ability", "Buffed Tier 5 explosion power to now be able to damage obsidian blocks"]}, {"type": "bal", "date": "Feb 14, 2025", "title": "", "changes": ["Added 2 new tiers to smooth out the power of the tiers. (Tier 4 and 5)", "Tier 5 is slightly stronger than previous tier 3", "Player damage increased across all tiers"]}, {"type": "buff", "date": "Jan 3, 2025", "title": "", "changes": ["Explosive Comet base damage increased 5/8/15 → 8/14/22"]}, {"type": "buff", "date": "Dec 20, 2024", "title": "", "changes": ["Crystal spawn rate increased by 33%"]}, {"type": "nerf", "date": "Sep 13, 2024", "title": "", "changes": ["Decreased crystal spawn rate", "Decreased knockback on Tier 2 and Tier 3 explosions", "Decreased Tier 3 explosion power"]}], "obtain": {"src": "Kit Shop", "buy": 10000, "rent": 1500}, "passives": [{"name": "Alchemy Crystals", "when": "Around the map", "desc": "Crystals spawn every so often and despawn after 3 minutes. Collect them to get shots and to level up your comet."}, {"name": "Heavy Charge", "when": "While charging", "desc": "You move about 50% slower (48 blocks took 13.9 seconds)."}], "tables": [{"title": "Comet levels", "head": ["Level", "Crystals held", "Collect to level up", "Charges", "Hit damage", "Total (no armor)", "Total vs iron armor"], "rows": [["1", "2", "5", "1", "10", "~69", "30.49"], ["2", "3", "7", "1", "12", "73", "~32.1"], ["3", "4", "8", "2", "14", "76", "~33.4"], ["4", "5", "12", "2", "18", "~80", "35.28"], ["5 (max)", "5", "-", "3", "24", "~86", "37.7"]], "note": "The explosion is around 60 damage at most, with falloff if it lands near the target instead of right on them, so totals vary a bit. No armor penetration. Totals marked ~ are approximate."}, {"title": "Block damage", "head": ["Level", "Wool", "Wood", "Stone", "Ceramic", "Obsidian"], "rows": [["1", "Very easy", "Easy", "About 10%", "No", "No"], ["2", "Very easy", "Very easy", "About 25%", "No", "No"], ["3+", "Very easy", "Very easy", "Easy", "Easy", "Up to 80%"]], "note": "Level 3 is the max block damage. After that, levels only add player damage, and extra charges make the blast bigger."}, {"title": "Charging speed", "head": ["", "Speed"], "rows": [["Walking", "6.86 blocks/s"], ["While charging", "3.45 blocks/s (about 50% slower)"]]}], "strategy": [{"title": "Playing for damage", "text": "Just play normally and collect crystals as you go."}, {"title": "Early bed break", "text": "Unlock the 2nd charge, then fire 2 quick 1 charge comets to break the obsidian and the bed before they buy Bed Shield."}, {"title": "Against Bed Shield", "text": "If they buy Bed Shield, charge a comet, drop down onto the bed and explode it there."}, {"title": "Better TNT rain", "text": "Have a teammate break the bed while you shoot explosions at the defenders."}], "counter": [{"title": "Bed Shield", "text": "Bed Shield (5 diamonds, 3 minutes) stops Death Adder from shooting your bed, unless it's right on top of the bed and willing to hurt itself."}, {"title": "Chase it", "text": "Without Bed Shield, you can only stop it by chasing it or being close enough to keep it away from your bed."}], "skins": [{"name": "Frost Skin", "img": "images/skins/death-adder-frost.webp"}], "bal": "bal", "balWhy": "Destroying obsidian that easily is very strong and makes it a great bed breaker. Charging is balanced, and the damage is fair since you need to find crystals to use it. Bed Shield also stops it for 3 minutes, unless it's on top of your bed and hurting itself with the explosion."},
{"name": "Dino Tamer Dom", "img": "images/kits/dino-tamer-dom.webp", "cls": "Destroyer", "tiers": {"casual": "C", "ranked": "C"}, "diff": "easy", "hp": "100", "desc": "Can purchase a Dino mount. Charge into defenses to knock them down!", "adv": "Dino Tamer Dom can buy a Dino for 60 iron. Summoning it takes 2 seconds and slows you down a lot while it happens. Riding it makes you about 20% faster than walking. You keep the Dino when you get off, but you lose it when you die.\nWhile riding, you can use Charge (40 second cooldown). It lasts 3 seconds and fills a bar; the fuller the bar, the more damage the explosion does to blocks. The bar is full after 2 seconds. Ramming a player deals about 85 damage with no armor penetration. Running into any block during the charge makes it explode and ends the charge. You can't use weapons while charging.\nA full charge breaks up to 2 layers of obsidian, but not every block. Against a normal obsidian bed defense (8 obsidian around the bed) it breaks 1-3 blocks depending on how you hit it, and it can't get through 3 layers to expose the bed.", "items": [{"name": "Dino", "img": "images/items/dino.png", "note": "Cost: 60 iron", "desc": "Takes 2 seconds to summon and slows you while summoning. Riding it makes you about 20% faster. Not used up when you get off, but you lose it when you die."}], "abilities": [{"name": "Charge", "img": "images/abilities/ability-template.png", "note": "Only while on the Dino", "desc": "Charge forward for 3 seconds. A bar fills over 2 seconds; the fuller it is, the more block damage the explosion does. Ramming a player deals about 85 damage (no armor penetration). Hitting any block explodes it and ends the charge. Can break up to 2 layers of obsidian. No weapons while charging.", "cd": 40, "dmgText": "About 85 on hit", "nodps": true}], "history": [{"type": "bal", "date": "Aug 7, 2026", "title": "", "changes": ["Dino Charge duration: 5s → 3s", "Dino Charge cooldown: 50s → 40s", "Time to reach Charge II: 2.5s → 2s", "Charge I can no longer break blastproof blocks.", "Charge II damage radius: 9 → 8 blocks", "Charge II explosion power: 12 → 11"]}, {"type": "bal", "date": "Nov 28, 2025", "title": "", "changes": ["Charging with the Dino past a 2.5 seconds will have higher destructive damage with indicator", "Dino cost reduced:  75 -> 60 iron", "Dino charge attack trigger range increased: 1 block -> 2 blocks", "Slight Dino destructive decrease if triggered under 2.5s, but increased destructiveness after 2.5s", "Weapons can no longer be used while using the Dino's charge attack"]}, {"type": "buff", "date": "Jan 17, 2025", "title": "", "changes": ["Decreased Dino price 100 → 75 iron"]}, {"type": "nerf", "date": "Jan 3, 2025", "title": "", "changes": ["Charge duration reduced 10 → 5s", "Charge speed reduced 300% → 250%"]}, {"type": "buff", "date": "Nov 8, 2024", "title": "", "changes": ["Dino Summon Time: 3s → 2s", "Dino item is no longer consumed on use or unmount", "Dino charge cooldown reduced: 60s → 50s", "Dino Tamer Dom now gains a 10% move speed bonus while mounted", "Dino Item Cost Increased: 80 → 100 iron"]}, {"type": "nerf", "date": "May 19, 2023", "title": "", "changes": ["Charge explosion radius: 10 blocks → 8 blocks"]}, {"type": "nerf", "date": "Feb 24, 2023", "title": "", "changes": ["Explosion strength reduced", "Dino price: 64 iron → 80 iron"]}, {"type": "nerf", "date": "Jan 20, 2023", "title": "", "changes": ["Dino cost: 32 iron → 64 iron"]}, {"type": "nerf", "date": "Oct 4, 2022", "title": "", "changes": ["Can no longer drop his Dinos to teammates"]}, {"type": "buff", "date": "Sep 2, 2022", "title": "", "changes": ["Dino cost reduced (40 iron → 32 iron)"]}], "obtain": {"src": "Season 5 Battle Pass", "tier": "20 (free)", "badge": "images/bp/s5.webp", "rent": 2000}, "passives": [{"name": "Mounted", "when": "Riding the Dino", "desc": "About 20% faster than walking. You lose the Dino if you die."}], "tables": [{"title": "Speed", "head": ["", "Speed", "Compared to walking"], "rows": [["Walking", "6.86 blocks/s", "-"], ["Summoning the Dino", "2.4 blocks/s", "About 65% slower"], ["Riding", "8.28 blocks/s", "About +20%"], ["Charging", "About 13.7 blocks/s", "About +100% (2x)"]], "note": "From tests: 96 blocks in 11.6s riding, 48 blocks in about 3.3s charging."}, {"title": "Charge damage", "head": ["Target", "Damage"], "rows": [["No armor", "About 85"], ["Iron armor", "About 38"]], "note": "Estimated from tests. No armor penetration."}, {"title": "What a full charge breaks", "head": ["Defense", "Result"], "rows": [["Wool, wood, stone", "Breaks easily"], ["Ceramic", "Breaks fairly easily, about 2x better than obsidian"], ["8 obsidian around the bed", "1-3 blocks, depending on how you hit it"], ["2 layers of obsidian", "Can break through, but not every block"], ["3+ layers of obsidian", "Can't expose the bed"]]}], "strategy": [{"title": "Speed", "text": "If you only want it for movement, go ahead. The Dino is a fast way to get around."}, {"title": "Bed breaking", "text": "Ceramic, wool, wood and stone are really easy to break. Obsidian is hard but doable in harder lobbies."}, {"title": "Beating Anti-Dino", "text": "If you see an Anti-Dino defense, have a teammate (or yourself) rain TNT everywhere to clear the blocks. Use Siege TNT against ceramic. Against obsidian, the Dino won't help as much."}], "counter": [{"title": "Spam blocks", "text": "Spam wool around your bed and place blocks everywhere so it can't charge in."}, {"title": "Anti-Dino defense", "text": "Place blocks around the second layer of your defense (it ends up looking like a UFO), so the charge only breaks the outer wool and ceramic and doesn't expose the bed."}], "skins": [], "bal": "sup", "balWhy": "You lose the Dino when you die, and these days it's mostly used for speed since the charge is very easy to counter. It isn't very unique and needs a rework."},
{"name": "Drill", "img": "images/kits/drill.webp", "cls": "Economy", "tiers": {"casual": "A", "ranked": "B"}, "diff": "easy", "hp": "100", "desc": "Purchase Drills to deploy on Diamond and Emerald generators. Drills automatically harvest 2x gen resources. Control them to fight off attackers.", "adv": "Drill spawns with a Drill and a Tablet. You can buy more Drills for 3 emeralds each and hold as many as you want, but only 4 can be placed on the map at once.\nPlace a Drill on a diamond or emerald generator to take it over and double its resources: you get 1 of that resource straight into your inventory, and the generator's own drop is stored inside the drill. There's also a 25% chance for an extra diamond or emerald to spawn inside it. You or your teammates can take the stored resources by holding R (Extract Ore).\nDrills get stronger as the match goes on: damage goes up at 5 and 10 minutes, and HP goes up at 6:40 and 13:20. They slowly heal themselves over time, and you get a notification when one of your drills takes damage. If an enemy destroys a drill, they get all the loot stored inside it. They attack with a 0.5 second cooldown, but can't hit players standing 2 blocks above them within 3 blocks.\nUse the Tablet to control your drills, and press A or D to cycle back and forth between them.", "items": [{"name": "Drill", "img": "images/items/drill.png", "note": "Cost: 3 emeralds", "desc": "Place it on a diamond or emerald generator to double its resources. 425 HP and 30 damage at the start, getting stronger as the match goes on. Only 4 can be placed at once.", "cd": 0.5, "dmg": 30, "dmgText": "30 / 42 / 54 (at 0, 5 and 10 minutes)"}, {"name": "Tablet", "img": "images/items/tablet.png", "note": "Spawns with it", "desc": "Take control of your drills. Press A or D to cycle back and forth between them."}], "abilities": [{"name": "Swap Drills", "img": "images/abilities/ability-template.png", "note": "Only while on the Tablet", "desc": "Press A or D to switch to the previous or next drill.", "nodps": true}, {"name": "Extract Ore", "img": "images/abilities/ability-template.png", "note": "Next to a drill", "desc": "Hold R to take the resources stored inside a drill. Works for you and your teammates.", "nodps": true}], "history": [{"type": "nerf", "date": "Jul 17, 2026", "title": "", "changes": ["Drill Health:", "Early game: 450 → 425", "Mid game: 750 → 700", "Late game: 900 → 850", "Drill damage:", "Early game: 32 → 30", "Mid game: 45 → 42", "Late game: 58 → 54"]}, {"type": "buff", "date": "Oct 17, 2025", "title": "", "changes": ["Removed purchase limit for drills", "Reduced hitbox"]}, {"type": "buff", "date": "Feb 28, 2025", "title": "", "changes": ["Increased drill out of combat heal speed"]}, {"type": "buff", "date": "Nov 8, 2024", "title": "", "changes": ["Drill attack range increased 25% horizontally and 50% vertically"]}, {"type": "buff", "date": "Sep 27, 2024", "title": "", "changes": ["Increased max number of drills 3 → 4", "Increased early-game drill health 400 → 450", "Increased mid-game drill health 600 → 750", "Increased late-game drill health 800 → 900"]}, {"type": "buff", "date": "Sep 13, 2024", "title": "", "changes": ["Drills now have a 25% chance to triple generator drops"]}, {"type": "buff", "date": "May 17, 2024", "title": "", "changes": ["Increased drill damage scaling over time: 30 → 32, 40 → 45, 50 → 58 at 0m/5m/10m", "Fixed drills being locked in the item shop when destroyed"]}, {"type": "nerf", "date": "Apr 5, 2024", "title": "Season X", "changes": ["Drill cost: 2 emeralds → 3 emeralds", "Max drills on the map per player: 3"]}, {"type": "bal", "date": "Mar 29, 2024", "title": "", "changes": ["Drill health increases as the match goes on.", "Early game hp: 600 → 400", "Mid game hp: 600", "Late game hp: 800"]}, {"type": "buff", "date": "Nov 3, 2023", "title": "", "changes": ["Increased drill health 500hp → 600hp"]}, {"type": "buff", "date": "Jul 14, 2023", "title": "", "changes": ["Drill will now heal slowly after exiting combat"]}, {"type": "buff", "date": "Jun 2, 2023", "title": "", "changes": ["Now spawns with a drill at the beginning of the match"]}, {"type": "nerf", "date": "May 12, 2023", "title": "", "changes": ["The drill owner will now only get half of the resources from the drill. The other half will be stored in the drill. Drill owner’s team members can interact with the drill to take the stored resources. Enemies can also get the stored resources by destroying the drill."]}, {"type": "buff", "date": "Apr 21, 2023", "title": "", "changes": ["Drill damage scaled over time: 30 → 40 → 50 at 0m/5m/10m"]}], "obtain": {"src": "Season 7 Battle Pass", "tier": "10 (free)", "badge": "images/bp/s7.webp", "rent": 2000}, "passives": [{"name": "Duplication", "when": "Drill on a generator", "desc": "You get 1 of the generator's resource in your inventory and its own drop is stored in the drill. 25% chance for an extra diamond or emerald inside it."}, {"name": "Scaling", "when": "As the match goes on", "desc": "Damage goes up at 5 and 10 minutes (max 54). HP goes up at 6:40 and 13:20 (max 850)."}, {"name": "Self Repair", "when": "Over time", "desc": "Drills slowly regenerate their health."}, {"name": "Alarm", "when": "Drill takes damage", "desc": "You get a notification when one of your drills is being damaged."}, {"name": "Loot Drop", "when": "Drill destroyed", "desc": "Whoever destroys the drill gets all the loot stored inside it."}, {"name": "Blind Spot", "when": "Always", "desc": "Drills can't hit players standing 2 blocks above them within 3 blocks."}], "tables": [{"title": "Drill stats by match time", "head": ["Match time", "Damage", "HP"], "rows": [["Start", "30", "425"], ["5:00", "42", "425"], ["6:40", "42", "700"], ["10:00", "54 (max)", "700"], ["13:20", "54", "850 (max)"]], "note": "Drills attack every 0.5 seconds."}], "strategy": [{"title": "Go to diamonds first", "text": "When you spawn, rush to the diamond generator instead of the emerald one. Lots of people go to {"name": "Eldric", "img": "images/kits/eldric.webp", "cls": "Fighter", "tiers": {"casual": "OP", "ranked": "C"}, "diff": "hard", "hp": "100", "desc": "Drain health from enemies or sacrifice your health to heal allies. Could be unlocked for FREE by completing Crypt's Coven during the Halloween 2023 event.", "adv": "Eldric spawns with the Warlock Staff. Lock onto an enemy within 8 blocks to drain their HP every 0.75 seconds. The damage ramps up the longer you stay attached (+5 over about 8 ticks at 0 stacks) and is higher the closer you are: you deal full damage within about 3 blocks, and damage drops off the farther away you are. A yellow bar warns you between 8 and 10 blocks, and past 10 blocks you detach. The staff ignores 50% of armor.\nEvery hit heals you about 35% of the damage. If you're already at full HP, that healing turns into shield instead, up to 25.\nYou can also lock onto a teammate to heal them every tick (3 HP at 0 stacks, 27 at 30 stacks). It costs you 3.5 HP per tick, and they deal 25% more damage while linked.\nYou get a stack when you kill with the staff, when you get an assist (a teammate gets a kill while you're linked to them or to their target), or by killing NPCs like Diamond Guards. Each stack adds about 1.4 damage per tick and more healing, and the range grows too: at max stacks you can lock on from 12 blocks and stay attached up to 14. Max 30 stacks.", "items": [{"name": "Warlock Staff", "img": "images/items/warlock-staff.png", "note": "Spawns with it", "desc": "Lock onto an enemy to drain them, or a teammate to heal them. Ticks every 0.75 seconds. 8 block range (12 at max stacks), 50% armor penetration.", "cd": 0.75, "dmg": 11, "dmgText": "11-16 per tick at 0 stacks, 53-57 at 30", "nodps": true}], "abilities": [], "history": [{"type": "buff", "date": "Oct 30, 2026", "title": "", "changes": ["Siphon Link Damage increased by 20% against close range target"]}, {"type": "buff", "date": "Jul 3, 2026", "title": "", "changes": ["Base damage per {"name": "Ember", "img": "images/kits/ember.webp", "cls": "Fighter", "tiers": {"casual": "C", "ranked": "F"}, "diff": "hard", "hp": "100", "desc": "Charge the Blade of Fire to ignite in a deadly spin! Striking enemies OR killing Lumen will upgrade your ability to a much more powerful spin.", "adv": "Ember can buy the Infernal Saber for 3 emeralds. It hits like a diamond sword (42 damage, same cooldown), but you can also hold it to charge a fire spin. It takes 1 second to fully charge, but letting go at 0.5 seconds does the same damage, and you can start charging again right after a spin.\nThe base spin hits twice, 0.25 seconds apart, for 42 then 48 damage. Within 2 blocks both hits land; from 2 to 5 blocks only the 48 hit lands. Every hit sets the enemy on fire for 2 ticks of 3 damage.\nHit 10 spins (each enemy hit counts, so 2 enemies in one spin fill 20%) or kill a Lumen to upgrade the spin. The upgraded spin hits three times for 42, 48 and 48, and its fire does 5 damage for 6 ticks. Past 3 blocks you only get the two 48 hits. The upgraded spin has 40% armor penetration and deals 30% more damage when it only hits one enemy; the base spin has no armor penetration.\nYour upgrade bar stays when you die, but you lose the saber and have to buy it again for the full 3 emeralds. Ember can't buy diamond or emerald swords.", "items": [{"name": "Infernal Saber", "img": "images/items/infernal-saber.png", "note": "Cost: 3 emeralds", "desc": "Hits like a diamond sword (42 damage). Hold to charge a fire spin: 0.5 seconds is enough for full damage. Lost on death, and buying it again costs the full 3 emeralds.", "dmg": 42, "cd": 0.5, "dmgText": "Spin: 42 + 48 (upgraded 42 + 48 + 48)", "nodps": true}], "abilities": [], "history": [{"type": "buff", "date": "Oct 30, 2026", "title": "", "changes": ["Spin deals 30% increased damage against single target", "Slightly Shortened sword swing block duration for upgraded spins."]}, {"type": "buff", "date": "Aug 21, 2026", "title": "", "chang ": [{"name": "Fire Spin", "when": "Releasing a charged spin", "desc": "Base: 42 + 48 within 2 blocks, or just 48 from 2-5 blocks, plus fire (3 damage × 2 ticks). Upgraded: 42 + 48 + 48 within 3 blocks, or 48 + 48 farther out, plus fire (5 damage × 6 ticks)."}, {"name": "Upgrade Bar", "when": "Spin hits or Lumen kills", "desc": "Each enemy hit by a spin fills 10%. Killing a Lumen (with or without the saber) upgrades it instantly. The bar stays when you die."}, {"name": "Lone Target", "when": "Upgraded spin hits one enemy", "desc": "The upgraded spin deals 30% more damage when it only hits one enemy."}, {"name": "No Better Swords", "when": "Always", "desc": "Ember can't buy diamond or emerald swords."}], "tables": [{"title": "Spin damage", "head": ["Spin", "Within 2-3 blocks", "Up to 5 blocks", "Fire", "Armor penetration"], "rows": [["Base", "42 + 48 = 90", "48", "3 × 2 ticks", "0%"], ["Upgraded", "42 + 48 + 48 = 138 (about 179 on one enemy)", "48 + 48 = 96", "5 × 6 ticks", "40%"]], "note": "Before armor. Base: both hits within 2 blocks. Upgraded: all three within 3 blocks. Fire has no armor penetration."}, {"title": "Spin damage by armor (one enemy, close up, with fire)", "head": ["Spin", "Diamond armor", "Emerald armor"], "rows": [["Base", "23.1", "15.4"], ["Upgraded", "67.22", "46.43"]], "note": "From tests."}], "strategy": [{"title": "Hit and run", "text": "Make enemies afraid of your spins: run away to charge it, then run back at them once it's ready."}, {"title": "Open with a spin", "text": "Spin once at the start of a fight, then fight normally. The saber has the same damage and cooldown as a diamond sword."}], "counter": [{"title": "Keep your distance", "text": "Stay away from it. If you dodge a charged spin, hit it while it charges again."}, {"title": "Ranged and resets", "text": "Use ranged weapons, or kill it so it loses the saber and has to buy it again before it can keep upgrading."}], "skins": [{"name": "Krampus Skin", "img": "images/skins/ember-krampus.
